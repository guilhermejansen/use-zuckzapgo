      - application/json
      description: Update the user's global WhatsApp presence status (available/unavailable).
        This affects whether you appear online to your contacts.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Set presence status
      tags:
      - User
  /user/privacy/settings:
    get:
      consumes:
      - application/json
      description: Retrieve the current WhatsApp privacy settings for the authenticated
        user including last seen, profile photo, status, and group permissions
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get privacy settings
      tags:
      - Privacy
  /user/pushname:
    post:
      consumes:
      - application/json
      description: Update the user's WhatsApp display name (push name). This is the
        name that appears when you send messages to others.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Change push name
      tags:
      - User
  /user/status:
    get:
      consumes:
      - application/json
      description: Retrieve the current WhatsApp status message (about) for the authenticated
        user
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get current status
      tags:
      - User
    post:
      consumes:
      - application/json
      description: Update the user's WhatsApp status message (about). Maximum 139
        characters.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Set status message
      tags:
      - User
  /user/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: name and token strings; at least one change is required
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Update User Profile
      tags:
      - User
  /user/username/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Username and optional four-digit key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.UserUsernameResolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UserUsernameResolveResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      summary: Resolve a WhatsApp username
      tags:
      - User
  /webhook:
    delete:
      consumes:
      - application/json
      description: Remove the primary and fallback webhook URLs and clear all subscribed
        events for the authenticated user
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Delete webhook configuration
      tags:
      - Webhook
    get:
      consumes:
      - application/json
      description: Retrieve the current primary webhook URL, optional fallback webhook
        URL, and subscribed events for the authenticated user
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              fallback_webhook:
                type: string
              subscribe:
                items:
                  type: string
                type: array
              webhook:
                type: string
            type: object
      summary: Get webhook configuration
      tags:
      - Webhook
    post:
      consumes:
      - application/json
      description: Configure a primary webhook URL and subscribe to specific events.
        fallback_webhookurl is optional; omitting it preserves the stored value and
        an empty value clears it.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Webhook configuration; fallback_webhookurl is optional
        in: body
        name: request
        required: true
        schema:
          properties:
            events:
              items:
                type: string
              type: array
            fallback_webhookurl:
              type: string
            webhookurl:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              fallback_webhook:
                type: string
              webhook:
                type: string
            type: object
      summary: Set webhook configuration
      tags:
      - Webhook
    put:
      consumes:
      - application/json
      description: Update the primary webhook URL, optional fallback URL, events,
        and activation status. Omitting fallback_webhookurl preserves it; an empty
        value clears it.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Webhook configuration; fallback_webhookurl is optional
        in: body
        name: request
        required: true
        schema:
          properties:
            active:
              type: boolean
            events:
              items:
                type: string
              type: array
            fallback_webhookurl:
              type: string
            webhookurl:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              active:
                type: boolean
              events:
                items:
                  type: string
                type: array
              fallback_webhook:
                type: string
              webhook:
                type: string
            type: object
      summary: Update webhook configuration
      tags:
      - Webhook
schemes:
- http
- https
securityDefinitions:
  AdminAuth:
    description: Admin authentication token. Must match ZUCKZAPGO_ADMIN_TOKEN environment
      variable.
    in: header
    name: Authorization
    type: apiKey
  UserAuth:
    description: User authentication token. Can also be passed as query parameter.
    in: header
    name: token
    type: apiKey
