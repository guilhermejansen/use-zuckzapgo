      - application/json
      responses:
        "200":
          description: Check results — Username, VerifiedLevel and DisappearingMode
            are omitted when unknown
          schema:
            properties:
              Users:
                items:
                  properties:
                    DisappearingMode:
                      properties:
                        duration_sec:
                          type: integer
                        enabled:
                          type: boolean
                        set_at:
                          type: string
                      type: object
                    IsInWhatsapp:
                      type: boolean
                    JID:
                      type: string
                    LID:
                      type: string
                    Query:
                      type: string
                    Username:
                      type: string
                    VerifiedLevel:
                      type: string
                    VerifiedName:
                      type: string
                  type: object
                type: array
            type: object
        "400":
          description: Missing or undecodable Phone payload
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session, or the usync query failed
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Check if users are on WhatsApp
