      description: Performs a complete session refresh including reconnection and
        full synchronization of all WhatsApp data. Syncs all 5 app state patches,
        checks/uploads prekeys, refreshes privacy settings, and supports auto-recovery
        for failed syncs. All sync options default to true for a complete refresh.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Sync options (all default to true)
        in: body
        name: request
        schema:
          properties:
            auto_recovery:
              type: boolean
            refresh_prekeys:
              type: boolean
            refresh_privacy:
              type: boolean
            sync_app_state:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Refresh completed with sync results
          schema:
            properties:
              Details:
                type: string
              jid:
                type: string
              newConnected:
                type: boolean
              newLoggedIn:
                type: boolean
              refreshSuccess:
                type: boolean
              sync:
                type: object
              sync_options:
                type: object
              wasConnected:
                type: boolean
              wasLoggedIn:
                type: boolean
            type: object
        "400":
          description: No JID found, QR scan required
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Connection refresh failed
