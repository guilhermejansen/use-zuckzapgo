    properties:
      caption:
        description: The caption of the image or the video; only with image or video.
        example: Which of these covers do you prefer?
        type: string
      image:
        description: An image, as a base64 data URL or an HTTP(S) URL.
        example: https://example.com/question-cover.jpg
        type: string
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
      text:
        description: The question text. Send exactly one of text, image or video.
        example: Which topic should the next post cover?
        type: string
      video:
        description: A video, as a base64 data URL or an HTTP(S) URL.
        example: https://example.com/question-clip.mp4
        type: string
    type: object
  main.NewsletterQuestionStateRequest:
    description: Contains the response and the state to set.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
      response_server_id:
        description: The response_server_id of the response, exactly as it was returned.
        example: "4581"
        type: string
      server_id:
        description: The server_id of the question post.
        example: 120
        type: integer
      state:
        description: star, unstar, hide or unhide.
        example: star
        type: string
    required:
    - response_server_id
    - server_id
    - state
    type: object
  main.NewsletterRecommendedRequest:
    description: Optional region, how many channels to ask for, and whether to skip
      the app's filters.
    properties:
      country_code:
        description: Optional region, as a two-letter ISO 3166-1 alpha-2 code. Case-insensitive.
        example: BR
        type: string
      include_subscribed:
        description: true returns WhatsApp's list as it came, without hiding followed
          or suspended channels.
        example: false
        type: boolean
      limit:
        description: How many channels to ask WhatsApp for (1-20, default 20, what
          the official client asks for).
        example: 20
        type: integer
    type: object
  main.NewsletterRecommendedResponse:
    properties:
      country_code:
        description: The region that was sent, in upper case; left out when none.
        example: BR
        type: string
      hidden_inactive:
        description: How many channels were hidden because they are suspended or geosuspended.
        example: 0
        type: integer
      hidden_subscribed:
        description: How many channels were hidden because this session follows them.
        example: 1
        type: integer
      include_subscribed:
        description: 'Echo of the request: true means neither filter ran.'
        example: false
        type: boolean
      limit:
        description: What was asked of WhatsApp; returned can be smaller once the
          filters ran.
        example: 20
        type: integer
      newsletters:
        description: The recommended channels left after the filters, in WhatsApp's
          order.
        items:
          $ref: '#/definitions/main.NewsletterDirectoryItem'
        type: array
      returned:
        description: What is in newsletters, after the filters.
        example: 1
        type: integer
      subscribed_filter_applied:
        description: |-
          true when the channels this session follows were read and hidden; false with
          include_subscribed, or when that read failed and the followed ones may still be listed.
        example: true
        type: boolean
      subscribed_marked:
        description: true when every channel carries subscribed; false when the followed
          channels could not be read.
        example: true
        type: boolean
      success:
        description: Always true in a 200 answer.
        example: true
        type: boolean
    type: object
  main.NewsletterReportAppealItem:
    properties:
      appeal_id:
        type: string
      created_at:
        description: Unix seconds; left out when not reported.
        type: integer
      reason:
        type: string
      state:
        description: As WhatsApp sent it; the apps know PENDING, SUCCESS, REJECT,
          CONTENT_UNAVAILABLE and NON_APPEALABLE.
        example: PENDING
        type: string
    type: object
  main.NewsletterReportAppealReasonItem:
    properties:
      label:
        type: string
      reason:
        type: string
    type: object
  main.NewsletterReportChannelRequest:
    description: Contains the JID of the channel to report.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
    type: object
  main.NewsletterReportChannelResponse:
    properties:
      newsletter_jid:
        type: string
      post_samples_sent:
        description: 'Always 0: no post samples go with the report (the official apps
          send up to five).'
        type: integer
      report_id:
        description: The report's id, when WhatsApp gave one.
        type: string
      success:
        type: boolean
    type: object
  main.NewsletterReportContentItem:
    properties:
      message_server_id:
        description: The reported post's server ID, for type message.
        type: integer
      question_server_id:
        description: The server ID of the question the reported answer replied to,
          for type response.
        type: integer
      response_server_id:
        description: The reported answer's server ID, for type response.
        type: integer
      status_server_id:
        description: The reported channel status's server ID, for type status.
        type: integer
      type:
        description: channel, message (a post), status (a channel status) or response
          (an answer to a channel question).
        example: message
        type: string
    type: object
  main.NewsletterReportItem:
    properties:
      appeal:
        $ref: '#/definitions/main.NewsletterReportAppealItem'
      appeal_reason_options:
        items:
          $ref: '#/definitions/main.NewsletterReportAppealReasonItem'
        type: array
      content:
        $ref: '#/definitions/main.NewsletterReportContentItem'
      created_at:
        description: Unix seconds; left out when not reported.
        type: integer
      newsletter_jid:
        example: 120363000000000022@newsletter
        type: string
      newsletter_name:
        type: string
      report_id:
        type: string
      status:
        description: As WhatsApp sent it; the apps know PENDING, SUCCESS, FAIL and
          CONTENT_UNAVAILABLE.
        example: PENDING
        type: string
      updated_at:
        description: Unix seconds; left out when not reported.
        type: integer
    type: object
  main.NewsletterReportsRequest:
    description: Contains the language of the texts.
    properties:
      locale:
        description: Language of the texts, as a code such as en or pt-BR (default
          en).
        example: pt-BR
        type: string
    type: object
  main.NewsletterReportsResponse:
    properties:
      locale:
        type: string
      reports:
        items:
          $ref: '#/definitions/main.NewsletterReportItem'
        type: array
      returned:
        type: integer
      success:
        type: boolean
    type: object
  main.NewsletterSimilarRequest:
    description: Channel JID, optional region and how many channels to ask for.
    properties:
      country_code:
        description: Optional region, as a two-letter ISO 3166-1 alpha-2 code. Case-insensitive.
        example: BR
        type: string
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      limit:
        description: How many channels (1-10, default 10, what the official client
          asks for).
        example: 10
        type: integer
      newsletter_jid:
        description: Channel JID, digits followed by @newsletter and no device. Required,
          here or in its alias jid. The channel does not need to be followed.
        example: 120363000000000022@newsletter
        type: string
    type: object
  main.NewsletterSimilarResponse:
    properties:
      country_code:
        description: The region that was sent, in upper case; left out when none.
        example: BR
        type: string
      limit:
        description: How many channels were asked of WhatsApp, after the default was
          applied.
        example: 10
        type: integer
      newsletter_jid:
        description: The channel the similar ones were read for.
        example: 120363000000000022@newsletter
        type: string
      newsletters:
        description: The similar channels, as WhatsApp sent them; each carries only
          jid, name, picture, verification, state and subscribed.
        items:
          $ref: '#/definitions/main.NewsletterDirectoryItem'
        type: array
      returned:
        description: How many channels are in newsletters.
        example: 1
        type: integer
      subscribed_marked:
        description: true when every channel carries subscribed; false when the followed
          channels could not be read.
        example: true
        type: boolean
      success:
        description: Always true in a 200 answer.
        example: true
        type: boolean
    type: object
  main.NewsletterTargetRequest:
    properties:
      Code:
        description: Channel invite code or `https://whatsapp.com/channel/<code>`
          link (max 2048 bytes) for follow-invite/unfollow-invite; aliases code, invite_code.
        example: 0029VaExampleInviteCode01
        type: string
      NewsletterJID:
        description: Newsletter JID (`<digits>@newsletter`) for follow, unfollow,
          info, messages; aliases newsletter_jid, jid, NewsletterID.
        example: 120363000000000022@newsletter
        type: string
      before_id:
        description: On /newsletter/messages, return posts older than this server
          message ID (string or integer); aliases before, Before.
        example: "120"
        type: string
      limit:
        description: Posts to return on /newsletter/messages (1-1000, default 25);
          aliases count, Count.
        example: 25
        type: integer
      newsletter_jid:
        description: Snake-case alias of NewsletterJID; must be identical when both
          are sent.
        example: 120363000000000022@newsletter
        type: string
    type: object
  main.NewsletterTransferOwnershipRequest:
    description: Contains the channel JID, the new owner and whether to also drop
      your own admin role.
    properties:
      dismiss_self_as_admin:
        description: |-
          Also drop your own admin role once the transfer succeeds, as the official apps do.
          Defaults to false: the transfer alone leaves you an admin, and getting that role
          back needs an admin invite from the new owner.
        example: false
        type: boolean
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: |-
          The channel JID: digits followed by @newsletter, without a device part. Required,
          here or in its alias jid.
        example: 120363000000000022@newsletter
        type: string
      phone:
        description: |-
          The new owner: a phone number, an @s.whatsapp.net JID or an @lid JID. Required. They
          must already be an admin of this channel.
        example: "5511999999999"
        type: string
    type: object
  main.PasskeyResponsePayload:
    properties:
      id:
        description: Credential ID from the WebAuthn assertion, sent as-is (required).
        example: Y3JlZGVudGlhbC1pZC0wMDAx
        type: string
      rawId:
        description: Raw credential ID, base64url without padding (required).
        example: Y3JlZGVudGlhbC1pZC0wMDAx
        type: string
      response:
        description: Authenticator assertion data; all values base64url without padding.
        properties:
          authenticatorData:
            description: Authenticator data bytes, base64url without padding (required).
            example: ZmljdGl0aW91cy1hdXRoZW50aWNhdG9yLWRhdGE
            type: string
          clientDataJSON:
            description: Client data JSON bytes, base64url without padding (required).
            example: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0Iiwib3JpZ2luIjoiaHR0cHM6Ly93ZWIud2hhdHNhcHAuY29tIn0
            type: string
          signature:
            description: Assertion signature bytes, base64url without padding (required).
            example: ZmljdGl0aW91cy1zaWduYXR1cmUtYnl0ZXM
            type: string
          userHandle:
            description: Optional user handle bytes, base64url without padding.
            example: dXNlci1oYW5kbGUtMDAwMQ
            type: string
        type: object
      type:
        description: Credential type, normally public-key (required).
        example: public-key
        type: string
    type: object
  main.QuickReplyItem:
    properties:
      associated_label_ids:
        description: Labels the app associated with the quick reply; kept when the
          quick reply is edited. Omitted when there are none.
        example:
        - "16"
        items:
          type: string
        type: array
      count:
        description: How many times the quick reply was used, as counted by WhatsApp.
          A new quick reply starts at 0 and an edit keeps the current count.
        example: 3
        type: integer
      deleted:
        description: '`true` on a deleted quick reply, returned only by `GET /quick-reply/list?include_deleted=true`;
          omitted otherwise.'
        example: true
        type: boolean
      id:
        description: Quick reply id; the gateway and the iPhone app write an uppercase
          UUID.
        example: 8F14E45F-CEEA-467A-9575-0A2B3C4D5E6F
        type: string
      keywords:
        description: Search keywords; an empty list when there are none.
        example:
        - thanks
        - support
        items:
          type: string
        type: array
      message:
        description: Text inserted by the shortcut. Empty on a deleted quick reply
          written by this gateway.
        example: Thank you for reaching out! We will reply shortly.
        type: string
      shortcut:
        description: Typed after "/" in the chat box to insert the message, stored
          without the slash. Empty on a deleted quick reply written by this gateway.
        example: thanks
        type: string
      updated_at:
        description: When WhatsApp recorded the last change (RFC 3339, UTC). Omitted
          when the record has no time and in the answer of a create or an edit.
        example: "2026-11-11T14:02:33Z"
        type: string
    type: object
  main.QuickReplyRequest:
    properties:
      keywords:
        description: 'Optional search keywords: up to 3, each up to 15 characters.
          Blank and repeated keywords are dropped. On edit, omitted keeps the current
          keywords and an empty list removes them.'
        example:
        - thanks
        - support
        items:
          type: string
        type: array
      message:
        description: Text inserted by the shortcut. Up to 4096 bytes. Required on
          create; on edit, omitted keeps the current message.
        example: Thank you for reaching out! We will reply shortly.
        type: string
      shortcut:
        description: Typed after "/" in the chat box to insert the message; a leading
          "/" is removed. Up to 25 characters, single line. Required on create; on
          edit, omitted keeps the current shortcut.
        example: thanks
        type: string
    type: object
  main.ResponseWithExtras:
    properties:
      data: {}
      extras:
        additionalProperties: true
        type: object
      success:
        type: boolean
    type: object
  main.UpdateGroupParticipantsRequest:
    properties:
      Action:
        description: add, remove, promote or demote.
        enum:
        - add
        - remove
        - promote
        - demote
        example: add
        type: string
      GroupJID:
        description: Group JID (@g.us).
        example: 120363000000000011@g.us
        type: string
      Phone:
        description: 'Participants: phone digits, @s.whatsapp.net or @lid JIDs without
          device.'
        example:
        - "5511999999999"
        - 123456789012345@lid
        items:
          type: string
        type: array
      send_history:
        allOf:
        - $ref: '#/definitions/main.GroupAddSendHistoryOptions'
        description: |-
          SendHistory, with Action "add", also sends the group's newest retained
          messages to the participants that were added, like the app's own button.
          Absent, nothing changes: the request adds participants and nothing else.
    type: object
  main.UserContactLinkResolveRequest:
    properties:
      code:
        description: Contact QR code or https://wa.me/qr/ URL, 1-2048 bytes, no whitespace
          (required).
        example: https://wa.me/qr/ABCDEFGHIJKL12
        maxLength: 2048
        minLength: 1
        type: string
    type: object
  main.UserContactLinkResolveResponse:
    properties:
      data:
        $ref: '#/definitions/types.ContactQRLinkTarget'
      success:
        type: boolean
    type: object
  main.UserIdentityCodesResponse:
    properties:
      data:
        $ref: '#/definitions/whatsmeow.IdentityVerificationCodes'
      success:
        type: boolean
    type: object
  main.UserUsernameResolveRequest:
    properties:
      key:
        description: Optional four-digit key required by some usernames.
        example: "4821"
        maxLength: 4
        minLength: 4
        type: string
      username:
        description: WhatsApp username, 3-35 chars, optional leading @, no whitespace
          (required).
        example: examplestore
        type: string
    type: object
  main.UserUsernameResolveResponse:
    properties:
      data:
        $ref: '#/definitions/types.UsernameResolution'
      success:
        type: boolean
    type: object
  main.WebAccount:
    properties:
      accountSignature:
        description: Account signature issued at pairing, base64 (required).
        example: FRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0BBQkNERUZHSElKS0xNTk9QUVJTVA==
        type: string
      accountSignatureKey:
        description: Public key that produced the account signature, base64 (required).
        example: HyAhIiMkJSYnKCkqKywtLi8wMTIzNDU2Nzg5Ojs8PT4=
        type: string
      details:
        description: Serialized ADVDeviceIdentity details, base64 (required).
        example: CwwNDg8QERITFBUWFxgZGhscHR4fICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6
        type: string
      deviceSignature:
        description: Device signature, base64 (required).
        example: KSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj9AQUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVpbXF1eX2BhYmNkZWZnaA==
        type: string
    type: object
  main.WebDeviceSnapshot:
    properties:
      account:
        allOf:
        - $ref: '#/definitions/main.WebAccount'
        description: ADVSignedDeviceIdentity issued by WhatsApp at pairing (required).
      advSecretKey:
        description: Optional ADV secret key, base64; a fresh random key is kept when
          omitted.
        example: YOUR_ADV_SECRET_KEY_BASE64_32_BYTES
        type: string
      businessName:
        description: Optional business name stored on the device.
        example: Example Store
        type: string
      identityKey:
        allOf:
        - $ref: '#/definitions/main.WebKeyPair'
        description: Signal identity key pair of the device (required).
      lid:
        description: Optional device LID JID, e.g. 123456789012345:12@lid.
        example: 123456789012345:12@lid
        type: string
      meJid:
        description: Device JID of the imported session, e.g. 5511999999999:12@s.whatsapp.net
          (required).
        example: 5511999999999:12@s.whatsapp.net
        type: string
      noiseKey:
        allOf:
        - $ref: '#/definitions/main.WebKeyPair'
        description: Noise protocol key pair of the device (required).
      platform:
        description: Optional platform label stored on the device.
        example: chrome
        type: string
      pushName:
        description: Optional push name stored on the device.
        example: Support Line
        type: string
      registrationId:
        description: Signal registration ID of the device; must be non-zero (required).
        example: 12345
        type: integer
      signedPreKey:
        allOf:
        - $ref: '#/definitions/main.WebSignedPreKey'
        description: Signed pre-key with its identity-key signature (required).
    type: object
  main.WebKeyPair:
    properties:
      priv:
        description: Private key, 32 bytes, base64 (standard or URL alphabet, padded
          or not) (required).
        example: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
        type: string
      pub:
        description: Optional public key, base64; ignored because it is derived from
          priv.
        example: yVb3ZlK0exampleDerivedPublicKey0000000000=
        type: string
    type: object
  main.WebSignedPreKey:
    properties:
      keyId:
        description: Signed pre-key ID.
        example: 1
        type: integer
      priv:
        description: Private key, 32 bytes, base64 (required).
        example: QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVpbXF1eX2A=
        type: string
      pub:
        description: Optional public key, base64; ignored because it is derived from
          priv.
        example: Zm9vYmFyZXhhbXBsZURlcml2ZWRQdWJsaWNLZXkwMA==
        type: string
      signature:
        description: Signature of the public key by the identity key, 64 bytes, base64
          (required).
        example: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXp7fH1+f4CBgoOEhYaHiImKi4yNjo+QkZKTlJWWl5iZmpucnZ6foA==
        type: string
    type: object
  main.chargeAmount:
    properties:
      offset:
        description: 'Divisor of `value`: the amount is `value/offset`.'
        example: 100
        type: integer
      value:
        description: Amount multiplied by `offset`, as written in the billing message.
        example: 15000
        type: integer
    type: object
  main.contactRequestInput:
    properties:
      body:
        description: 'Required (alias `Body`). Text shown above the "Share contact"
          button: 1 to 1024 characters after trimming; never truncated.'
        example: To continue with your request, please share your contact.
        type: string
      context_info:
        additionalProperties:
          type: string
        description: 'Optional quoted reply: stanzaID (the quoted message ID) and
          participant (its author) must be sent together. quotedMessage and remoteJID
          are read as well when present; nothing else in it is used.'
        example:
          participant: 5511999999999@s.whatsapp.net
          stanzaID: 3EB0A1B2C3D4E5F6A7B8C9
        type: object
      id:
        description: 'Optional WhatsApp message ID ([A-Za-z0-9], up to 128). Reuse
          the same id on every retry: it is the idempotency key.'
        example: 3EB0A1B2C3D4E5F6A7B8C9
        type: string
      number_check:
        description: 'Optional: verify the phone number is on WhatsApp before sending
          (phone-number recipients only).'
        example: true
        type: boolean
      phone:
        description: 'Required (alias `Phone`). One-to-one recipient: a phone number
          in digits (optional +), a phone JID such as `5511999999999@s.whatsapp.net`,
          or a LID such as `100000000000001@lid`. Groups, newsletters, broadcast and
          status are rejected.'
        example: "5511999999999"
        type: string
      presence:
        description: Optional typing indicator duration in milliseconds before sending.
        example: 1500
        type: integer
    required:
    - body
    - phone
    type: object
  main.groupParticipantHandleRequest:
    properties:
      expected_revision:
        description: '`revision` of the operation as last read by the caller: 1 or
          more. Another current revision answers 409 `stale_reservation`.'
        example: 1
        type: integer
      reservation_token:
        description: 'Reservation token answered by `POST /group/participant-operations`:
          43 base64url characters. Only the latest token issued for the operation
          is valid.'
        example: EXAMPLE_reservation_token_00000000000000000
        type: string
    type: object
  main.groupParticipantOperationRequest:
    properties:
      action:
        description: '`add`, `remove`, `promote` or `demote` for `participants.update`;
          `approve` or `reject` for `requests.update`; `guard` for `semantic.guard`.'
        example: remove
        type: string
      caller_key:
        description: 'Idempotency key chosen by the caller: 1 to 128 letters, digits,
          `_` or `-` (longer answers 413). The same key with the same request returns
          the same operation; with a different request it answers 409 `key_conflict`.'
        example: growth-entry-0001
        type: string
      context_ref:
        description: 'Caller''s reference to the context behind the operation: 1 to
          128 bytes (longer answers 413). Part of the request fingerprint.'
        example: synthetic-entry-0001
        type: string
      context_revision:
        description: 'Revision of that context: zero or more. Part of the request
          fingerprint.'
        example: 1
        type: integer
      contract_version:
        description: Contract version; must be `group-participant-operation.v1`.
        example: group-participant-operation.v1
        type: string
      group_jid:
        description: Canonical group JID (`@g.us`, no device).
        example: 120363000000000101@g.us
        type: string
      operation:
        description: '`participants.update`, `requests.update` or `semantic.guard`.'
        example: participants.update
        type: string
      participants:
        description: Up to 256 distinct canonical user JIDs (`@s.whatsapp.net` or
          `@lid`, no device; more answers 413). Required except for `semantic.guard`.
        example:
        - 15550000001@s.whatsapp.net
        - 70000000000001@lid
        items:
          type: string
        type: array
    type: object
  main.groupParticipantOwnerReleaseRequest:
    properties:
      expected_revision:
        description: '`revision` of the operation as last read by the caller: 1 or
          more. Another current revision answers 409 `stale_reservation`.'
        example: 1
        type: integer
      release_version:
        description: Release version; must be `group-participant-operation.owner-release.v1`.
        example: group-participant-operation.owner-release.v1
        type: string
    type: object
  main.orderStateChange:
    properties:
      at:
        description: Unix time (seconds) of the change.
        example: 1795179600
        type: integer
      event:
        description: 'Kind of change: `created` (charge history only), `received`,
          `accepted`, `rejected` (order state only), `payment_status` or `order_status`.'
        example: payment_status
        type: string
      message_id:
        description: WhatsApp message that carried the change; omitted when empty.
        example: 3EB0E1F2A3B4C5D6E7F8A9
        type: string
      note:
        description: 'Order state only: `out_of_order` (phone action outside the expected
          order, recorded anyway) or `backfilled` (order received before tracking
          started); omitted when empty.'
        example: out_of_order
        type: string
      source:
        description: '`api` (sent by this gateway) or `device` (received from WhatsApp
          or sent from the seller''s phone or another device of the account).'
        example: api
        type: string
      value:
        description: New payment or order status, or the order ID for `received`;
          omitted when empty.
        example: captured
        type: string
    type: object
  main.persistedChargeState:
    properties:
      billing_message_id:
        description: ID of the billing message that carries the charge.
        example: 3EB0B1C2D3E4F5A6B7C8D9
        type: string
      buyer:
        description: 'Chat the charge was sent to: a phone JID or a LID.'
        example: 5511999999999@s.whatsapp.net
        type: string
      created_at:
        description: Unix time (seconds) of the charge.
        example: 1795176000
        type: integer
      created_by:
        description: 'Who sent the charge: `api` (this gateway) or `device` (the phone
          or another device of the account).'
        example: api
        type: string
      currency:
        description: Currency code of the billing message; omitted when it has none.
        example: BRL
        type: string
      history:
        description: 'The creation followed by the applied declarations, oldest first.
          At most 50 entries: past that the oldest declarations are dropped and the
          creation stays.'
        items:
          $ref: '#/definitions/main.orderStateChange'
        type: array
      item_count:
        description: Number of items in the order of the billing message.
        example: 1
        type: integer
      order_request_id:
        description: '`order_request_id` of the billing message; present only when
          the charge accepted a received order.'
        example: "1976123456789012"
        type: string
      order_status:
        description: Starts with the order status written in the billing message,
          then holds the last declared order status.
        example: shipped
        type: string
      payment_status:
        description: Empty until a payment status is declared, then the last one declared
          (`pending`, `captured` or `failed` through the API).
        example: captured
        type: string
      reference_id:
        description: '`reference_id` of the billing message.'
        example: REF-0001
        type: string
      total_amount:
        allOf:
