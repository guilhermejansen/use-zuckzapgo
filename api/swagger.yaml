  /connector/pairphone:
    post:
      consumes:
      - application/json
      description: |-
        Get a pairing code to authenticate using phone number instead of QR code
        Connector aliases authenticate with the ephemeral connector token instead of the permanent user token.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Pair by phone number
      tags:
      - Session
  /connector/passkey/challenge:
    post:
      consumes:
      - application/json
      description: |-
        Proactively fetches the WebAuthn request options from WhatsApp and stores them, so GET /passkey/status is deterministic without waiting for the reactive PasskeyRequest event. Returns 503 passkey_unavailable for accounts outside the passkey cohort (normal QR/phone accounts), and 503 not_connected if the instance is not connected. Requires the instance to be connected first.
        Connector aliases authenticate with the ephemeral connector token instead of the permanent user token.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Challenge stored; returns required=true and the WebAuthn publicKey
          schema:
            additionalProperties: true
            type: object
        "500":
          description: No session
          schema:
            additionalProperties: true
            type: object
        "503":
          description: passkey_unavailable or not_connected
          schema:
            additionalProperties: true
            type: object
      summary: Probe the passkey challenge on demand
      tags:
      - Session
  /connector/passkey/confirm:
    post:
      consumes:
      - application/json
      description: |-
        Sends the final confirmation to WhatsApp servers that the pairing code was verified by the user. Required when SkipHandoffUX=false.
        Connector aliases authenticate with the ephemeral connector token instead of the permanent user token.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Confirmation sent successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: SendPasskeyConfirmation failed
          schema:
            additionalProperties: true
            type: object
        "500":
          description: No session
          schema:
            additionalProperties: true
            type: object
      summary: Confirm passkey pairing
      tags:
      - Session
  /connector/passkey/response:
    post:
      consumes:
      - application/json
      description: |-
        Receives a WebAuthn assertion response from the user's authenticator and forwards it to WhatsApp servers. The client MUST NOT construct the rpId: it uses the `publicKey` returned verbatim by GET /session/passkey/status (which carries rpId="whatsapp.com") and runs navigator.credentials.get() only at the ORIGIN "https://web.whatsapp.com". All binary fields must be base64url-encoded (no padding).
        Connector aliases authenticate with the ephemeral connector token instead of the permanent user token.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: WebAuthn assertion response
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.PasskeyResponsePayload'
      produces:
      - application/json
      responses:
        "200":
          description: Response submitted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid payload or base64url encoding
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Rate limit exceeded
          schema:
            additionalProperties: true
            type: object
        "500":
          description: No session or SendPasskeyResponse failed
          schema:
            additionalProperties: true
            type: object
      summary: Submit passkey WebAuthn response
      tags:
      - Session
  /connector/passkey/status:
    get:
      consumes:
      - application/json
      description: |-
        Returns the current passkey challenge, confirmation code, and pairing state. Poll this endpoint after /session/connect when PasskeyRequired=true.
        Connector aliases authenticate with the ephemeral connector token instead of the permanent user token.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Passkey state snapshot
          schema:
            additionalProperties: true
            type: object
      summary: Get passkey status
      tags:
      - Session
