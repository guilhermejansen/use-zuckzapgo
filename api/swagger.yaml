              error:
                type: string
            type: object
      summary: Delete an event with link
      tags:
      - Events
  /event/create:
    post:
      consumes:
      - application/json
      description: 'Creates on WhatsApp''s servers an **event with link**, the kind
        of the Events tab of the official apps, with an optional cover image. `cover_image`
        is a JPEG, PNG or WebP in base64 (or a base64 data URL): the gateway crops
        it to 16:9, limits it to 1600 pixels wide and sends it as the official apps
        do. `cover_preset_handle` selects one of WhatsApp''s ready-made covers instead.
        `call` (`video` or `voice`) attaches a WhatsApp call link. `reminder_offset_sec`
        is 900, 1800, 3600 or 86400. The answer brings the created `event` and an
        `event_invite` object ready for `POST /chat/send/event-invite`, which shares
        the invitation, with the cover, in a chat. These events are not served over
        the WhatsApp socket: the gateway opens a session on WhatsApp''s events service
        with a credential handed over by the phone, so **the phone of the account
        must be online, with WhatsApp open, whenever that session is opened** (503
        otherwise). The session is kept only in memory: it is reused while the gateway
        runs and opened again after a restart, when the account''s WhatsApp client
        starts again, or when WhatsApp stops accepting it. WhatsApp limits how many
        events an account creates per day (429).'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Event to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.EventLinkCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Event created
          schema:
            properties:
              event:
                $ref: '#/definitions/whatsmeow.SharableEvent'
              event_invite:
                $ref: '#/definitions/main.EventInviteFields'
            type: object
        "400":
          description: Invalid field, or WhatsApp refused the event data; nothing
            is created
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Authentication required
          schema:
            properties:
              error:
                type: string
            type: object
        "429":
          description: WhatsApp's daily limit of created events was reached
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session
          schema:
            properties:
              error:
                type: string
            type: object
        "502":
          description: WhatsApp's events service refused the session or the request
          schema:
            properties:
              error:
                type: string
            type: object
        "503":
          description: 'The phone did not answer: it must be online to open the events
            session'
          schema:
            properties:
              error:
                type: string
            type: object
        "504":
          description: WhatsApp's events service did not answer in time
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Create an event with link, with cover image
      tags:
      - Events
  /event/list:
    get:
      description: 'Returns what the Events tab of the official apps shows: upcoming
        and past events the account created or was invited to, and scheduled calls,
        each with its cover (`cover_image_handle`, `cover_image_url`). Past events
        go back 30 days and upcoming ones 365 days; one request with a page size of
        100, not paged. Read from WhatsApp''s events service; the phone of the account
        must be online whenever the events session is opened (see `POST /event/create`).'
      parameters:
