  /newsletter/demote-admin:
    post:
      consumes:
      - application/json
      description: 'Take the admin role away from a channel admin, leaving them a
        follower. The two cases the official client allows are checked here, against
        the channel''s follower list, before anything is sent: the owner demoting
        another admin, or an admin stepping down itself. The owner CANNOT step down,
        which would leave the channel with no owner, and that answers 409 owner_cannot_demote_self
        — transfer the channel first. The other refusals are 409 not_owner and target_not_admin
        (also when the target is missing from the follower list, which did not show
        them as an admin; target_not_in_follower_list when that list came back full,
        5000, so absence proves nothing), and nothing is sent for any of them; 502
        roles_unreadable when the roles could not be read. Every error answer carries
        sent, false when the request never left the gateway and true when it MAY have
        reached WhatsApp, a conservative bound. The demote is never resent after a
        dropped connection, which surfaces as 504 instead. A demote whose outcome
        is unknown answers 504 demote_outcome_unknown and must NOT be retried: read
        the role with /newsletter/admins first. The target is keyed by LID, so the
        contact must be resolvable to a LID (400 otherwise). A change that never left
        the gateway answers 503 whatsapp_not_connected when the connection was lost
        before it left (a session already disconnected when the request arrives gets
        the usual 500 client not connected), 501 unsupported_client_platform or 500
        not_sent, all with sent false: retrying is safe.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Channel and admin
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.NewsletterDemoteAdminRequest'
