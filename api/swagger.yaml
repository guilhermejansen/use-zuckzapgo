          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties: true
            type: object
      summary: Remove the admin role of a channel admin
      tags:
      - Newsletter
  /newsletter/directory:
    post:
      consumes:
      - application/json
      description: 'One page of WhatsApp''s public channel directory, the "Find channels"
        list of the apps. view picks the list: RECOMMENDED (default, what the directory
        opens on), NEW, POPULAR, FEATURED or TRENDING. country_code (ISO 3166-1 alpha-2)
        and category narrow it; the official client sends at most one of each, and
        so does this route. The apps preselect the account''s own country; this route
        does not guess it, so leave country_code out for no region filter or send
        it to see what the app shows. The answer pages for real: while has_next_page
        is true, send next_cursor back as cursor. limit is 1-50 and defaults to 50,
        the official page size. Each channel carries jid, name, description, invite_code
        (usable with /newsletter/follow-invite), handle, subscriber_count, verification,
        state, created_at and the preview picture, whichever WhatsApp sent. The list
        is WhatsApp''s answer as it came, channels this account already follows included;
        each channel carries subscribed, true when this account follows it, read from
        the account''s followed channels. If that read fails the route still answers
        200, the channels come without subscribed and subscribed_marked is false.
        Errors: 400 invalid input, 501 when the bundled library cannot read the directory,
        502 when WhatsApp refuses. On a client platform that cannot send MEX requests
        the read answers 501 unsupported_client_platform with sent false; retrying
        will not help.'
