      description: 'The channels WhatsApp considers similar to one channel, the "Similar
        channels" row of a channel''s info panel in the apps. The channel does not
        need to be followed or administered by this account. country_code (ISO 3166-1
        alpha-2) is optional; the official client sends none. limit is 1-10 and defaults
