          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Check locally retained original group messages
      tags:
      - Group
  /group/history/send:
    post:
      consumes:
      - application/json
      description: 'Requires distinct unused bundle_id and notice_id, and exactly
        one of message_ids (1-200 retained IDs) or last_n (1-200 newest retained messages
        of the group, plus the currently pinned ones outside them; the answer then
        carries "selection"). Every message of the bundle among the newest getMaxPins()
        current pins carries pinInChat, with either selector. A group admin may send;
        an ordinary member may when the group lets every member share history. IDs
        are durably reserved before network; retrying either ID is rejected even after
        failure. Acknowledgements do not prove recipient delivery. Originals are retained
        for a bounded window (GLOBAL_GROUP_HISTORY_RETENTION_DAYS, default 90 days
        which is also the maximum, 0 disables retention; GLOBAL_GROUP_HISTORY_RETENTION_MAX_PER_USER,
        default 100000 newest per user): a message outside the window returns the
        same 409 as a message that was never retained.'
      parameters:
      - description: User token
        in: header
        name: token
        required: true
        type: string
      - description: Group, retained message IDs, recipients and unused operation
          IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GroupHistorySendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      summary: Send retained group history
      tags:
      - Group
  /group/history/send/status:
    post:
      consumes:
      - application/json
      description: LOCAL_TERMINAL requires two matching terminal reservations. All
        absent, partial, attempted, invalid or disagreeing pairs are UNKNOWN. Does
        not reconstruct the original HTTP response or recipient delivery. No IDs are
        released and retry_safe is always false.
      parameters:
      - description: User token
        in: header
        name: token
        required: true
        type: string
      - description: Group, distinct bundle/notice IDs and optional expected request
