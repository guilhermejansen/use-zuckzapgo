  /newsletter/admins:
    post:
      consumes:
      - application/json
      description: 'The owner and the admins of a channel, plus the admin invites
        that were sent and not yet accepted. There is no separate admin query in the
        official client: the admins come from the followers list, filtered by role,
        which is also how the official screen builds it. WhatsApp never lists the
        owner in that list (seen live): when this session owns the channel, its own
        row is added first with source "session" and session_owner_added true; when
        it is an admin, no owner row is added, because the metadata names no other
        owner. The pending invites are a query of their own that WhatsApp answers
        for the channel owner only; when it refuses, the admins are still returned
        and pending_invites_read is false. A phone number is reported under the same
        rule as /newsletter/followers. On a client platform that cannot send MEX requests
        the read answers 501 unsupported_client_platform with sent false; retrying
        will not help.'
      parameters:
      - description: User authentication token
        in: header
        name: token
