  /community/transfer-ownership:
    post:
      consumes:
      - application/json
      description: 'Make one of the community''s admins its owner. THIS IS NOT REVERSIBLE
        by the caller once it succeeds, so every condition the official client checks
        is checked here, against the community''s participant list, before anything
        is sent: the group must be a community (400 not_a_community), it must not
        be suspended (409 community_suspended), new_owner must not be this session
        (400 transfer_to_self), this session must be the owner (409 not_owner), and
        new_owner must be a participant (409 target_not_member) who is an admin (409
        target_not_admin). The participant list read here is the community''s own,
        which appears to carry only its admins, so an ordinary member can land on
        target_not_member rather than target_not_admin; promote them first (a deduction
        from the official client, not yet confirmed live). If the participants cannot
        be read the request is refused with 502 roles_unreadable instead of being
        sent unchecked. Every error answer carries success false, a reason and sent:
        false means the request never left the gateway and is safe to retry; true
        means it may have reached WhatsApp. A transfer whose outcome is unknown (a
        timeout or a disconnection after sending) answers 504 transfer_outcome_unknown
        and must NOT be retried: read the roles with GET /group/info first. The new
        owner is sent the way the community''s participant list names it, and the
        response echoes that form. Requires confirm=true.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Community JID, new owner and confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CommunityTransferOwnershipRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request, confirm not set, not a community, or transfer
            to self
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: WhatsApp refused the session
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Community not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Not the owner, target not a participant or not an admin, or
            community suspended
          schema:
            additionalProperties: true
            type: object
        "429":
          description: WhatsApp community request rate limited
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Community roles could not be read
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Session not connected; nothing was sent
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Transfer sent but its outcome is unknown; do not retry
          schema:
            additionalProperties: true
            type: object
      summary: Transfer a community's ownership
      tags:
      - Community
