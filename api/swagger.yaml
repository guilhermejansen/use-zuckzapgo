  whatsmeow.SharableEvent:
    description: An event with link as WhatsApp's events API returns it. Times are
      unix seconds, except last_updated_ts_usec in microseconds; a field the server
      did not send is left out.
    properties:
      call_link:
        description: Call link of the event (https://call.whatsapp.com/video/... or
          .../voice/...); absent when it has no call.
        type: string
      call_type:
        allOf:
        - $ref: '#/definitions/whatsmeow.SharableEventCallType'
        description: 'Kind of call the event links to: VIDEO or AUDIO; absent when
          it has no call.'
      call_waiting_room:
        description: True when the call link has a waiting room.
        type: boolean
      cover_image_handle:
        description: Handle of the cover image on WhatsApp's servers.
        type: string
      cover_image_url:
        description: Address of the cover image, when WhatsApp sends one.
        type: string
      cover_is_preset:
        description: True when the cover is one of WhatsApp's ready-made covers.
        type: boolean
      created_at:
        description: When the event was created, in unix seconds.
        type: integer
      creator_lid:
        description: LID of the account that created the event.
        type: string
      description:
        description: Description of the event.
        example: Agenda and goals for the next quarter.
        type: string
      end_time:
        description: End, in unix seconds; absent when the event has none.
        example: 1805140800
        type: integer
      event_id:
        description: ID of the event, as WhatsApp numbers it.
        example: "1234567890123456"
        type: string
      last_updated_ts_usec:
        description: Last change of the event, in unix microseconds.
        type: integer
      location:
        allOf:
        - $ref: '#/definitions/whatsmeow.SharableEventLocation'
        description: Place of the event, when it has one.
      location_web_url:
        description: Web address of the place, when WhatsApp sends one.
        type: string
      max_additional_guests:
        description: How many extra guests each invitee may bring.
        example: 0
        type: integer
      name:
        description: Title of the event.
        example: Quarterly planning
        type: string
      reminder_time:
        description: When guests are reminded, in unix seconds; absent when there
          is no reminder.
        type: integer
      start_time:
        description: Start, in unix seconds.
        example: 1805133600
        type: integer
      status:
        description: State as WhatsApp reports it, for example ACTIVE or CANCELED.
        example: ACTIVE
        type: string
    type: object
  whatsmeow.SharableEventCallType:
    enum:
    - ""
    - VIDEO
    - AUDIO
    type: string
    x-enum-varnames:
    - SharableEventNoCall
    - SharableEventVideoCall
    - SharableEventVoiceCall
  whatsmeow.SharableEventList:
    properties:
      past:
