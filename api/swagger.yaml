        is never widened: if it cannot be applied (no recipients remain after exclusions,
        or recipient resolution fails) the status is not sent and the route returns
        500 with the send failure error suffixed by "(status audience could not be
        applied; the status was not sent)". The audience never returns 400.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Text status
        in: body
        name: request
        required: true
        schema:
          properties:
            audience:
              items:
                type: string
              type: array
            background_color:
              type: string
            exclude_list:
              items:
                type: string
              type: array
            font:
              type: integer
            id:
              type: string
            text:
              type: string
            text_color:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message_id:
                type: string
              status:
                type: string
              timestamp:
                type: string
              type:
                type: string
            type: object
        "400":
          description: Invalid body or audience
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Client not connected, send failure, or status audience/exclude_list
            could not be applied
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Send a text status message
      tags:
      - Status
  /status/send/video:
    post:
      consumes:
      - application/json
      description: 'Send a video status message. video accepts a base64 data URL or
        an HTTP(S) URL. audience restricts who sees the status to individual PN (digits
        or PN@s.whatsapp.net) or LID recipients and exclude_list removes recipients;
        entries that are not individual PN or LID recipients are ignored; requests
        without audience/exclude_list, or whose entries are all empty or invalid,
        use the account status privacy. A valid audience or exclude_list is never
        widened: if it cannot be applied (no recipients remain after exclusions, or
        recipient resolution fails) the status is not sent and the route returns 500
        with the send failure error suffixed by "(status audience could not be applied;
        the status was not sent)". The audience never returns 400.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Video status
        in: body
        name: request
        required: true
        schema:
          properties:
            audience:
              items:
                type: string
              type: array
            caption:
              type: string
            exclude_list:
              items:
                type: string
              type: array
            id:
              type: string
            video:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message_id:
                type: string
              status:
                type: string
              timestamp:
                type: string
              type:
                type: string
            type: object
        "400":
          description: Invalid body, media or audience
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Client not connected, upload or send failure, or status audience/exclude_list
            could not be applied
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Send a video status message
      tags:
      - Status
