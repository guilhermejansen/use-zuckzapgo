  /admin/instances/status:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated view of instance connection status using runtime
        state when available, with database fallback when no in-memory client exists.
        Each entry includes the current QR code (base64 PNG) for unpaired instances.
        Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Page size (default 200, max 1000)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Optional comma-separated list of instance IDs
        in: query
        name: ids
        type: string
      - description: When true, includes total count with COUNT(*)
        in: query
        name: include_total
        type: boolean
      produces:
      - application/json
      responses: {}
      summary: List instance connection status
      tags:
      - Admin
