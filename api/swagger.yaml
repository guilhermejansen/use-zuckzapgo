  /group/join:
    post:
      consumes:
      - application/json
      description: Join a WhatsApp group using an invite code. The invite code is
        the part after 'chat.whatsapp.com/' in the invite link. To accept a direct
        invite an admin sent as a message (groupInviteMessage, sent when WhatsApp
        could not add you), also send "Inviter" (the message sender, phone number
        or JID), "GroupJID" (groupInviteMessage.groupJID) and "Expiration" (groupInviteMessage.inviteExpiration,
        unix seconds) with "Code" set to groupInviteMessage.inviteCode; "Inviter"
        selects that path. On that path GroupJID, Inviter and Expiration are validated
        first (400), and WhatsApp's verdict is reported as 409 "already_member", "conflict"
        or "group_full", 410 "invite_expired_or_revoked", 403 "forbidden", 404 "group_not_found",
        423 "group_locked", 429 "rate_limited" or 400 "rejected_by_whatsapp", other
        failures 500 "whatsapp_error"; the response also carries "GroupJID". Requests
        without "Inviter" behave as before, except that a GroupJID, Inviter or Expiration
        of the wrong JSON type fails decoding.
      parameters:
      - description: User authentication token
        in: header
        name: token
        type: string
      produces:
      - application/json
      responses: {}
      summary: Join group via invite link
      tags:
