        info, which needs the session to be a member of the group. With community,
        the unlink is sent to that community, the way the official client's community
        screen does, so a community admin can remove a group it is not a member of.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "409":
          description: The group is linked to a different community than the one sent
          schema:
            additionalProperties: true
            type: object
      summary: Unlink a group from its parent community
      tags:
      - Community
