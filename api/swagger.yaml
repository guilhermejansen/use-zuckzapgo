  /session/network-route:
    delete:
      description: 'Delete this session''s mobile route: closes the live tsnet runtime,
        removes the persisted row and wipes the route state directory. Afterwards
        the session egresses through its legacy proxy_url, or directly when none is
        set — the peer then sees a different IP, which is why removal is never automatic
        and never a fallback. Use it when a route will not converge (status blocked,
        or a runtime that did not come back after a gateway restart) and a fail-closed
        route is holding the session offline. When the route was what held the session
        down, a reconnect is scheduled and reconnectScheduled=true, so a fresh QR
        is produced. Idempotent by absence: a second call answers 404 network_route_not_configured.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.NetworkRouteApplyResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.NetworkRouteErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/main.NetworkRouteErrorResponse'
      summary: Remove the mobile network route (explicit operator escape hatch)
      tags:
      - Session Network Route
    get:
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.NetworkRouteGetResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.NetworkRouteErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/main.NetworkRouteErrorResponse'
      summary: Get mobile network route status
      tags:
      - Session Network Route
    post:
      consumes:
      - application/json
      description: Provision or update the session's isolated tsnet route. Mobile
        routes require tcpOnly=true. failClosed=true holds traffic while the route
        is down; failClosed=false (also the value when the field is omitted) lets
        the session fall back to the default egress, which is an explicit operator
        choice because the peer then sees a different IP. Versions are fenced and
        exact retries are idempotent.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: One-use auth key and stable exit-node route metadata
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/main.NetworkRouteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.NetworkRouteApplyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.NetworkRouteErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/main.NetworkRouteErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/main.NetworkRouteErrorResponse'
      summary: Apply a fail-closed mobile network route
      tags:
      - Session Network Route
  /session/pairphone:
