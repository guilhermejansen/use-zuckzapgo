  /newsletter/followers:
    post:
      consumes:
      - application/json
      description: 'List the followers of a channel, the admins included, each with
        its role. WhatsApp never lists the owner (seen live); the official app knows
        the owner from its own role in the channel metadata. So when this session
        owns the channel, the answer adds this session first as the owner row, with
        source "session" and session_owner_added true; it is counted in returned and
        not in summary. When the session is an admin, no owner row is added: the metadata
        names no other owner, and none is made up. WhatsApp requires the session to
        administer the channel. There is NO pagination: the official request carries
        only a count, capped at 5000, so this returns the first limit followers, and
        maybe_more only says the answer filled the limit — it is not a cursor. WHAT
        COMES BACK PER FOLLOWER DEPENDS ON WHETHER THE OFFICIAL APPS WOULD SHOW THEM.
        The apps show a follower when it administers the channel or when you have
        it in your address book, and hide every other follower completely. For a follower
        they would show, the row carries lid, role, display_name, phone_number, username,
        followed_at and admin_profile. For a follower they would hide, the row carries
        ONLY role, followed_at, in_contacts false and identity_shown false: no lid,
        no display name, no phone number, no username, nothing that identifies the
        person. The row is kept so you still learn the follower exists and when it
        started following. summary counts WhatsApp''s answer, so with_server_phone
        and with_display_name describe what the server sent whether or not it was
        returned, while phone_returned counts what this answer actually carries. summary_only
        omits the followers array and returns the counts alone. On a client platform
        that cannot send MEX requests the read answers 501 unsupported_client_platform
        with sent false; retrying will not help.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Channel and limit
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.NewsletterFollowersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.NewsletterFollowersResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      summary: List the followers of a channel you administer
      tags:
      - Newsletter
  /newsletter/info:
    post:
      consumes:
      - application/json
      description: Get information about a specific newsletter. This allows you to
        get information about a specific newsletter.
      parameters:
