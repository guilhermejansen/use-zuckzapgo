  /newsletter/enforcements:
    post:
      consumes:
      - application/json
      description: 'What WhatsApp applied to the channel and why, in five groups:
        suspensions, suspensions in some countries (with the country codes), posts
        found to violate a policy (with the post''s server ID), removed profile pictures,
        and enforcements on admin profiles. Each entry carries its category, when
        it was applied, the explanatory texts in the requested language, whether and
        how it may be appealed and the appeal form link. locale picks the language
        of those texts (a code such as en or pt-BR, default en). An enforcement from
        an INTELLECTUAL-PROPERTY complaint carries the complainant''s name and e-mail
        address in ip_report: WhatsApp gives them to the channel owner on purpose,
        so the owner can contact them about the dispute, and the official apps show
        them to the owner in their own flow. An entry the server reports as appealed
        but without an appeal time is left out, as the official client does. available
        is false when WhatsApp answers without any enforcement data for the channel,
        which the official client treats as nothing to show rather than an error:
        the five groups then come back empty, and that does not mean the channel was
        checked and found clean. Errors: 400 invalid input, 501 when the bundled library
        cannot read it, 502 when WhatsApp refuses. On a client platform that cannot
        send MEX requests the read answers 501 unsupported_client_platform with sent
        false; retrying will not help.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Channel and language
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.NewsletterEnforcementsRequest'
      produces:
