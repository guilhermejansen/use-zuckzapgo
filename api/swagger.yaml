      description: 'The first channels of each category of WhatsApp''s public channel
        directory, the category rows of the apps'' "Find channels" screen. categories
        picks and orders the categories (BUSINESS, ENTERTAINMENT, LIFESTYLE, NEWS,
        ORGANIZATIONS, PEOPLE, SPORTS, SPECIAL_EVENTS, SPECIAL_EVENTS_2 to SPECIAL_EVENTS_5,
        no repeats); leave it out for the official default list LIFESTYLE, SPORTS,
        PEOPLE, NEWS, BUSINESS, ORGANIZATIONS, ENTERTAINMENT. country_code (ISO 3166-1
        alpha-2) is optional. per_category_limit is 1-10 and defaults to 10, what
        the official client asks for (its screen then shows 4). There is no paging:
        to see more of one category, read /newsletter/directory with that category.
        Each category comes back with the value and the localized title WhatsApp sent,
        in the order WhatsApp sent them. Errors: 400 invalid input, 501 when the bundled
        library cannot read the preview, 502 when WhatsApp refuses. On a client platform
        that cannot send MEX requests the read answers 501 unsupported_client_platform
