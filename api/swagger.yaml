  /group/updateparticipants:
    post:
      consumes:
      - application/json
      description: 'Add, remove, promote or demote group participants. Admin privileges
        required for all operations except leaving the group. The response carries
        WhatsApp''s answer for each participant in "participants": requested_jid,
        wire_jid, status (applied, rejected or unconfirmed), error_code and, when
        an add was refused but WhatsApp offers an invitation instead (the app''s "Send
        invite"), add_request with code and expiration; "Details" keeps its text.
        With Action "add", the optional "send_history" object also sends the group''s
        newest retained messages to the participants that were added, like the app''s
        button: it takes "last_n" (1-200), plus an unused "bundle_id" and "notice_id"
        as POST /group/history/send does. Without it nothing changes. A failed history
        send never undoes the add: the response reports the two outcomes separately,
        under "Details" and "history". The history is sent only to the participants
        who joined in this request: the group is read before and after the add, so
        someone who was already a member gets nothing, as in the app, and someone
        whose add turned into an invite gets nothing either, because WhatsApp refuses
        a bundle whose receiver is not a current member. "history.recipients" says
        how many got it; a partial add sends to those who joined. When nobody joined,
        or every participant was refused, nothing is sent and neither operation ID
        is used. When the participant change itself is not confirmed, no history is
        sent and "history" says so. When nothing is sent but an earlier attempt already
        used the IDs (a repeated add), "history.ids_already_used" is true and the
        error says to read POST /group/history/send/status instead of reusing them.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        type: string
      - description: Group, participants, action and optional history send
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.UpdateGroupParticipantsRequest'
      produces:
      - application/json
      responses: {}
      summary: Manage group participants
      tags:
      - Group
