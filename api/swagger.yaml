  /newsletter/question/send:
    post:
      consumes:
      - application/json
      description: 'Post a question to a channel the session owns or administers,
        the official "Create question": followers answer it privately, only the owner
        and the admins read who answered (/newsletter/question/responses), and an
        admin can answer one response publicly (/newsletter/question/reply). The question
        is text, or an image or a video with an optional caption, uploaded like /newsletter/send
        does; WhatsApp decides per account which of these question types are enabled
        and refuses the rest. The session''s role is read first and a session that
        is neither owner nor admin gets 409 not_admin with nothing sent. The post
        is sent ONCE: a dropped connection, a timeout or an answer that does not read
        answers 504 question_outcome_unknown and must NOT be retried — read /newsletter/messages
        first. NOT AVAILABLE IN THE API, by design: an audio or round-video question
        (the official M2 types, gated per account by WhatsApp and absent from the
        web client''s default), editing a question (the official apps refuse to edit
        one: WAWebMsgActionCapability.canEnterEditingFlow and canEditText return false
        for a question), a dedicated forward of a question (it is the ordinary message
        forward; send it with forward_info.is_forwarded on the /chat/send routes),
        and questions in channel status updates (the API has no channel status). Errors:
        400 invalid input, 409 not_admin, 501 (reason unsupported_client_platform
        and sent false when this session''s client platform cannot send MEX requests,
        so the role read before the send fails), 502 when WhatsApp refuses or the
        role or the upload fails, 504 when the outcome is unknown. A session that
        is not connected, already when the request arrives or when it would go out,
        answers 503 whatsapp_not_connected with sent false: nothing was sent, so it
        can be repeated once the session reconnects. Every error carries sent.'
      parameters:
