    get:
      description: 'Per-call video statistics while the call is running: participants
        sending video, frames received/delivered/shed, backlog bytes, and outbound
        frame counters. Use it to tell whether video lag is server-side backpressure
        or client-side decoding.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Live call ID
        in: path
        name: call_id
        required: true
