  /newsletter/edit:
    post:
      consumes:
      - application/json
      description: 'Change the name, description, picture and allowed reactions of
        a channel. Only the fields present in the body travel to WhatsApp, which is
        how the official client leaves the others untouched: "description":"" and
        "picture":"" clear those fields, while leaving a field out keeps it. name
        cannot be cleared; its maximum length is left to WhatsApp, which is where
        the apps keep it, so a name the server refuses comes back as 502 rather than
        being cut here. picture accepts a base64 data URL or an HTTP(S) URL (JPEG,
        PNG, GIF or WebP) and is converted to a JPEG of at most 640x640. reactions
        is all, basic, blocklist or none. Errors: 400 invalid input, 501 when the
        bundled library cannot edit channels, 502 when WhatsApp refuses the change
        (for example when the session is not an owner or admin of the channel), 504
        when the change was sent but not confirmed (the connection dropped before
        WhatsApp answered, or its answer did not read) — the edit is never resent,
        so read the channel with /newsletter/info before retrying. A change that never
        left the gateway answers 503 whatsapp_not_connected when the connection was
        lost before it left (a session already disconnected when the request arrives
        gets the usual 500 client not connected), 501 unsupported_client_platform
        or 500 not_sent, all with sent false: retrying is safe.'
