  /newsletter/question/responses:
    post:
      consumes:
      - application/json
      description: 'One page of the responses to a question, as the channel''s owner
        and admins read them, newest first. count is 1-1000 and defaults to the official
        page of 30; has_more is true when the page came full, and next_cursor goes
        back as cursor for the next page. filter is all, contacts (the responders
        WhatsApp knows as your contacts), replied or starred; search narrows by text
        and needs at least 3 characters. WHO SENT EACH RESPONSE, as the official apps
        show it ("Followers can''t see who responded, but admins can."): an address-book
        contact of the session by the address-book name (display_name, name_source
        contact, in_contacts true), anyone else by the push name WhatsApp sent (display_name,
        name_source push_name), and the picture (picture_direct_path) for both. A
        responder without a push name comes with the picture only, or with nothing;
        no name is made up. NO RESPONSE EVER CARRIES A PHONE NUMBER OR A LID, for
        anyone, contacts included: the official responses row shows neither. Followers
        never see who responded: their own responses (/newsletter/question/my-responses)
        carry no sender, and a public reply quotes a response without its author.
        Every action on a response (like, star, hide, block, reply) works with response_server_id
        alone. This is a read and is not checked against your role first: WhatsApp
        answers, and its not-authorized and not-allowed come back as 403 not_allowed.
        Errors: 400 invalid input, 403 when WhatsApp does not let this session read
        the responses, 404 when the question does not exist, 429 when WhatsApp rate-limits,
        503 whatsapp_not_connected when the session is not connected (nothing was
        asked), 502 otherwise.'
