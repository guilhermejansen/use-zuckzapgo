  /group/memberaddmode:
    post:
      consumes:
      - application/json
      description: 'Control whether all members or only admins can add new participants
        to the group. Allowed values for "mode": "admin_add" (only admins can add)
        or "all_member_add" (all members can add). This maps to the "Add other members"
        permission in WhatsApp''s group settings. By default only this setting is
        changed, and "groupjid" keeps its historical leniency: a value that parses
        as a user JID is refused by WhatsApp, not by the gateway. With "sync_invite_share"
        it must be a group JID (@g.us, no device) or the request is refused with 400
        before anything is read or written. The WhatsApp app restricts invite sharing
        to admins in the same gesture, and the optional "sync_invite_share" boolean
        (default false) reproduces that rule exactly: with "admin_add" in a regular
        group whose invite sharing is not already admin-only, the route also sets
        invite sharing to "admin_link". Going back to "all_member_add" and community
        announcement groups send nothing extra, as in the app. When sync_invite_share
        actually restricts invite sharing, WhatsApp issues a new invite link and the
        previous one stops working, so read the link again with GET /group/invitelink
        if you cache or publish it. With "sync_invite_share" the response reports
        both outcomes separately: "member_add_mode" carries "applied" and "mode",
        and "invite_share_sync" always carries the same five fields — "requested",
        "applied", "skipped", "reason" and "mode". "skipped" is true when the app''s
        rule did not call for the second change, with "reason" one of "mode_not_admin_add",
        "community_announcement_group", "already_admin_link" or "link_mode_not_reported"
        (the server did not report the current value, which the app reads as admin-only);
        a "reason" of "group_info_unavailable" or "write_failed" means it was called
        for and did not happen, and then the response is a 500 that still states whether
        the add mode went through. Repeating a request that answered 500 with "member_add_mode.applied"
        true is safe: writing the same mode again changes nothing, and the invite-share
        step is retried.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        type: string
      - description: Group JID, add mode and optional invite-share sync
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GroupMemberAddModeRequest'
      produces:
      - application/json
      responses: {}
      summary: Set who can add members
      tags:
      - Group
  /group/memberlinkmode:
    post:
      consumes:
      - application/json
      description: 'Set admin_link or all_member_link. Maps to the "Share group invite"
        permission in WhatsApp''s group settings. Changes only this permission. Restricting
        invite sharing (all_member_link to admin_link) makes WhatsApp issue a new
        invite link, and the previous link stops working; opening it again does not
        rotate the link. Measured live on 2026-11-21, on every restriction. The gateway
        never revokes or rotates the link on its own, so read the link again with
        GET /group/invitelink after restricting if you cache or publish it. Server
        authorization applies. "all_member_link" also needs "mode" all_member_add
        on POST /group/memberaddmode: WhatsApp refuses the combination of all_member_link
        with admin_add, and this route answers 409 with reason "member_add_mode_restricts_invite"
        instead of trying. "admin_link" is always accepted. The WhatsApp app restricts
        invite sharing to admins in the same gesture in which it restricts "Add other
        members" to admins in a regular group; POST /group/memberaddmode changes only
        its own setting unless "sync_invite_share" is used, so otherwise call both
        routes to reproduce the app.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Group JID and invite sharing mode
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GroupMemberLinkModeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Set who can share the group invite
      tags:
      - Group
