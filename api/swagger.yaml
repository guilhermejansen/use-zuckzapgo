  /admin/users:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all ZuckZapGo users with their complete configuration
        including connection status, webhook settings, proxy configuration, S3 storage,
        RabbitMQ messaging, and event filtering preferences. If a user ID is provided
        in the URL path, returns only that specific user's information. Admin authentication
        required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: List all users or get specific user
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: When networkRoute is present, AddUser returns 2xx only with data.id,
        data.token and a ready data.network_route whose desired/applied versions match.
        If the user is persisted but route preparation fails, 503 returns data.userId
        without token so Chatwoot can DELETE /admin/users/{id}.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/main.AddUserNetworkRouteFailureResponse'
      summary: Create a new ZuckZapGo user account with optional native mobile-route
        provisioning
      tags:
      - Admin
  /admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Remove a ZuckZapGo user account and all associated data including
        WhatsApp session, webhook configurations, S3 settings, RabbitMQ configurations,
        and event filtering preferences. This operation is irreversible and will disconnect
        any active WhatsApp sessions. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Call cleanup pending; retry deletion to consult the same operation
          schema:
            $ref: '#/definitions/main.ResponseWithExtras'
      summary: Delete a user
      tags:
      - Admin
    get:
      consumes:
      - application/json
      description: Retrieve a list of all ZuckZapGo users with their complete configuration
        including connection status, webhook settings, proxy configuration, S3 storage,
        RabbitMQ messaging, and event filtering preferences. If a user ID is provided
        in the URL path, returns only that specific user's information. Admin authentication
        required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: List all users or get specific user
      tags:
      - Admin
    put:
      consumes:
      - application/json
      parameters:
      - description: Admin Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 'Optional booleans: skipMedia, skipGroups, skipNewsletters, skipBroadcasts,
          skipOwnMessages, echoApiMessages, skipCalls'
        in: body
        name: data
        required: true
        schema:
          type: object
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Update User Prefs
      tags:
      - Admin
  /admin/users/{id}/full:
    delete:
      consumes:
      - application/json
      description: Perform a complete deletion of a ZuckZapGo user account including
        all data, WhatsApp session files, database records, webhook configurations,
        S3 settings, RabbitMQ configurations, and any associated media files. This
        is a destructive operation that removes all traces of the user from the system.
        Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Call cleanup pending; retry deletion to consult the same operation
          schema:
            $ref: '#/definitions/main.ResponseWithExtras'
      summary: Delete user completely
      tags:
      - Admin
