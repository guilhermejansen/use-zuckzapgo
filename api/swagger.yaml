      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Answer a ringing inbound call
      tags:
      - Call
  /call/config:
    get:
      consumes:
      - application/json
      description: Return the per-instance native calls engine configuration. callProviderToken
        is never returned.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get the native calls engine configuration
      tags:
      - Call
    put:
      consumes:
      - application/json
      description: 'Persist the native calls engine configuration. callRecord applies
        to the live engine immediately (the next answered call records or not; a running
        recording is not cut); every other field applies on the next reconnect. Empty
        callInboundMode defaults to webhook; invalid mode returns 400. callProviderToken
        is write-only: when omitted or null the stored token is kept; send an empty
        string to clear it.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Update the native calls engine configuration
      tags:
      - Call
  /call/dial:
    post:
      consumes:
      - application/json
      description: Originate an outbound native call. phone accepts E.164 digits (no
        +), a phone JID, or a @lid — anything carrying an explicit @ is used as given.
        A plain number is resolved to the callee's LID first, which is what makes
        a Brazilian mobile typed WITH the ninth digit work even though WhatsApp stores
        many of them without it. Set video to place a video call (H.264). Returns
        502 if the peer is unreachable.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: 'phone (string: number, phone JID or @lid) and optional video
          (bool)'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Place an outbound call
      tags:
      - Call
  /call/group/dial:
    post:
      consumes:
      - application/json
      description: Places an outbound group call to two or more targets. Each target
        may be a phone number, a phone JID or a @lid. WhatsApp rejects a group call
        with fewer than two remote participants. Pass groupJid to keep the call BOUND
        to a WhatsApp group while calling only some of its members — the only way
        to call a group larger than WhatsApp's connected-limit (32 including you),
        since /call/group/dial-by-id refuses those outright.
      parameters:
      - description: targets (string array, min 2), optional video (bool), optional
          groupJid (string) to bind the call to a group
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Place a group call
      tags:
      - Call
  /call/group/dial-by-id:
    post:
      consumes:
      - application/json
      description: Resolves an existing WhatsApp group's roster and calls every remote
        member. The call stays bound to the group.
      parameters:
      - description: groupJid (string) and optional video (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Place a group call by group JID
      tags:
      - Call
  /call/hand:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and raised (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Raise or lower hand
      tags:
      - Call
  /call/hangup:
    post:
      consumes:
      - application/json
      description: End a live call and tear down its media session. Returns 404 if
        the call is not found.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Hang up a live call
      tags:
      - Call
  /call/initiate:
    post:
      consumes:
      - application/json
      description: Legacy route. Returns 501 make_call_not_implemented by default;
        place outbound calls with POST /call/dial. When the instance sets GLOBAL_CALL_INITIATE_DIAL_ALIAS=true
        this route becomes an alias of /call/dial (phone and optional video; returns
        callId; requires calls_enabled and a connected session).
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: 'Only used when GLOBAL_CALL_INITIATE_DIAL_ALIAS=true: phone (string:
          number, phone JID or @lid) and optional video (bool)'
        in: body
        name: data
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Originate a new call
      tags:
      - Call
  /call/link/create:
    post:
      consumes:
      - application/json
      description: Creates a reusable public call link. Anyone with the token or URL
        can join, subject to the waiting room.
      parameters:
      - description: optional video (bool)
        in: body
        name: data
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/voip.CallLinkInfo'
      summary: Create a call link
      tags:
      - Call
  /call/link/join:
    post:
      consumes:
      - application/json
      description: Joins an active call-link session, or enters its waiting room when
        the link requires approval. The resulting call is tracked like any other.
      parameters:
      - description: token (string) and optional video (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Join a call link
      tags:
      - Call
  /call/link/preview:
    get:
      description: Reads call-link metadata without joining. Accepts the bare token
        or a full call.whatsapp.com URL.
      parameters:
      - description: Call link token or URL
        in: query
        name: token
        required: true
        type: string
      - description: Preview as a video link
        in: query
        name: video
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/voip.CallLinkPreviewInfo'
      summary: Preview a call link
      tags:
      - Call
  /call/participants/add:
    post:
      consumes:
      - application/json
      description: Invites one or more people to a live call. Returns the list of
        targets that failed, so a partial failure is visible instead of collapsing
        into one error.
      parameters:
      - description: callId (string) and targets (string array)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Add participants to a call
      tags:
      - Call
  /call/participants/ring:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and target
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Re-ring a participant
      tags:
      - Call
  /call/play:
    post:
      consumes:
      - application/json
      description: Play an audio source (audioUrl or audioBase64; WAV/MP3/Ogg-Opus)
        to the peer. Audio is auto-detected and resampled to 16kHz mono.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Play audio into a live call
      tags:
      - Call
  /call/preaccept:
    post:
      consumes:
      - application/json
      description: Send a preaccept stanza for an inbound call.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Pre-accept an incoming call
      tags:
      - Call
  /call/reaction:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and emoji
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Send an in-call reaction
      tags:
      - Call
  /call/record/start:
    post:
      consumes:
      - application/json
      description: Record the peer's audio to a WAV file (requires S3 configured).
        Mutually exclusive with the media stream per call. Requires callRecord enabled
        in PUT /call/config; otherwise returns 403 call_recording_disabled and nothing
        is recorded.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "403":
          description: 'call_recording_disabled: callRecord is off for this instance'
          schema:
            additionalProperties: true
            type: object
      summary: Start recording a call
      tags:
      - Call
  /call/record/stop:
    post:
      consumes:
      - application/json
      description: Finalize the recording, upload the WAV to object storage, and return
        its URL as mediaKey (empty when no recording was active). On upload failure
        returns 400; the recording stays pending and is completed in the background,
        announced by the CallRecordingReady webhook.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Stop recording a call
      tags:
      - Call
  /call/reject:
    post:
      consumes:
      - application/json
      description: Reject an incoming call. Optionally send a follow-up text message.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Reject an incoming call
      tags:
      - Call
  /call/reject/send:
    post:
      consumes:
      - application/json
      description: Send a custom call rejection message to a WhatsApp user or group.
        This is NOT the same as /call/reject, which rejects the call itself — this
        one delivers a message alongside the rejection.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send a custom call rejection message
      tags:
      - Call
  /call/screenshare:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and enabled (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Toggle screen share
      tags:
      - Call
  /call/status:
    get:
      consumes:
      - application/json
      description: List the native calls engine's currently tracked calls for the
        instance.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: List live calls
      tags:
      - Call
  /call/terminate:
    post:
      consumes:
      - application/json
      description: Send a terminate stanza. Default reason is "hangup".
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Terminate an active call
      tags:
      - Call
  /call/video:
    post:
      consumes:
      - application/json
      description: Starts or stops sending local video on a live call. Frames are
        still pushed through the /call/{call_id}/video/stream websocket.
      parameters:
      - description: callId and enabled (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Toggle outbound video
      tags:
      - Call
  /call/waiting-room/admit:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and user
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Admit a waiting participant
      tags:
      - Call
  /call/waiting-room/approval:
    post:
      consumes:
      - application/json
      description: Turns the waiting room on or off for a call link. Admin only.
      parameters:
      - description: callId and enabled (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Toggle call-link approval
      tags:
      - Call
  /call/waiting-room/deny:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and user
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Deny a waiting participant
      tags:
      - Call
  /chat/archive:
    post:
      consumes:
      - application/json
      description: Archive or unarchive a chat to hide it from the main chat list.
        Archived chats are moved to the "Archived" folder and will reappear in the
        main list when a new message is received. You can optionally specify the last
        message information for proper synchronization. Set archive to true to archive
        or false to unarchive.
      produces:
      - application/json
      responses: {}
      summary: Archive or unarchive chat
      tags:
      - Chat
  /chat/delete:
    post:
      consumes:
      - application/json
      description: Delete a message from a chat (revoke — "This message was deleted"
        for every participant). Deletes your own messages in any chat. In GROUPS,
        a group admin can also delete OTHER participants' messages by passing the
        optional Sender field (the original author's JID, e.g. "5521999999999@s.whatsapp.net"
        or "123456@lid") — mirroring WhatsApp's admin delete-for-everyone. There may
        be a time limit for deletion depending on WhatsApp's policies.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Delete message
      tags:
      - Chat
  /chat/delete-chat:
    post:
      consumes:
      - application/json
      description: Delete a chat entirely from the chat list. This is different from
        clearing chat history - it removes the chat from your chat list completely.
        The chat will reappear if you receive a new message from this contact. Optionally
        provide the last message details for more precise deletion. The delete_media
        parameter controls whether associated media files are also deleted (defaults
        to true). People are addressed by LID when known (index and last message key),
        groups by their JID. last_system_message_timestamp (optional, Unix seconds)
        marks the last system notice to delete (for example disappearing-messages
        notices); it defaults to last_message_timestamp, or to now when neither is
        sent.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Delete chat request
        in: body
        name: request
        required: true
        schema:
          properties:
            delete_media:
              type: boolean
            last_message_from_me:
              type: boolean
            last_message_id:
              type: string
            last_message_sender_jid:
              type: string
            last_message_timestamp:
              type: integer
            last_system_message_timestamp:
              type: integer
            phone:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Chat deleted successfully
          schema:
            properties:
              delete_media:
                type: boolean
              jid:
                type: string
              message:
                type: string
              success:
                type: boolean
            type: object
        "400":
          description: Invalid request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal server error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Delete chat from chat list
      tags:
      - Chat
  /chat/downloadaudio:
    post:
      consumes:
      - application/json
      description: Download an audio file from a WhatsApp message and return it as
        base64 encoded data URL. You need to provide the media information from the
        received message including URL, media key, and file hashes. The audio is decrypted
        and returned as a data URL that can be directly used in HTML audio tags or
        saved to disk. Supports voice messages, audio files (MP3, M4A, OGG), and PTT
        (push-to-talk) messages.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Download audio from message
      tags:
      - Chat
  /chat/downloaddocument:
    post:
      consumes:
      - application/json
      description: Download a document from a WhatsApp message and return it as base64
        encoded data URL. You need to provide the media information from the received
        message including URL, media key, and file hashes. The document is decrypted
        and returned as a data URL that can be directly used or saved to disk. Supports
        all document types including PDF, DOC, XLS, PPT, ZIP, etc.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Download document from message
      tags:
      - Chat
  /chat/downloadimage:
    post:
      consumes:
      - application/json
      description: Download an image from a WhatsApp message and return it as base64
        encoded data URL. You need to provide the media information from the received
        message including URL, media key, and file hashes. The image is decrypted
        and returned as a data URL that can be directly used in HTML img tags or saved
        to disk.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Download image from message
      tags:
      - Chat
  /chat/downloadsticker:
    post:
      consumes:
      - application/json
      description: Download a sticker from a WhatsApp message and return it as base64
        encoded data URL. You need to provide the media information from the received
        message including URL, media key, and file hashes. The sticker is decrypted
        and returned as a data URL (usually WebP format) that can be used directly
        or converted to other formats. Animated stickers are also supported.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Download sticker from message
      tags:
      - Chat
  /chat/downloadvideo:
    post:
      consumes:
      - application/json
      description: Download a video from a WhatsApp message and return it as base64
        encoded data URL. You need to provide the media information from the received
        message including URL, media key, and file hashes. The video is decrypted
        and returned as a data URL that can be directly used in HTML video tags or
        saved to disk. Supports MP4, AVI, MOV, and other video formats.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Download video from message
      tags:
      - Chat
  /chat/favorite:
    post:
      consumes:
      - application/json
      description: 'Adds or removes one chat (contact or group) from the Favorites
        list of the official apps. WhatsApp syncs Favorites as ONE complete ordered
        list (favorites app state action), so the gateway must know the current list
        to change a single entry: it uses the list last observed from app state or
        sent through this API (see GET /chat/favorites). When the list is unknown
        the request fails with 409 instead of silently wiping the other favorites;
        set force=true with favorite=true to replace the whole list with only this
        chat, or use PUT /chat/favorites with the complete list. People are addressed
        by LID when known.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Favorite request
        in: body
        name: request
        required: true
        schema:
          properties:
            favorite:
              type: boolean
            force:
              type: boolean
            phone:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              favorite:
                type: boolean
              favorites:
                items:
                  type: string
                type: array
              index_jid:
                type: string
              jid:
                type: string
              success:
                type: boolean
            type: object
        "400":
          description: Invalid request
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Current favorites list unknown
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session or send failure
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Add or remove a chat from Favorites
      tags:
      - Chat
  /chat/favorites:
    get:
      description: Returns the Favorites list. With refresh=true the gateway runs
        a full sync of the regular_high app state collection and rebuilds the list
        from the decrypted snapshot; complete=true is only returned after such a successful
        sync. Without it the list is the one last observed from app state or sent
        through this API; known=false means none was seen yet, in which case favorites
        is empty and does NOT mean the phone has no favorites. The full sync does
        not emit favorites events to webhooks.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Run a full sync of the regular_high collection first
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              complete:
                type: boolean
              favorites:
                items:
                  type: string
                type: array
              known:
                type: boolean
              source:
                type: string
              synced_at:
                type: string
            type: object
        "500":
          description: No session or not logged in
          schema:
            properties:
              error:
                type: string
            type: object
        "501":
          description: Bundled library cannot return the snapshot
          schema:
            properties:
              error:
                type: string
            type: object
        "502":
          description: Full sync failed
          schema:
            properties:
              error:
                type: string
            type: object
        "503":
          description: Client not connected
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Get the known Favorites list
      tags:
      - Chat
    put:
      consumes:
      - application/json
      description: 'Replaces the complete ordered Favorites list with the given chats.
        This mirrors the official sync action, which always carries the whole list:
        chats missing from the request are removed from Favorites. An empty list clears
        Favorites. People are addressed by LID when known.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Complete ordered list
        in: body
        name: request
        required: true
        schema:
          properties:
            phones:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              favorites:
                items:
                  type: string
                type: array
              success:
                type: boolean
            type: object
        "400":
          description: Invalid request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session or send failure
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Replace the Favorites list
      tags:
      - Chat
  /chat/list:
    get:
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: List Chats
      tags:
      - Chat
  /chat/markread:
    post:
      consumes:
      - application/json
      description: Mark one or more messages as read in a specific chat. This removes
        the unread badge and sends read receipts to the sender (if enabled in privacy
        settings). You must provide the chat JID, message IDs to mark as read, and
        optionally the sender JID for group messages. The operation updates the chat's
        unread count and last read message.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Mark messages as read
      tags:
      - Chat
  /chat/mute:
    post:
      consumes:
      - application/json
      description: Mute or unmute notifications for a specific chat. When muted, you
        won't receive notifications for new messages in that chat. You can mute for
        8 hours, 1 week, or always (until manually unmuted). Set mute to true with
        a duration to mute, or false to unmute. If no duration is specified when muting,
        it defaults to "always".
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Mute or unmute chat
      tags:
      - Chat
  /chat/pin:
    post:
      consumes:
      - application/json
      description: Pin or unpin a chat to keep it at the top of the chat list. Pinned
        chats appear at the top of the chat list for easy access. You can have up
        to 3 pinned chats on WhatsApp. Set pin to true to pin the chat or false to
        unpin it.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Pin or unpin chat
      tags:
      - Chat
  /chat/pin-message:
    post:
      consumes:
      - application/json
      description: Sends the official PinInChatMessage (PIN_FOR_ALL / UNPIN_FOR_ALL)
        that shows the pinned-message banner at the top of the conversation for every
        participant. duration_seconds accepts 86400 (24 hours), 604800 (7 days, default)
        or 2592000 (30 days) and is ignored when unpinning. from_me tells whether
        the target message was sent by this account; for someone else's message in
        a group, sender_jid is required. In groups WhatsApp may restrict pinning to
        admins depending on the group settings. People are addressed by LID when known
        so the embedded key matches the destination.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Pin message request
        in: body
        name: request
        required: true
        schema:
          properties:
            duration_seconds:
              type: integer
            from_me:
              type: boolean
            message_id:
              type: string
            phone:
              type: string
            pin:
              type: boolean
            sender_jid:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              chat:
                type: string
              duration_seconds:
                type: integer
              id:
                type: string
              message_id:
                type: string
              pinned:
                type: boolean
              success:
                type: boolean
              timestamp:
                type: integer
            type: object
        "400":
          description: Invalid request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session or send failure
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Pin or unpin a message inside a chat
      tags:
      - Chat
  /chat/presence:
    post:
      consumes:
      - application/json
      description: Set chat presence status to indicate typing, recording audio, or
        paused state. This shows the "typing..." or "recording audio..." indicator
        to the recipient. The presence automatically clears after a few seconds, so
        you may need to send it periodically during long operations.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Set chat presence
      tags:
      - Chat
  /chat/react:
    post:
      consumes:
      - application/json
      description: "Send a reaction emoji to a specific message. Use empty string
        or \"remove\" to remove a reaction. The reaction appears below the message
        for all participants. Common reactions include \U0001F44D, ❤️, \U0001F602,
        \U0001F62E, \U0001F622, \U0001F64F. You must specify the message ID and whether
        it was sent by you (prefix with \"me:\") or received from others. Optionally
        pass \"chat\" with the exact chat JID as received in the webhook (e.g. an
        \"@lid\" address) to guarantee the reaction renders on iOS; when omitted the
        phone number is used."
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: React to message
      tags:
      - Chat
  /chat/reply:
    post:
      consumes:
      - application/json
      description: |-
        Send a message that quotes a previous one. Text content only;
        media replies should use /chat/send/{image,video,document,audio} with quoted_msg_id.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Reply to a quoted message
      tags:
      - Chat
  /chat/retry/message:
    post:
      consumes:
      - application/json
      description: Retry processing of an incoming message that failed to process
        correctly, such as messages with "Unknown-sender" state. This endpoint searches
        for the message in recent cache and callback sources, then forces reprocessing
        by sending a retry receipt to the original sender. Particularly useful for
        recovering messages that were received but not properly decrypted or processed
        due to session issues, missing keys, or temporary connectivity problems. The
        system will attempt to decrypt and reprocess the message using current session
        state.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Retry failed incoming message
      tags:
      - Chat
  /chat/send/audio:
    post:
      consumes:
      - application/json
      description: Send an audio message or voice note to a WhatsApp contact or group.
        Supports various audio formats including MP3, OGG, AAC, and M4A. Can be sent
        as regular audio or PTT (Push To Talk) voice note. Audio can be provided as
        base64 data URL or HTTP(S) URL. Features include view-once messages, captions,
        replies, forwarding, and ephemeral messages. Audio is automatically processed
        and uploaded to configured S3 storage if available.
      parameters:
      - description: User authentication token
        example: '"YOUR_USER_TOKEN"'
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send audio message
      tags:
      - Chat
  /chat/send/buttons:
    post:
      consumes:
      - application/json
      description: |-
        Send a message with interactive buttons to a phone number or group. This endpoint supports multiple button types including quick replies, URL links, phone calls, copy actions, and payment integrations (PIX). The message can include media attachments (images, videos, documents) and supports all message enhancements like mentions, replies, and forwarding.
        Send interactive message with up to 3 action buttons to a WhatsApp contact or group. Requires a non-empty title with a maximum of 60 characters; do not send whitespace-only titles because WhatsApp renders an empty header area. Supports reply buttons, URL buttons, phone buttons, and PIX payment buttons. Can include optional media attachment (image, video, or document), footers, and ephemeral messages.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send buttons message
      tags:
      - Chat
  /chat/send/carousel:
    post:
      consumes:
      - application/json
      description: Send a carousel message with multiple cards to a phone number or
        group. Each card can contain images, videos, documents, text, and buttons.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send carousel message
      tags:
      - Chat
  /chat/send/contact:
    post:
      consumes:
      - application/json
      description: Send a contact card (vCard) to a WhatsApp contact or group. The
        vCard can include phone numbers, email addresses, organization details, and
        more. Supports vCard 3.0 format. The contact will be displayed as an interactive
        card that recipients can save to their address book. Features include replies,
        forwarding, and ephemeral messages.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send contact message
      tags:
      - Chat
  /chat/send/contact-request:
    post:
      consumes:
      - application/json
      description: |-
        Sends the native WhatsApp contact request: a body text plus the "Share contact" button, the same interactive the Cloud API sends with interactive.type=request_contact_info. When the contact taps the button, their own contact card arrives as a regular Message webhook (contactMessage with isSelfContact=true, vCard with TEL;waid= and X-WA-LID). The reply carries no reference to the request.

        Rules: one-to-one chats only (digits, <digits>@s.whatsapp.net or <digits>@lid); groups, newsletters, broadcast and status return 400. body is required, 1 to 1024 characters after trimming, never truncated. Available on every plan.

        Idempotency: send your own id ([A-Za-z0-9], up to 128) and reuse it on every retry. A retry of an id already sent returns the original result without sending again (State sent, or confirmed with ConfirmedAt once the recipient's delivery/read receipt for that id arrives). 409 contact_request_dispatch_unknown means the send may have left and is never repeated; 409 contact_request_id_conflict means the id was used with another recipient, body or quote. Retry ids are remembered for 30 days.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Contact request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.contactRequestInput'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {Id, State (sent|confirmed), Details, Timestamp, ConfirmedAt}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'error: contact_request_invalid_json | contact_request_phone_required
            | contact_request_invalid_phone | contact_request_invalid_recipient |
            contact_request_body_required | contact_request_body_too_long | contact_request_invalid_id
            | contact_request_invalid_context_info | contact_request_recipient_not_on_whatsapp'
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 'error: contact_request_dispatch_unknown | contact_request_id_conflict'
          schema:
            additionalProperties: true
            type: object
        "413":
          description: 'error: contact_request_request_too_large'
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 'error: contact_request_send_failed | contact_request_number_check_failed'
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 'error: contact_request_session_unavailable | contact_request_ledger_unavailable'
          schema:
            additionalProperties: true
            type: object
      summary: Request the contact's phone number (request_contact_info)
      tags:
      - Chat
  /chat/send/document:
    post:
      consumes:
      - application/json
      description: Send a document or file attachment to a phone number or group.
        Supports various file types including PDF, Word, Excel, PowerPoint, ZIP, and
        more. The document can be sent as a base64 data URL or HTTP(S) URL. Supports
        captions, mentions, replies, forwarding, and ephemeral messages. Media is
        automatically processed and uploaded to configured S3 storage if available.
      parameters:
      - description: User authentication token
        example: '"YOUR_USER_TOKEN"'
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send document message
      tags:
      - Chat
  /chat/send/edit:
    post:
      consumes:
      - application/json
      description: Send an edited message to a phone number or group. Edits the text
        of a text message, or the CAPTION of an image, video or document — the target's
        type is detected automatically from its message id, so the request body is
        the same in both cases (`phone`, `id`, `body`). `body` carries the new text
        or the new caption. Media captions can be edited on messages sent through
        this API and on messages sent from the operator's own phone. If the target
        id is unknown to this instance the edit is sent as a text edit, as before.
        Supports mentions, replies, forwarding, and various message enhancements.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send edited message (text or media caption)
      tags:
      - Chat
  /chat/send/event:
    post:
      consumes:
      - application/json
      description: |-
        Send an event message to a phone number or group. This endpoint creates rich event invitations with scheduling, location, and call integration capabilities.
        Send calendar event invitation with date, time, location, and description to a WhatsApp contact or group. Recipients can add the event to their calendar. Features include replies, forwarding, and ephemeral messages.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send event message
      tags:
      - Chat
  /chat/send/eventresponse:
    post:
      consumes:
      - application/json
      description: 'RSVP to a calendar event. The event is identified by the message
        id of its creation message. `response` is one of GOING, NOT_GOING, MAYBE or
        UNKNOWN. `with_guest` (boolean) is WhatsApp''s "Going with guest" — the official
        app only offers this option and always sends a guest count of 1, rendered
        as "Going with guest". `extra_guest_count` is deprecated but still accepted:
        0 means no guest and any value >= 1 is sent as 1, exactly like the app; `with_guest`
        wins when both are present. Guests only apply to GOING (other responses are
        sent without guest). The creator must allow extra guests on the event for
        the guest to be shown. To remove a previous answer send `response` UNKNOWN.
        The RSVP is encrypted with the event''s message secret, so the event must
        have been sent or received by this session — an event created before this
        instance recorded event metadata cannot be answered and returns 409.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Event response
        in: body
        name: request
        required: true
        schema:
          properties:
            event_message_id:
              type: string
            extra_guest_count:
              type: integer
            phone:
              type: string
            response:
              type: string
            with_guest:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: RSVP sent
          schema:
            properties:
              Details:
                type: string
              Id:
                type: string
              Response:
                type: string
              Timestamp:
                type: string
            type: object
        "400":
          description: Missing fields, or an unknown response value
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Unknown event message id
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Event predates RSVP support — its creator info was never recorded
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Respond to a calendar event
      tags:
      - Chat
  /chat/send/flow:
    post:
      consumes:
      - application/json
      description: |-
        Send a WhatsApp Flow (an interactive form) to a contact.

        How to use:
        1. Create your form in the WhatsApp Business app (Tools > Forms).
        2. Get your `flow_id`: send that form once from the app to any chat. Since your number is connected here, that message is delivered to your configured webhook — open it and copy the `flow_id` (and the rest of `button_params_json`). Save it. You only do this once per form, then reuse the saved `flow_id`.
        3. Send the form here with `name` set to `galaxy_message` and your saved `flow_id` inside `button_params_json`.
        4. The answers your contact submits come back to your configured webhook.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send flow message (WhatsApp Flow / interactive form)
      tags:
      - Chat
  /chat/send/image:
    post:
      consumes:
      - application/json
      description: Send an image message to a WhatsApp contact or group. Supports
        JPEG, PNG, GIF, and WebP formats. Images can be sent as base64 data URLs or
        HTTP(S) URLs. Features include captions, view-once messages, mentions, replies,
        forwarding, and ephemeral messages. Large images are automatically compressed
        while maintaining quality. Images are automatically processed and uploaded
        to configured S3 storage if available.
      parameters:
      - description: User authentication token
        example: '"YOUR_USER_TOKEN"'
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send image message
      tags:
      - Chat
  /chat/send/link:
    post:
      consumes:
      - application/json
      description: 'Send a text message with a link preview. By default the preview
        metadata (title/description/image) is auto-fetched from the URL''s OpenGraph
        tags. The optional `preview` object lets you override any field for a fully
        custom preview card (e.g. coupon links that should not expose tracker metadata).
        `preview.image` accepts a base64 data URL OR an http(s) URL. Set `disable_preview:
        true` to send an extended text message without any preview card. Supports
        captions, mentions, replies, and forwarding.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send link message with link preview (auto-fetched or custom)
      tags:
      - Chat
  /chat/send/list:
    post:
      consumes:
      - application/json
      description: Send a message with an interactive list to a phone number or group.
        This endpoint creates rich, structured lists perfect for product catalogs,
        service menus, restaurant menus, and interactive selections.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send list message
      tags:
      - Chat
  /chat/send/location:
    post:
      consumes:
      - application/json
      description: Send a location message to a WhatsApp contact or group with GPS
        coordinates. You can optionally include a location name and address for better
        context. The location will be displayed as an interactive map in WhatsApp.
        Features include replies, forwarding, and ephemeral messages.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send location message
      tags:
      - Chat
  /chat/send/poll:
    post:
      consumes:
      - application/json
      description: 'Send a poll with multiple choice options to a WhatsApp group or
        contact. Polls allow recipients to vote on options you provide. You can create
        polls with 2-12 options, and optionally allow multiple selections. Poll results
        are visible to all participants in real-time. Note: Polls are primarily designed
        for group chats.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send poll message
      tags:
      - Chat
  /chat/send/pollvote:
    post:
      consumes:
      - application/json
      description: Cast (or retract) this session's vote on a poll. The poll is identified
        by the message id of its creation message; the option names must match the
        poll's own options exactly. Multi-select polls accept more than one option.
        An empty `options` array RETRACTS the vote. The vote is encrypted with the
        poll's message secret, so the poll must have been sent or received by this
        session — a poll created before this instance recorded poll metadata cannot
        be voted on and returns 409.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Poll vote
        in: body
        name: request
        required: true
        schema:
          properties:
            options:
              items:
                type: string
              type: array
            phone:
              type: string
            poll_message_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Vote sent
          schema:
            properties:
              Details:
                type: string
              Id:
                type: string
              Options:
                items:
                  type: string
                type: array
              Timestamp:
                type: string
            type: object
        "400":
          description: Missing fields, or an option that the poll does not have
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Unknown poll message id
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Poll predates vote support — its creator info was never recorded
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Vote on a poll
      tags:
      - Chat
  /chat/send/ptv:
    post:
      consumes:
      - application/json
      description: Send a PTV by link or base64 (data URL). Only requires phone and
        video.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send PTV (Pre-Recorded Transfer Video)
      tags:
      - Chat
  /chat/send/sticker:
    post:
      consumes:
      - application/json
      description: Send a sticker message to a WhatsApp contact or group. Stickers
        must be in WebP format with maximum dimensions of 512x512 pixels. Animated
        stickers are supported. Stickers can be sent as base64 data URLs or HTTP(S)
        URLs. Features include replies, forwarding, and ephemeral messages. Stickers
        are automatically processed and uploaded to configured S3 storage if available.
      parameters:
      - description: User authentication token
        example: '"YOUR_USER_TOKEN"'
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send sticker message
      tags:
      - Chat
  /chat/send/text:
    post:
      consumes:
      - application/json
      description: Send a text message to a WhatsApp contact or group. Supports various
        features including link previews, mentions, replies, forwarding, typing simulation,
        and ephemeral messages. The message can include up to 4096 characters and
        supports Unicode, emojis, and formatting.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send text message
      tags:
      - Chat
  /chat/send/video:
    post:
      consumes:
      - application/json
      description: Send a video message to a WhatsApp contact or group. Supports MP4,
        AVI, MOV, and other common video formats. Videos can be sent as base64 data
        URLs or HTTP(S) URLs. Features include captions, view-once messages, mentions,
        replies, forwarding, and ephemeral messages. Large videos are automatically
        optimized for WhatsApp delivery.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send video message
      tags:
      - Chat
  /chat/star:
    post:
      consumes:
      - application/json
      description: Star or unstar a message to save it for later reference. Starred
        messages can be easily found in the "Starred Messages" section. You must provide
        the chat JID, message ID, and whether the message was sent by you (from_me).
        For group messages, also provide the sender JID. Set star to true to star
        or false to unstar the message.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Star request
        in: body
        name: request
        required: true
        schema:
          properties:
            chat_jid:
              type: string
            from_me:
              type: boolean
            message_id:
              type: string
            sender_jid:
              type: string
            star:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: index_chat_jid is the chat JID used in the sync mutation index
            (LID for people when known)
          schema:
            properties:
              chat_jid:
                type: string
              index_chat_jid:
                type: string
              message:
                type: string
              message_id:
                type: string
              starred:
                type: boolean
              success:
                type: boolean
            type: object
        "400":
          description: Missing chat_jid or message_id, or invalid JID
