              type: string
            phone:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: index_jid is the JID used in the sync mutation index (LID for
            people when known; groups keep their JID)
          schema:
            properties:
              applied:
                type: boolean
              index_jid:
                type: string
              jid:
                type: string
              label_id:
                type: string
              message:
                type: string
              success:
                type: boolean
            type: object
        "400":
          description: Missing phone or label_id, or invalid phone
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session or send failure
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Apply or remove label from chat
      tags:
      - Label
  /label/list:
    get:
      description: Lists the labels (called "lists" in the personal WhatsApp app)
        with the chats that carry each one. With refresh=true the gateway runs a full
        sync of the regular app state collection and rebuilds the list from the decrypted
        snapshot; complete=true is only returned after such a successful sync (synced_at
        tells when), and later changes from the phone keep it current. Without a successful
        refresh the list only holds what this process observed or sent (complete=false).
        The full sync does not emit label events to webhooks. Deleted labels are included
        with deleted=true. Message labels (label_message) are not shown by the official
        apps.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Run a full sync of the regular collection first
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              complete:
                type: boolean
              labels:
                items:
                  type: object
                type: array
              observed_from_app_state:
                type: boolean
              synced_at:
                type: string
            type: object
        "500":
          description: No session or not logged in
          schema:
            properties:
              error:
                type: string
            type: object
        "501":
          description: Bundled library cannot return the snapshot
          schema:
            properties:
              error:
                type: string
            type: object
        "502":
          description: Full sync failed
          schema:
            properties:
              error:
                type: string
            type: object
        "503":
          description: Client not connected
          schema:
            properties:
              error:
                type: string
            type: object
      summary: List labels
      tags:
      - Label
  /label/manage:
    post:
      consumes:
      - application/json
      description: Create new labels, edit existing labels, or delete labels. Labels
        (called "lists" in the personal WhatsApp app) organize chats. When label_id
        is omitted a numeric ID is generated (official clients only accept numeric
        label IDs) and the label is created as an active CUSTOM list; the response
        carries label_id_generated and label_type. An explicit label_id keeps the
        previous behavior. label_color is the palette index. Use GET /label/list to
        see labels known to this gateway.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Label request
        in: body
        name: request
        required: true
        schema:
          properties:
            delete:
              type: boolean
            label_color:
              type: integer
            label_id:
              type: string
            label_name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: label_type is present when the gateway sets the list type (CUSTOM
            for generated ids)
          schema:
            properties:
              label_color:
                type: integer
              label_id:
                type: string
              label_id_generated:
                type: boolean
              label_name:
                type: string
              label_type:
                type: string
              message:
                type: string
              success:
                type: boolean
            type: object
        "400":
          description: label_name required, or label_id required for deletion
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session or send failure
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Manage labels (create, edit, delete)
      tags:
      - Label
