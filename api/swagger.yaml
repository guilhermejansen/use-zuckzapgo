  /newsletter/transfer-ownership:
    post:
      consumes:
      - application/json
      description: 'Make another admin the owner of a channel. THIS IS NOT REVERSIBLE
        by you once it succeeds, so every pre-condition the official client checks
        is checked HERE, against the channel''s follower list, before anything is
        sent: the session must be the current owner, the target must not be the session
        itself, the target must already follow the channel, and its role there must
        be exactly admin — the official selection screen says it outright, "You can
        only transfer ownership to admins." Each failure answers 409 with a machine-readable
        reason (not_owner, target_not_admin) and nothing is sent. A target missing
        from the follower list answers 409 target_not_admin: that list did not show
        them as an admin, whether they follow as a subscriber (WhatsApp can leave
        a subscriber out, seen live) or do not follow; a target missing from a follower
        list that came back full (5000, the same list the official app checks) answers
        409 target_not_in_follower_list instead, because its absence proves nothing;
        transfer_to_self answers 400. If the roles cannot be read the request is refused
        with 502 roles_unreadable rather than sent unchecked. EVERY error answer carries
        sent: false when the request never left the gateway, so retrying it is safe,
        and sent: true when it MAY have reached WhatsApp — a conservative bound —
        so the current role has to be read before anything else. A 502 whatsapp_refused
        is WhatsApp''s answer to the only send there was: these mutations are never
        resent after a dropped connection, which surfaces as 504 instead. What the
        wording does not say: a successful transfer leaves you an ADMIN of the channel,
        not a subscriber. The official apps drop that remaining role in a second step;
        here that step is dismiss_self_as_admin, which defaults to false, because
        getting the admin role back needs a fresh admin invite from the new owner.
        When it is asked for and only that second step fails, the answer is still
        200 with self_demoted false and a warning: the ownership did move, and retrying
        would not undo it. When that second step was sent and not confirmed, your_role
        is unknown and self_demoted is null: read the roles with /newsletter/admins.
        A transfer whose outcome is unknown — a timeout, a disconnection after sending,
        or an answer that does not confirm it — answers 504 transfer_outcome_unknown
        and must NOT be retried: read the role with /newsletter/admins and decide
        from there. A change that never left the gateway answers 503 whatsapp_not_connected
        when the connection was lost before it left (a session already disconnected
        when the request arrives gets the usual 500 client not connected), 501 unsupported_client_platform
        or 500 not_sent, all with sent false: retrying is safe.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Channel and new owner
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.NewsletterTransferOwnershipRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties: true
            type: object
      summary: Transfer ownership of a channel
      tags:
      - Newsletter
