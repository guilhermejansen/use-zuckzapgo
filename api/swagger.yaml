  /newsletter/report:
    post:
      consumes:
      - application/json
      description: 'Report a channel to WhatsApp, as the "Report channel" row of the
        channel''s info screen does (spam flow newsletter_info_report). It reaches
        WhatsApp''s moderation and cannot be undone. The route first reads the channel''s
        name, which the report carries; if that read fails, it answers 502 and nothing
        is sent. ONE DIFFERENCE FROM THE APPS: the apps attach up to five of the channel''s
        latest posts to the report as samples; this route sends NO post samples, only
        the report of the channel itself, so post_samples_sent is always 0. Following
        the channel is not changed: the apps offer to unfollow in the same dialog,
        which is /newsletter/unfollow here. The report is sent once and never resent:
        when the connection drops or WhatsApp does not answer in time, the route answers
        504, because the report may already have been received. A refusal from WhatsApp
        (400, 403, 429 and so on) answers 502 with WhatsApp''s code. Errors: 400 invalid
        input, 501 when the bundled library cannot report, 502 when the name cannot
        be read or WhatsApp refuses, 504 when the outcome is unknown. A report that
        never left the gateway answers 503 whatsapp_not_connected with sent false
        when the connection was lost before it left (a session already disconnected
        when the request arrives gets the usual 500 client not connected); retrying
        is safe. The report is an IQ, not a MEX request, so the 501 and 500 not-sent
        answers of the other channel changes do not apply. On a client platform that
        cannot send MEX requests the read answers 501 unsupported_client_platform
        with sent false; retrying will not help.'
