      description: 'Retrieve comprehensive information about a WhatsApp contact combining
        data from multiple sources: IsOnWhatsApp, GetUserInfo, GetProfilePictureInfo,
        GetBusinessProfile, Store.Contacts, and Store.LIDs. Accepts phone number,
        JID, or LID as input.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
