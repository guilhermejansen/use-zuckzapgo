  /group/history/originals:
    get:
      description: Manual selection uses physical metadata key order, not chronology
        or company attribution. Default limit 25, maximum 100; at most 200 keys are
        examined. An empty page may have has_more=true. Cursor scopes group, principal
        and filters. Local availability is rechecked and is not reserved. Automatic
        selection currently returns 503 history_company_proof_unavailable without
        scanning originals.
      parameters:
      - description: User token
        in: header
        name: token
        required: true
        type: string
      - description: Group JID
        in: query
        name: group_jid
        required: true
        type: string
      - description: Page size 1-100; default 25
        in: query
        name: limit
        type: integer
      - description: Cursor returned by the preceding page
        in: query
        name: cursor
        type: string
      - description: Filter by original authorship
        in: query
        name: from_me
        type: boolean
      - description: Include bounded stored text/caption; default false
        in: query
        name: preview
        type: boolean
      - description: manual (default) or automatic; automatic requires persisted company
          authorship and coverage proof
        in: query
        name: selection
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.GroupHistoryOriginalsPageResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: List locally retained original group messages
      tags:
      - Group
  /group/history/originals/check:
    post:
      consumes:
      - application/json
      description: Read-only. Default/provenance views accept 1-100 IDs, unchanged.
        View=capture accepts 1-200 IDs and additionally rereads pre-send admissions
        and native continuity in one SQL snapshot. Neither view grants company authority,
        remote retention or delivery. Both explicit views require preview=false. No
        WhatsApp connection is required for this read.
      parameters:
      - description: User token
        in: header
        name: token
        required: true
        type: string
      - description: Group, 1-100 distinct original IDs and optional preview
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GroupHistoryOriginalsCheckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.GroupHistoryOriginalsCheckResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Check locally retained original group messages
      tags:
      - Group
  /group/history/send:
    post:
      consumes:
      - application/json
      description: 'Requires distinct unused bundle_id and notice_id. IDs are durably
        reserved before network; retrying either ID is rejected even after failure.
        Acknowledgements do not prove recipient delivery. Originals are retained for
        a bounded window (GLOBAL_GROUP_HISTORY_RETENTION_DAYS, default 90 days which
        is also the maximum, 0 disables retention; GLOBAL_GROUP_HISTORY_RETENTION_MAX_PER_USER,
        default 100000 newest per user): a message outside the window returns the
        same 409 as a message that was never retained.'
      parameters:
      - description: User token
        in: header
        name: token
        required: true
        type: string
      - description: Group, retained message IDs, recipients and unused operation
          IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GroupHistorySendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      summary: Send retained group history
      tags:
      - Group
  /group/history/send/status:
    post:
      consumes:
      - application/json
      description: LOCAL_TERMINAL requires two matching terminal reservations. All
        absent, partial, attempted, invalid or disagreeing pairs are UNKNOWN. Does
        not reconstruct the original HTTP response or recipient delivery. No IDs are
        released and retry_safe is always false.
      parameters:
      - description: User token
        in: header
        name: token
        required: true
        type: string
      - description: Group, distinct bundle/notice IDs and optional expected request
          digest
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GroupHistorySendStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.GroupHistorySendStatusResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Read persisted local evidence of a group history send
      tags:
      - Group
