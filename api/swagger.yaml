  /session/status:
    get:
      consumes:
      - application/json
      description: |-
        Get the current WhatsApp connection status including connected state, logged in state, global transport skip flags, and API echo (Info.IsFromAPI) configuration. The payload mirrors what the dispatcher sees, so dashboards can render accurate controls.
        Connector aliases authenticate with the ephemeral connector token instead of the permanent user token.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get connection status
      tags:
      - Session
  /status/send/audio:
    post:
      consumes:
      - application/json
      description: 'Send an audio status. audio accepts a base64 data URL or an HTTP(S)
        URL. ptt=true (default) sends a voice note: use OGG/Opus; the MIME is normalized
        to exactly "audio/ogg; codecs=opus" because the official apps silently drop
        voice-note statuses with any other MIME. ptt=false sends an audio file (MP3,
        M4A/AAC or OGG; unknown types fall back to audio/mpeg). audience restricts
        who sees the status to individual PN (digits or PN@s.whatsapp.net) or LID
        recipients and exclude_list removes recipients; entries that are not individual
        PN or LID recipients are ignored; requests without audience/exclude_list,
        or whose entries are all empty or invalid, use the account status privacy.
        A valid audience or exclude_list is never widened: if it cannot be applied
        (no recipients remain after exclusions, or recipient resolution fails) the
        status is not sent and the route returns 500 with the send failure error suffixed
        by "(status audience could not be applied; the status was not sent)". The
        audience never returns 400. The response reports the final mime_type, duration
        in seconds and has_waveform.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Audio status
        in: body
        name: request
        required: true
        schema:
          properties:
            audience:
              items:
                type: string
              type: array
            audio:
              type: string
            caption:
              type: string
            exclude_list:
              items:
                type: string
              type: array
            id:
              type: string
            ptt:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              duration:
                type: integer
              has_waveform:
                type: boolean
              message_id:
                type: string
              mime_type:
                type: string
              ptt:
                type: boolean
              status:
                type: string
              timestamp:
                type: string
              type:
                type: string
            type: object
        "400":
          description: Missing audio, invalid body or audience
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Client not connected, upload or send failure, or status audience/exclude_list
            could not be applied
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Send an audio status message
      tags:
      - Status
