  /call/{call_id}/video/stream:
    get:
      description: Upgrade to a WebSocket bridging raw H.264 Annex-B access units.
        Server sends peer video as binary frames; client sends binary frames that
        are forwarded to the peer. Pass fmt=participant to receive per-participant
        framed frames plus JSON control events (required for group video). Auth via
        ?token={TOKEN}.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Live call ID
        in: path
        name: call_id
        required: true
        type: string
      - description: 'Inbound framing: ''participant'' for per-participant demux (group
          video). Default is bare access units.'
        in: query
        name: fmt
        type: string
