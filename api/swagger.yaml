  /user/check:
    post:
      consumes:
      - application/json
      description: Verify if one or more phone numbers have WhatsApp accounts. Each
        entry reports the phone-shaped JID, the contact's LID (when WhatsApp reports
        one), business verification (name and level), the WhatsApp username (still
        rolling out — usually empty) and the contact's default disappearing-message
        setting.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Phone numbers in international format, without a leading +
        in: body
        name: request
        required: true
        schema:
          properties:
            Phone:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Check results — Username, VerifiedLevel and DisappearingMode
            are omitted when unknown
          schema:
            properties:
              Users:
                items:
                  properties:
                    DisappearingMode:
                      properties:
                        duration_sec:
                          type: integer
                        enabled:
                          type: boolean
                        set_at:
                          type: string
                      type: object
                    IsInWhatsapp:
                      type: boolean
                    JID:
                      type: string
                    LID:
                      type: string
                    Query:
                      type: string
                    Username:
                      type: string
                    VerifiedLevel:
                      type: string
                    VerifiedName:
                      type: string
                  type: object
                type: array
            type: object
        "400":
          description: Missing or undecodable Phone payload
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session, or the usync query failed
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Check if users are on WhatsApp
      tags:
      - User
  /user/contact-link/resolve:
    post:
      consumes:
      - application/json
      description: Resolves a contact QR code (or its wa.me/qr URL) to the account
        it points to. A code WhatsApp does not know answers 404. Any other failure
        answers 502 with the error text plus reason (whatsapp_rejected with WhatsApp's
        IQ whatsapp_code, timeout, canceled, disconnected, invalid_response, transport_failed
        or upstream_failed); the code itself is never echoed.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Contact code or WhatsApp QR URL
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.UserContactLinkResolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UserContactLinkResolveResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      summary: Resolve a WhatsApp contact QR link
      tags:
      - User
  /user/contact/add:
    post:
      consumes:
      - application/json
      description: 'Add a new contact or update an existing contact''s name in WhatsApp.
        The contact will be saved to the primary address book and synchronized across
        all devices. The route already resolves a sync conflict the way the official
        client does (it applies the patches WhatsApp returns with the 409 and resends
        once), then runs a full sync and asks the phone for a recovery copy (at most
        one request per collection every 2 minutes). When the conflict persists (WhatsApp''s
        copy of the collection fails verification and the phone does not answer),
        the 500 keeps its error text and adds reason app_state_conflict, collection,
        retryable true, retry_after_seconds (until the next recovery request is allowed)
        and hint. Re-pairing the session does not clear it: the phone must send the
        recovery. The official client''s last resort, APP_STATE_FATAL_EXCEPTION_NOTIFICATION
        (the phone resets the collection and every linked device is logged out), is
        never used.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Add or update contact
      tags:
      - User
  /user/contact/info:
