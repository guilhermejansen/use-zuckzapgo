      description: 'Send the channel follow invite card the official apps send from
        "Invite followers". It is a message of its own, newsletterFollowerInviteMessageV2
        (WAWebGenerateNewsletterFollowerInviteMessageProto), not a shared link, so
        the recipient sees a card with the channel picture, name and your caption.
        Unlike the admin invite, there is nothing to register on the server first:
        the official flow sends the message and nothing else, so there is no invite
        to revoke or expire. Errors: 400 invalid input (including an image whose bytes
        do not decode as JPEG, PNG, GIF or WebP, which would otherwise send a card
        with no picture), 502 when WhatsApp refuses the message.'
      parameters:
      - description: User authentication token
        in: header
