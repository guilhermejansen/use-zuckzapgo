  /chat/downloadvideo:
    post:
      consumes:
      - application/json
      description: Download a video from a WhatsApp message and return it as base64
        encoded data URL. You need to provide the media information from the received
        message including URL, media key, and file hashes. The video is decrypted
        and returned as a data URL that can be directly used in HTML video tags or
        saved to disk. Supports MP4, AVI, MOV, and other video formats.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Download video from message
      tags:
      - Chat
  /chat/favorite:
    post:
      consumes:
      - application/json
      description: 'Adds or removes one chat (contact or group) from the Favorites
        list of the official apps. WhatsApp syncs Favorites as ONE complete ordered
        list (favorites app state action), so the gateway must know the current list
        to change a single entry: it uses the list last observed from app state or
        sent through this API (see GET /chat/favorites). When the list is unknown
        the request fails with 409 instead of silently wiping the other favorites;
        set force=true with favorite=true to replace the whole list with only this
        chat, or use PUT /chat/favorites with the complete list. People are addressed
        by LID when known.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Favorite request
        in: body
        name: request
        required: true
        schema:
          properties:
            favorite:
              type: boolean
            force:
              type: boolean
            phone:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              favorite:
                type: boolean
              favorites:
                items:
                  type: string
                type: array
              index_jid:
                type: string
              jid:
                type: string
              success:
                type: boolean
            type: object
        "400":
          description: Invalid request
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Current favorites list unknown
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session or send failure
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Add or remove a chat from Favorites
      tags:
      - Chat
  /chat/favorites:
    get:
      description: Returns the Favorites list. With refresh=true the gateway runs
        a full sync of the regular_high app state collection and rebuilds the list
        from the decrypted snapshot; complete=true is only returned after such a successful
        sync. Without it the list is the one last observed from app state or sent
        through this API; known=false means none was seen yet, in which case favorites
        is empty and does NOT mean the phone has no favorites. The full sync does
        not emit favorites events to webhooks.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Run a full sync of the regular_high collection first
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              complete:
                type: boolean
              favorites:
                items:
                  type: string
                type: array
              known:
                type: boolean
              source:
                type: string
              synced_at:
                type: string
            type: object
        "500":
          description: No session or not logged in
          schema:
            properties:
              error:
                type: string
            type: object
        "501":
          description: Bundled library cannot return the snapshot
          schema:
            properties:
              error:
                type: string
            type: object
        "502":
          description: Full sync failed
          schema:
            properties:
              error:
                type: string
            type: object
        "503":
          description: Client not connected
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Get the known Favorites list
      tags:
      - Chat
    put:
      consumes:
      - application/json
      description: 'Replaces the complete ordered Favorites list with the given chats.
        This mirrors the official sync action, which always carries the whole list:
        chats missing from the request are removed from Favorites. An empty list clears
        Favorites. People are addressed by LID when known.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Complete ordered list
        in: body
        name: request
        required: true
        schema:
          properties:
            phones:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              favorites:
                items:
                  type: string
                type: array
              success:
                type: boolean
            type: object
        "400":
          description: Invalid request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session or send failure
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Replace the Favorites list
      tags:
      - Chat
  /chat/list:
    get:
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: List Chats
      tags:
      - Chat
  /chat/markread:
    post:
      consumes:
      - application/json
      description: Mark one or more messages as read in a specific chat. This removes
        the unread badge and sends read receipts to the sender (if enabled in privacy
        settings). You must provide the chat JID, message IDs to mark as read, and
        optionally the sender JID for group messages. The operation updates the chat's
        unread count and last read message.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Mark messages as read
      tags:
      - Chat
  /chat/mute:
    post:
      consumes:
      - application/json
      description: Mute or unmute notifications for a specific chat. When muted, you
        won't receive notifications for new messages in that chat. You can mute for
        8 hours, 1 week, or always (until manually unmuted). Set mute to true with
        a duration to mute, or false to unmute. If no duration is specified when muting,
        it defaults to "always".
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Mute or unmute chat
      tags:
      - Chat
  /chat/pin:
    post:
      consumes:
      - application/json
      description: Pin or unpin a chat to keep it at the top of the chat list. Pinned
        chats appear at the top of the chat list for easy access. You can have up
        to 3 pinned chats on WhatsApp. Set pin to true to pin the chat or false to
        unpin it.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Pin or unpin chat
      tags:
      - Chat
  /chat/pin-message:
    post:
      consumes:
      - application/json
      description: Sends the official PinInChatMessage (PIN_FOR_ALL / UNPIN_FOR_ALL)
        that shows the pinned-message banner at the top of the conversation for every
        participant. duration_seconds accepts 86400 (24 hours), 604800 (7 days, default)
        or 2592000 (30 days) and is ignored when unpinning. from_me tells whether
        the target message was sent by this account; for someone else's message in
        a group, sender_jid is required. In groups WhatsApp may restrict pinning to
        admins depending on the group settings. People are addressed by LID when known
        so the embedded key matches the destination.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Pin message request
        in: body
        name: request
        required: true
        schema:
          properties:
            duration_seconds:
              type: integer
            from_me:
              type: boolean
            message_id:
              type: string
            phone:
              type: string
            pin:
              type: boolean
            sender_jid:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              chat:
                type: string
              duration_seconds:
                type: integer
              id:
                type: string
              message_id:
                type: string
              pinned:
                type: boolean
              success:
                type: boolean
              timestamp:
                type: integer
            type: object
        "400":
          description: Invalid request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session or send failure
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Pin or unpin a message inside a chat
      tags:
      - Chat
  /chat/presence:
    post:
      consumes:
      - application/json
      description: Set chat presence status to indicate typing, recording audio, or
        paused state. This shows the "typing..." or "recording audio..." indicator
        to the recipient. The presence automatically clears after a few seconds, so
        you may need to send it periodically during long operations.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Set chat presence
      tags:
      - Chat
  /chat/react:
    post:
      consumes:
      - application/json
      description: "Send a reaction emoji to a specific message. Use empty string
        or \"remove\" to remove a reaction. The reaction appears below the message
        for all participants. Common reactions include \U0001F44D, ❤️, \U0001F602,
        \U0001F62E, \U0001F622, \U0001F64F. You must specify the message ID and whether
        it was sent by you (prefix with \"me:\") or received from others. Optionally
        pass \"chat\" with the exact chat JID as received in the webhook (e.g. an
        \"@lid\" address) to guarantee the reaction renders on iOS; when omitted the
        phone number is used."
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: React to message
      tags:
      - Chat
  /chat/read:
    post:
      consumes:
      - application/json
      description: 'Changes the chat''s native state with BuildMarkChatAsRead and
        waits for the send and the refresh through the existing app state helper.
        Sends no message receipts; read=false does not undo earlier receipts. The
        ACK does not prove the badge, the unread count or the sync on every device.
        Body: one JSON object of at most 1 MiB; phone and read are required, including
        read=false. Accepts numeric PN/LID and non-AD g.us groups; prefers a known
        LID, falling back to the phone number. An omitted or null last_message_timestamp
        uses the current time, captured once; when given, it must be Unix seconds
        from 1 to 253402300799. last_message_id requires an explicit timestamp and
        last_message_from_me; last_message_sender_jid is required only for a received
        group message and must be a non-AD PN/LID person. Unknown fields are tolerated.
        The chat''s existence is not checked. The app state helper may repeat the
        operation under the existing conflict and recovery policy.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: 'Requested state; minimal example: {\'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.ChatReadStateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Done: the chat JID actually written and the requested state,
            with no remote readback'
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/main.ChatReadStateResponse'
              success:
                type: boolean
            type: object
        "400":
          description: Invalid JSON, target or range
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              success:
                type: boolean
            type: object
        "401":
          description: User context missing or User ID missing
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              success:
                type: boolean
            type: object
        "500":
          description: no session, or failed to update chat read status (store, keys,
            sync, cancellation or upstream)
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              success:
                type: boolean
            type: object
      summary: Mark a chat as read or unread
      tags:
      - Chat
  /chat/reply:
    post:
      consumes:
      - application/json
      description: |-
        Send a message that quotes a previous one. Text content only;
        media replies should use /chat/send/{image,video,document,audio} with quoted_msg_id.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Reply to a quoted message
      tags:
      - Chat
  /chat/retry/message:
    post:
      consumes:
      - application/json
      description: Retry processing of an incoming message that failed to process
        correctly, such as messages with "Unknown-sender" state. This endpoint searches
        for the message in recent cache and callback sources, then forces reprocessing
        by sending a retry receipt to the original sender. Particularly useful for
        recovering messages that were received but not properly decrypted or processed
        due to session issues, missing keys, or temporary connectivity problems. The
        system will attempt to decrypt and reprocess the message using current session
        state.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Retry failed incoming message
      tags:
      - Chat
  /chat/send/audio:
    post:
      consumes:
      - application/json
      description: Send an audio message or voice note to a WhatsApp contact or group.
        Supports various audio formats including MP3, OGG, AAC, and M4A. Can be sent
        as regular audio or PTT (Push To Talk) voice note. Audio can be provided as
        base64 data URL or HTTP(S) URL. Features include view-once messages, captions,
        replies, forwarding, and ephemeral messages. Audio is automatically processed
        and uploaded to configured S3 storage if available.
      parameters:
      - description: User authentication token
        example: '"YOUR_USER_TOKEN"'
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send audio message
      tags:
      - Chat
  /chat/send/buttons:
    post:
      consumes:
      - application/json
      description: |-
        Send a message with interactive buttons to a phone number or group. This endpoint supports multiple button types including quick replies, URL links, phone calls, copy actions, and payment integrations (PIX). The message can include media attachments (images, videos, documents) and supports all message enhancements like mentions, replies, and forwarding.
        Send interactive message with up to 3 action buttons to a WhatsApp contact or group. Requires a non-empty title with a maximum of 60 characters; do not send whitespace-only titles because WhatsApp renders an empty header area. Supports reply buttons, URL buttons, phone buttons, and PIX payment buttons. Can include optional media attachment (image, video, or document), footers, and ephemeral messages.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send buttons message
      tags:
      - Chat
  /chat/send/carousel:
    post:
      consumes:
      - application/json
      description: Send a carousel message with multiple cards to a phone number or
        group. Each card can contain images, videos, documents, text, and buttons.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send carousel message
      tags:
      - Chat
  /chat/send/contact:
    post:
      consumes:
      - application/json
      description: Send a contact card (vCard) to a WhatsApp contact or group. The
        vCard can include phone numbers, email addresses, organization details, and
        more. Supports vCard 3.0 format. The contact will be displayed as an interactive
        card that recipients can save to their address book. Features include replies,
        forwarding, and ephemeral messages.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send contact message
      tags:
      - Chat
  /chat/send/contact-request:
    post:
      consumes:
      - application/json
      description: |-
        Sends the native WhatsApp contact request: a body text plus the "Share contact" button, the same interactive the Cloud API sends with interactive.type=request_contact_info. When the contact taps the button, their own contact card arrives as a regular Message webhook (contactMessage with isSelfContact=true, vCard with TEL;waid= and X-WA-LID). The reply carries no reference to the request.

        Rules: one-to-one chats only (a phone number in digits, that number followed by @s.whatsapp.net, or a LID followed by @lid); groups, newsletters, broadcast and status return 400. body is required, 1 to 1024 characters after trimming, never truncated. Available on every plan.

        Idempotency: send your own id ([A-Za-z0-9], up to 128) and reuse it on every retry. A retry of an id already sent returns the original result without sending again (State sent, or confirmed with ConfirmedAt once the recipient's delivery/read receipt for that id arrives). 409 contact_request_dispatch_unknown means the send may have left and is never repeated; 409 contact_request_id_conflict means the id was used with another recipient, body or quote. Retry ids are remembered for 30 days.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Contact request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.contactRequestInput'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {Id, State (sent|confirmed), Details, Timestamp, ConfirmedAt}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'error: contact_request_invalid_json | contact_request_phone_required
            | contact_request_invalid_phone | contact_request_invalid_recipient |
            contact_request_body_required | contact_request_body_too_long | contact_request_invalid_id
            | contact_request_invalid_context_info | contact_request_recipient_not_on_whatsapp'
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 'error: contact_request_dispatch_unknown | contact_request_id_conflict'
          schema:
            additionalProperties: true
            type: object
        "413":
          description: 'error: contact_request_request_too_large'
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 'error: contact_request_send_failed (with detail) | contact_request_number_check_failed
            (no detail)'
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 'error: contact_request_session_unavailable | contact_request_ledger_unavailable'
          schema:
            additionalProperties: true
            type: object
      summary: Request the contact's phone number (request_contact_info)
      tags:
      - Chat
  /chat/send/document:
    post:
      consumes:
      - application/json
      description: Send a document or file attachment to a phone number or group.
        Supports various file types including PDF, Word, Excel, PowerPoint, ZIP, and
        more. The document can be sent as a base64 data URL or HTTP(S) URL. Supports
        captions, mentions, replies, forwarding, and ephemeral messages. Media is
        automatically processed and uploaded to configured S3 storage if available.
      parameters:
      - description: User authentication token
        example: '"YOUR_USER_TOKEN"'
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send document message
      tags:
      - Chat
  /chat/send/edit:
    post:
      consumes:
      - application/json
      description: Send an edited message to a phone number or group. Edits the text
        of a text message, or the CAPTION of an image, video or document — the target's
        type is detected automatically from its message id, so the request body is
        the same in both cases (`phone`, `id`, `body`). `body` carries the new text
        or the new caption. Media captions can be edited on messages sent through
        this API and on messages sent from the operator's own phone. If the target
        id is unknown to this instance the edit is sent as a text edit, as before.
        Supports mentions, replies, forwarding, and various message enhancements.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send edited message (text or media caption)
      tags:
      - Chat
  /chat/send/event:
    post:
      consumes:
      - application/json
      description: |-
        Send an event message to a phone number or group. This endpoint creates rich event invitations with scheduling, location, and call integration capabilities.
        Send calendar event invitation with date, time, location, and description to a WhatsApp contact or group. Recipients can add the event to their calendar. Features include replies, forwarding, and ephemeral messages.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send event message
      tags:
      - Chat
  /chat/send/event-invite:
    post:
      consumes:
      - application/json
      description: 'Sends to a chat the invitation (`eventInviteMessage`) of an **event
        with link**, the kind created in the Events tab of the official apps, with
        its cover preview. The event must already exist: describe it in `event_invite`
        with the same fields the webhook delivers in `data.event_invite` when an invitation
        is sent or received, so a received invitation can be passed on as it came,
        unless its `status` is `DELETED`, `LEFT_EVENT` or `REMOVED_FROM_INVITE_LIST`
        (refused when sending). `event_id`, `title` and `start_time` are required;
        `status` defaults to `ACTIVE` and also accepts `CANCELED`, `SUSPENDED` and
        `UNKNOWN`; `thumbnail_b64` is the JPEG preview carried by the invitation and
        `cover_image_handle` identifies the full cover on WhatsApp''s servers; the
        official apps showed the cover even when the preview was omitted. This endpoint
        does **not** create events, upload covers or add the recipient to the event''s
        guest list on WhatsApp''s servers: those are done in the official app. For
        the in-chat event without cover use `POST /chat/send/event`.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Chat and the event being shared
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.EventInviteSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Invitation sent
          schema:
            properties:
              Details:
                type: string
              Id:
                type: string
              Timestamp:
                type: string
            type: object
        "400":
          description: Missing or invalid field; nothing is sent
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Authentication required
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session, or WhatsApp refused the message
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Send the invitation to an existing event with link
      tags:
      - Chat
  /chat/send/eventresponse:
    post:
      consumes:
      - application/json
      description: 'RSVP to a calendar event. The event is identified by the message
        id of its creation message. `response` is one of GOING, NOT_GOING, MAYBE or
        UNKNOWN. `with_guest` (boolean) is WhatsApp''s "Going with guest" — the official
        app only offers this option and always sends a guest count of 1, rendered
        as "Going with guest". `extra_guest_count` is deprecated but still accepted:
        0 means no guest and any value >= 1 is sent as 1, exactly like the app; `with_guest`
        wins when both are present. Guests only apply to GOING (other responses are
        sent without guest). The creator must allow extra guests on the event for
        the guest to be shown. To remove a previous answer send `response` UNKNOWN.
        The RSVP is encrypted with the event''s message secret, so the event must
        have been sent or received by this session — an event created before this
        instance recorded event metadata cannot be answered and returns 409.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Event response
        in: body
        name: request
        required: true
        schema:
          properties:
            event_message_id:
              type: string
            extra_guest_count:
              type: integer
            phone:
              type: string
            response:
              type: string
            with_guest:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: RSVP sent
          schema:
            properties:
              Details:
                type: string
              Id:
                type: string
              Response:
                type: string
              Timestamp:
                type: string
            type: object
        "400":
          description: Missing fields, or an unknown response value
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Unknown event message id
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Event predates RSVP support — its creator info was never recorded
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Respond to a calendar event
      tags:
      - Chat
  /chat/send/flow:
    post:
      consumes:
      - application/json
      description: |-
        Send a WhatsApp Flow (an interactive form) to a contact.

        How to use:
        1. Create your form in the WhatsApp Business app (Tools > Forms).
        2. Get your `flow_id`: send that form once from the app to any chat. Since your number is connected here, that message is delivered to your configured webhook — open it and copy the `flow_id` (and the rest of `button_params_json`). Save it. You only do this once per form, then reuse the saved `flow_id`.
        3. Send the form here with `name` set to `galaxy_message` and your saved `flow_id` inside `button_params_json`.
        4. The answers your contact submits come back to your configured webhook.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send flow message (WhatsApp Flow / interactive form)
      tags:
      - Chat
  /chat/send/group-invite:
    post:
      consumes:
      - application/json
      description: |-
        Sends the group invitation the app sends when adding someone was refused by their privacy settings ("Couldn't add … You can invite them privately"): a groupInviteMessage in the one-to-one chat with that person, carrying the invitation code and expiration that POST /group/updateparticipants returned in participants[].add_request, the group, its name, an optional caption and a thumbnail. The person accepts it from their account with POST /group/join (or reads it with POST /group/inviteinfo) using Code, GroupJID, Inviter and Expiration.

        Rules: phone is one-to-one only (digits, @s.whatsapp.net or @lid); group_jid must be a group (@g.us); code is required (at most 128 characters); expiration is required, as RFC 3339 (the add_request value) or unix seconds, and must be in the future (400 before anything is sent). caption is optional and omitted means no caption (the app's own initial text is "Invitation to join my WhatsApp group"). group_name and thumbnail are optional; when omitted the group's name and picture preview are read from WhatsApp in best effort, and a failed read only leaves them out. Available on every plan.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Recipient, group, invitation code and expiration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GroupInviteSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {Details: Sent, Timestamp, Id}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid body, recipient, group, code, expiration, caption,
            group name, thumbnail or id
          schema:
            additionalProperties: true
            type: object
        "413":
          description: request body too large
          schema:
            additionalProperties: true
            type: object
        "500":
          description: no session, or the send failed
          schema:
            additionalProperties: true
            type: object
      summary: Send a group invitation privately
      tags:
      - Chat
  /chat/send/image:
    post:
      consumes:
      - application/json
      description: Send an image message to a WhatsApp contact or group. Supports
        JPEG, PNG, GIF, and WebP formats. Images can be sent as base64 data URLs or
        HTTP(S) URLs. Features include captions, view-once messages, mentions, replies,
        forwarding, and ephemeral messages. Large images are automatically compressed
        while maintaining quality. Images are automatically processed and uploaded
        to configured S3 storage if available.
      parameters:
      - description: User authentication token
        example: '"YOUR_USER_TOKEN"'
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send image message
      tags:
      - Chat
  /chat/send/link:
    post:
      consumes:
      - application/json
      description: 'Send a text message with a link preview. By default the preview
        metadata (title/description/image) is auto-fetched from the URL''s OpenGraph
        tags. The optional `preview` object lets you override any field for a fully
        custom preview card (e.g. coupon links that should not expose tracker metadata).
        `preview.image` accepts a base64 data URL OR an http(s) URL. Set `disable_preview:
        true` to send an extended text message without any preview card. Supports
        captions, mentions, replies, and forwarding.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send link message with link preview (auto-fetched or custom)
      tags:
      - Chat
  /chat/send/list:
    post:
      consumes:
      - application/json
      description: Send a message with an interactive list to a phone number or group.
        This endpoint creates rich, structured lists perfect for product catalogs,
        service menus, restaurant menus, and interactive selections.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send list message
      tags:
      - Chat
  /chat/send/location:
    post:
      consumes:
      - application/json
      description: Send a location message to a WhatsApp contact or group with GPS
        coordinates. You can optionally include a location name and address for better
        context. The location will be displayed as an interactive map in WhatsApp.
        Features include replies, forwarding, and ephemeral messages.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send location message
      tags:
      - Chat
  /chat/send/poll:
    post:
      consumes:
      - application/json
      description: 'Send a poll with multiple choice options to a WhatsApp group or
        contact. Polls allow recipients to vote on options you provide. You can create
        polls with 2-12 options, and optionally allow multiple selections. Poll results
        are visible to all participants in real-time. Note: Polls are primarily designed
        for group chats.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send poll message
      tags:
      - Chat
  /chat/send/pollvote:
    post:
      consumes:
      - application/json
      description: Cast (or retract) this session's vote on a poll. The poll is identified
        by the message id of its creation message; the option names must match the
        poll's own options exactly. Multi-select polls accept more than one option.
        An empty `options` array RETRACTS the vote. The vote is encrypted with the
        poll's message secret, so the poll must have been sent or received by this
        session — a poll created before this instance recorded poll metadata cannot
        be voted on and returns 409.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Poll vote
        in: body
        name: request
        required: true
        schema:
          properties:
            options:
              items:
                type: string
              type: array
            phone:
              type: string
            poll_message_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Vote sent
          schema:
            properties:
              Details:
                type: string
              Id:
                type: string
              Options:
                items:
                  type: string
                type: array
              Timestamp:
                type: string
            type: object
        "400":
          description: Missing fields, or an option that the poll does not have
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Unknown poll message id
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Poll predates vote support — its creator info was never recorded
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Vote on a poll
      tags:
      - Chat
  /chat/send/ptv:
    post:
      consumes:
      - application/json
      description: Send a PTV by link or base64 (data URL). Only requires phone and
        video.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send PTV (Pre-Recorded Transfer Video)
      tags:
      - Chat
  /chat/send/sticker:
    post:
      consumes:
      - application/json
      description: Send a sticker message to a WhatsApp contact or group. Stickers
        must be in WebP format with maximum dimensions of 512x512 pixels. Animated
        stickers are supported. Stickers can be sent as base64 data URLs or HTTP(S)
        URLs. Features include replies, forwarding, and ephemeral messages. Stickers
        are automatically processed and uploaded to configured S3 storage if available.
      parameters:
      - description: User authentication token
        example: '"YOUR_USER_TOKEN"'
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send sticker message
      tags:
      - Chat
  /chat/send/text:
    post:
      consumes:
      - application/json
      description: Send a text message to a WhatsApp contact or group. Supports various
        features including link previews, mentions, replies, forwarding, typing simulation,
        and ephemeral messages. The message can include up to 4096 characters and
        supports Unicode, emojis, and formatting.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send text message
      tags:
      - Chat
  /chat/send/video:
    post:
      consumes:
      - application/json
      description: Send a video message to a WhatsApp contact or group. Supports MP4,
        AVI, MOV, and other common video formats. Videos can be sent as base64 data
        URLs or HTTP(S) URLs. Features include captions, view-once messages, mentions,
        replies, forwarding, and ephemeral messages. Large videos are automatically
        optimized for WhatsApp delivery.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send video message
      tags:
      - Chat
  /chat/star:
    post:
      consumes:
      - application/json
      description: Star or unstar a message to save it for later reference. Starred
        messages can be easily found in the "Starred Messages" section. You must provide
        the chat JID, message ID, and whether the message was sent by you (from_me).
        For group messages, also provide the sender JID. Set star to true to star
        or false to unstar the message.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Star request
        in: body
        name: request
        required: true
        schema:
          properties:
            chat_jid:
              type: string
            from_me:
              type: boolean
            message_id:
              type: string
            sender_jid:
              type: string
            star:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: index_chat_jid is the chat JID used in the sync mutation index
            (LID for people when known)
          schema:
            properties:
              chat_jid:
                type: string
              index_chat_jid:
                type: string
              message:
                type: string
              message_id:
                type: string
              starred:
                type: boolean
              success:
                type: boolean
            type: object
        "400":
          description: Missing chat_jid or message_id, or invalid JID
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: No session or send failure
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Star or unstar message
      tags:
      - Chat
  /community/all-groups:
    post:
      consumes:
      - application/json
      description: 'The complete list behind the community''s manage-groups screen:
        it reaches the groups this session has not joined, which POST /community/sub-groups
        does not, and carries each group''s general-chat and hidden flags, its join
        approval setting and how many join requests it has waiting. The announcement
        group comes first, marked is_default_sub_group.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Community JID and optional group hint
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CommunityAllSubGroupsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid community JID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Session cannot inspect this community
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Community not found
          schema:
            additionalProperties: true
            type: object
        "429":
          description: WhatsApp community request rate limited
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Community request failed
          schema:
            additionalProperties: true
            type: object
      summary: Get every group of a community, including the ones not joined
      tags:
      - Community
  /community/announcement:
    post:
      consumes:
      - application/json
      description: Send an announcement to a community. This allows you to send an
        announcement to a community.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send an announcement to a community
      tags:
      - Community
  /community/create:
    post:
      consumes:
      - application/json
      description: Create a new WhatsApp community. This allows you to create a new
        community group.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Create a new WhatsApp community
      tags:
      - Community
  /community/deactivate:
    post:
      consumes:
      - application/json
      description: 'End the community: WhatsApp unlinks every group from it and the
        community stops existing. The groups survive on their own. This cannot be
        undone, so the route requires confirm=true, and only the account that created
        the community may do it: for anyone else WhatsApp answers 403. Every error
        answer carries success false, a reason and sent: false means the request never
        left the gateway; true means it may have reached WhatsApp. A deactivation
        whose outcome is unknown (a timeout or a disconnection after sending) answers
        504 deactivate_outcome_unknown and must NOT be retried: read the community
        with GET /group/info first, where a not-found answer means it was deactivated.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Community JID and confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CommunityDeactivateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid community JID or confirm not set
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Session did not create this community
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Community no longer exists
          schema:
            additionalProperties: true
            type: object
        "429":
          description: WhatsApp community request rate limited
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Community request failed
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Session not connected; nothing was sent
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Deactivation sent but its outcome is unknown; do not retry
          schema:
            additionalProperties: true
            type: object
      summary: Deactivate a community
      tags:
      - Community
  /community/group-add-mode:
    post:
      consumes:
      - application/json
      description: 'Set admins or all_members for the community''s "Who can add new
        groups" permission. Switching to all_members makes WhatsApp approve every
        pending group suggestion, so this route lists them first, as the official
        app does: when there are any, the switch is refused with 409 pending_suggestions_need_confirmation
        and pending_suggestions (their count) unless confirm_approve_pending is true,
        and with it the answer reports pending_suggestions_approved. When the pending
        suggestions do not all fit in the community (101 groups by WhatsApp''s default),
        both answers add available_group_slots and a community_full warning; the server
        approves only what fits. With no pending suggestions the switch is applied
        directly. If the pending suggestions cannot be read, the switch is refused
        with 502 suggestions_unreadable rather than applied blind. Server authorization
        applies.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Community JID and mode
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CommunityGroupAddModeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid community JID or mode
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Session cannot change this community
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Pending suggestions would be approved; confirm_approve_pending
            required
          schema:
            additionalProperties: true
            type: object
        "429":
          description: WhatsApp community request rate limited
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Community request failed
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Pending suggestions could not be read
          schema:
            additionalProperties: true
            type: object
      summary: Set who can add groups to a community
      tags:
      - Community
  /community/group-suggestions:
    post:
      consumes:
      - application/json
      description: List the groups members suggested for a community and that are
        still waiting for an admin decision. Suggestions only exist while the community's
        group-add mode is admins; see POST /community/group-add-mode. WhatsApp needs
        a group of the community that this session has joined, so a community whose
        groups this session cannot see cannot be queried.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Community JID and optional group hint
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CommunityGroupSuggestionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid community JID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Session cannot inspect this community
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Community or announcement group not found
          schema:
            additionalProperties: true
            type: object
        "429":
          description: WhatsApp community request rate limited
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Community request failed
          schema:
            additionalProperties: true
            type: object
      summary: Get a community's pending group suggestions
      tags:
      - Community
  /community/group-suggestions/create:
    post:
      consumes:
      - application/json
      description: 'What a member does while only admins may add groups: suggest groups
        that already exist, for an admin to approve or reject. WhatsApp answers per
        group, so a 200 does not mean every group was suggested: read the results
        array, where a non-zero error is that group''s refusal (405 already suggested
        by another member, 406 name too long, 419 the community reached its suggestion
        limit). To suggest a group that does not exist yet, use POST /community/group-suggestions/create-new.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Community JID and groups
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CommunityGroupSuggestionCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid community JID or groups
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Session cannot suggest groups to this community
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Community not found
          schema:
            additionalProperties: true
            type: object
        "429":
          description: WhatsApp community request rate limited
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Community request failed
          schema:
            additionalProperties: true
            type: object
      summary: Suggest existing groups for a community
      tags:
      - Community
  /community/group-suggestions/create-new:
    post:
      consumes:
      - application/json
      description: 'The app''s "Suggest a new group" flow: propose a group that does
        not exist yet, which WhatsApp creates inside the community only if an admin
        approves the suggestion. The response carries the suggestion''s JID, which
        is what POST /community/group-suggestions/update takes, and who WhatsApp recorded
        as its creator. Every setting is optional. join_approval, member_add_mode
        and history_share_mode always go out, as they do from the app, which always
        sends its form''s state; when left out, the values that form starts with are
        sent: join approval off, all_member_add, all_member_share. The other settings
        are sent only when asked for. hidden is accepted by WhatsApp''s schema but
        never sent by the app, and the app sends no invite-link permission with a
        suggestion, so neither does this route. WhatsApp may accept the suggestion
        and refuse its description (too long); the answer then says description_accepted
        false and description_error 406, and the suggestion stands without it.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Community JID, group name and optional settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CommunityNewGroupSuggestionRequest'
