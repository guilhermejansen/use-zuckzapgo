      description: 'The official "Block responses from …": the person behind the response
        can no longer respond to any question on THIS channel ("This person won''t
        be able to respond to any question on your channel"); the block is keyed by
        the channel and the response, never by a phone number, and they are not told.
        THE BLOCK IS SILENT, as in the app (seen live): a later response from that
        person still answers 200 to them and shows in their /newsletter/question/my-responses,
        but never reaches the owner''s /newsletter/question/responses. Block a response
        that is still visible: on one already hidden, WhatsApp answered 404 in a live
        test (502 whatsapp_refused, sent true). Like the official apps, the response
        is then hidden (hide, default true); hidden is true only when that hide was
        confirmed; when that second step fails, or is sent and not confirmed, the
        answer is still 200 with hidden false and a warning, because the block did
        go through — hide it with /newsletter/question/response/state. Only the owner
        and the admins can (409 not_admin, nothing sent). Sent ONCE: an unknown outcome
        of the block answers 504 block_outcome_unknown and must NOT be retried. NOT
        AVAILABLE IN THE API: unblocking (the official clients have no command for
        it), and reporting this response to WhatsApp — the official "Report to WhatsApp"
        option of this screen sends the response itself to WhatsApp''s spam-report
        system; the API reports a whole channel (/newsletter/report), not one message
        or response, and a live test would report a real account. Errors: 400, 409,
        500 (also with reason not_sent and sent false when the change could not be
        prepared), 501 (also with reason unsupported_client_platform and sent false
        when this session''s client platform cannot send the change), 502, 504. A
        session that is not connected, already when the request arrives or when it
        would go out, answers 503 whatsapp_not_connected with sent false: nothing
        was sent, so it can be repeated once the session reconnects. Every error carries
        sent.'
