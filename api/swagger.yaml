host: localhost:8080
info:
  contact:
    email: suporte@setupautomatizado.com.br
    name: Guilherme Jansen
    url: https://github.com/guilhermejansen/use-zuckzapgo
  description: Enterprise-grade WhatsApp Business API gateway with multi-user support,
    webhooks, RabbitMQ integration, and S3 storage
  license:
    name: Apache 2.0 License
    url: https://github.com/guilhermejansen/use-zuckzapgo/blob/main/LICENSE
  termsOfService: https://github.com/guilhermejansen/use-zuckzapgo/blob/main/LICENSE
  title: ZuckZapGo WhatsApp API Gateway
  version: 2.4.2 # x-release-please-version
paths:
  /admin/archive:
    delete:
      consumes:
      - application/json
      description: Permanently remove one or more events from the archive (DLQ or
        Success). This operation is irreversible. Supports single event deletion by
        ID or bulk deletion with filtering. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Bulk deletion filters
        in: body
        name: request
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Delete Event Archive entries
      tags:
      - Admin
    get:
      consumes:
      - application/json
      description: Retrieve all archived events including both DLQ (failed after max
        retries) and successfully delivered events. Supports filtering by status,
        transport, user, event type, and date range with pagination. Admin authentication
        required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 'Filter by status: ''dlq'', ''success'', or empty for all'
        in: query
        name: status
        type: string
      - description: Filter by transport name
        in: query
        name: transport
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by event type
        in: query
        name: event_type
        type: string
      - description: Filter from date (RFC3339 format)
        in: query
        name: from_date
        type: string
      - description: Filter to date (RFC3339 format)
        in: query
        name: to_date
        type: string
      - description: 'Maximum number of events to return (default: 50, max: 1000)'
        in: query
        name: limit
        type: integer
      - description: 'Number of events to skip for pagination (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses: {}
      summary: List Event Archive
      tags:
      - Admin
  /admin/archive/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently remove one or more events from the archive (DLQ or
        Success). This operation is irreversible. Supports single event deletion by
        ID or bulk deletion with filtering. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Archive event ID (for single deletion)
        in: path
        name: id
        type: integer
      - description: Bulk deletion filters
        in: body
        name: request
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Delete Event Archive entries
      tags:
      - Admin
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific archived event (DLQ
        or Success) by ID. Includes full event payload, status, timestamps, and replay
        history. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Archive event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      summary: Get specific Event Archive entry
      tags:
      - Admin
  /admin/archive/replay:
    post:
      consumes:
      - application/json
      description: Re-enqueue one or more archived events (DLQ or Success) back into
        the processing pipeline for retry. Supports single event replay by ID or bulk
        replay with filtering. Use dry_run to preview affected events without replaying.
        Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Replay request parameters
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Replay Event Archive entries
      tags:
      - Admin
  /admin/archive/stats:
    get:
      consumes:
      - application/json
      description: Retrieve comprehensive statistics about the Event Archive including
        total count, success/DLQ breakdown, oldest/newest events by status, and distributions
        by transport and event type. Useful for monitoring system health and archive
        trends. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get Event Archive statistics
      tags:
      - Admin
  /admin/dlq:
    delete:
      consumes:
      - application/json
      description: Permanently remove one or more events from the DLQ. This operation
        is irreversible. Supports single event deletion by ID or bulk deletion with
        filtering. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Bulk deletion filters
        in: body
        name: request
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Delete Dead Letter Queue events
      tags:
      - Admin
    get:
      consumes:
      - application/json
      description: Retrieve events that failed after maximum retry attempts with optional
        filtering by transport, user, event type, and date range. Supports pagination
        for large result sets. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Filter by transport name
        in: query
        name: transport
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by event type
        in: query
        name: event_type
        type: string
      - description: Filter from date (RFC3339 format)
        in: query
        name: from_date
        type: string
      - description: Filter to date (RFC3339 format)
        in: query
        name: to_date
        type: string
      - description: 'Maximum number of events to return (default: 50, max: 1000)'
        in: query
        name: limit
        type: integer
      - description: 'Number of events to skip for pagination (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses: {}
      summary: List Dead Letter Queue events
      tags:
      - Admin
  /admin/dlq/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently remove one or more events from the DLQ. This operation
        is irreversible. Supports single event deletion by ID or bulk deletion with
        filtering. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: DLQ event ID (for single deletion)
        in: path
        name: id
        type: integer
      - description: Bulk deletion filters
        in: body
        name: request
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Delete Dead Letter Queue events
      tags:
      - Admin
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific event that failed
        after maximum retry attempts. Includes full event payload, error details,
        and retry history. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: DLQ event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      summary: Get specific Dead Letter Queue event
      tags:
      - Admin
  /admin/dlq/prune:
    post:
      consumes:
      - application/json
      description: Run the pruning routine immediately to clean processed and DLQ
        events without waiting for the scheduled interval.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Force event buffer prune
      tags:
      - Admin
  /admin/dlq/replay:
    post:
      consumes:
      - application/json
      description: Re-enqueue one or more failed events from the DLQ back into the
        processing pipeline for retry. Supports single event replay by ID or bulk
        replay with filtering. Use dry_run to preview affected events without replaying.
        Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Replay request parameters
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Replay Dead Letter Queue events
      tags:
      - Admin
  /admin/dlq/stats:
    get:
      consumes:
      - application/json
      description: Retrieve comprehensive statistics about the Dead Letter Queue including
        total count, oldest/newest events, and breakdowns by transport and event type.
        Useful for monitoring failed event patterns. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get Dead Letter Queue statistics
      tags:
      - Admin
  /admin/events/history:
    get:
      parameters:
      - description: Admin Bearer token; alternatively use session query token
        in: header
        name: Authorization
        type: string
      - description: Monitoring session token
        in: query
        name: session
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get monitoring event history
      tags:
      - Admin
  /admin/events/prune:
    post:
      consumes:
      - application/json
      parameters:
      - description: Admin Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Optional retention_hours integer
        in: body
        name: data
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Prune monitoring events
      tags:
      - Admin
  /admin/events/session:
    post:
      consumes:
      - application/json
      parameters:
      - description: Admin Bearer token; alternatively use session query token
        in: header
        name: Authorization
        type: string
      - description: Monitoring session token
        in: query
        name: session
        type: string
      - description: Optional filters object for the monitoring session
        in: body
        name: data
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Create monitoring session token
      tags:
      - Admin
  /admin/events/stats:
    get:
      parameters:
      - description: Admin Bearer token; alternatively use session query token
        in: header
        name: Authorization
        type: string
      - description: Monitoring session token
        in: query
        name: session
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get monitoring statistics
      tags:
      - Admin
  /admin/events/stream:
    get:
      parameters:
      - description: Admin Bearer token; alternatively use session query token
        in: header
        name: Authorization
        type: string
      - description: Monitoring session token
        in: query
        name: session
        type: string
      produces:
      - text/event-stream
      responses: {}
      summary: Stream monitoring events
      tags:
      - Admin
  /admin/global/config:
    get:
      consumes:
      - application/json
      description: Retrieve current global configuration settings from environment
        variables including webhook, RabbitMQ, S3, and skip configurations. Also returns
        documentation about all available environment variables. Admin authentication
        required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get global configuration
      tags:
      - Admin
  /admin/global/config/reload:
    post:
      consumes:
      - application/json
      description: Reload global system configuration from environment variables including
        webhook settings, RabbitMQ configuration, S3 storage settings, and event filtering
        preferences. This allows runtime configuration updates without restarting
