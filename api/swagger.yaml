        description: 'Channel JID: digits followed by @newsletter, without device.
          Alias: jid.'
        example: 120363000000000022@newsletter
        type: string
      phone:
        description: |-
          The invitee whose invite to cancel: a phone number with country code (a leading + is
          accepted), an @s.whatsapp.net JID or an @lid JID. A phone number is resolved to the
          invitee's LID, which is what the invite is keyed by.
        example: "5511999999999"
        type: string
    type: object
  main.NewsletterAdminProfileItem:
    description: The separate profile a channel admin published. Present only when
      WhatsApp sent one with a name.
    properties:
      id:
        description: Admin profile ID, as WhatsApp reports it.
        example: "100000000000002"
        type: string
      name:
        description: Name shown on the admin profile.
        example: Product Team
        type: string
      picture_direct_path:
        description: |-
          Direct path of the admin profile picture on the WhatsApp media servers. Omitted when
          the profile has no picture.
        example: /v/t61.24694-24/example-admin-profile.jpg
        type: string
      picture_id:
        description: ID of the admin profile picture. Omitted when the profile has
          no picture.
        example: "100000000000005"
        type: string
    type: object
  main.NewsletterAdminProfileRequest:
    description: Contains the channel JID and the admin name and picture, or delete.
    properties:
      delete:
        description: true deletes the admin profile; name and picture must then be
          left out.
        example: false
        type: boolean
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      name:
        description: 'Admin name, required unless delete: trimmed, at least 3 characters
          (UTF-16 code units) and at most 25 (as the app counts them: one per letter
          with its marks, emoji with its modifiers, flag or joined sequence), none
          of ✔ ✅ ☑ ✓ and not starting with @.'
        example: Product Team
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
      picture:
        description: New picture as a base64 data URL or an HTTP(S) URL (JPEG, PNG,
          GIF or WebP); the empty string removes the current picture; leave it out
          to keep it.
        example: data:image/jpeg;base64,
        type: string
    type: object
  main.NewsletterAdminProfileResponse:
    properties:
      admin_profile:
        allOf:
        - $ref: '#/definitions/main.NewsletterAdminProfileItem'
        description: The profile WhatsApp reports; null after a deletion.
        x-nullable: true
      applied:
        description: 'What the request asked to change: name, picture, picture_removed
          or deleted.'
        items:
          type: string
        type: array
      deleted:
        type: boolean
      newsletter_jid:
        type: string
      success:
        type: boolean
    type: object
  main.NewsletterAdminProfileSettingRequest:
    description: Contains the channel JID and whether admin profiles are shown.
    properties:
      enabled:
        description: true shows the admins' profiles on the channel, false hides them.
          Required.
        example: true
        type: boolean
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
    type: object
  main.NewsletterAdminProfileSettingResponse:
    properties:
      admin_profiles_enabled:
        type: boolean
      newsletter_jid:
        type: string
      success:
        type: boolean
    type: object
  main.NewsletterAdminsResponse:
    description: The owner, admins and pending admin invites of a channel, as POST
      /newsletter/admins returns them in data.
    properties:
      admins:
        description: |-
          The owner first, then the admins, taken from the first 5000 followers WhatsApp
          returns. WhatsApp never lists the owner: when this session owns the channel, its own
          row is added first with source "session". An owner or admin always carries its identity.
        items:
          $ref: '#/definitions/main.NewsletterFollowerItem'
        type: array
      jid:
        description: The channel the admins were read for.
        example: 120363000000000022@newsletter
        type: string
      pending_invites:
        description: |-
          Admin invites that were sent and not yet accepted. Empty when pending_invites_read
          is false.
        items:
          $ref: '#/definitions/main.NewsletterPendingInviteItem'
        type: array
      pending_invites_note:
        description: |-
          Why the pending invites were not read, with WhatsApp's own error. Omitted when
          pending_invites_read is true.
        example: 'whatsapp did not return the pending admin invites: get newsletter
          pending admin invites: info query timed out. The official client asks for
          them only as the channel owner'
        type: string
      pending_invites_read:
        description: |-
          False when WhatsApp did not return the pending-invite list, which it refuses to a
          session that is not the channel owner. The admins are still returned.
        example: true
        type: boolean
      session_owner_added:
        description: |-
          True when this session owns the channel and was added as the owner row (source
          "session"): WhatsApp never lists the owner.
        example: true
        type: boolean
      success:
        description: Always true on success.
        example: true
        type: boolean
    type: object
  main.NewsletterDemoteAdminRequest:
    description: Contains the channel JID and the admin to demote.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: |-
          The channel JID: digits followed by @newsletter, without a device part. Required,
          here or in its alias jid.
        example: 120363000000000022@newsletter
        type: string
      phone:
        description: |-
          The admin to demote: a phone number, an @s.whatsapp.net JID or an @lid JID.
          Required. Pass your own number to step down yourself.
        example: "5511999999999"
        type: string
    type: object
  main.NewsletterDirectoryCategoriesRequest:
    description: Categories to preview, optional region and how many channels per
      category.
    properties:
      categories:
        description: 'Categories to preview, in order. Leave it out for the official
          default list: LIFESTYLE, SPORTS, PEOPLE, NEWS, BUSINESS, ORGANIZATIONS,
          ENTERTAINMENT.'
        example:
        - NEWS
        - SPORTS
        items:
          type: string
        type: array
      country_code:
        description: Optional region, as a two-letter ISO 3166-1 alpha-2 code. Case-insensitive.
        example: BR
        type: string
      per_category_limit:
        description: Channels per category (1-10, default 10, what the official client
          asks for).
        example: 10
        type: integer
    type: object
  main.NewsletterDirectoryCategoriesResponse:
    properties:
      categories:
        description: The categories in the order WhatsApp sent them.
        items:
          $ref: '#/definitions/main.NewsletterDirectoryCategoryPreviewItem'
        type: array
      country_code:
        description: The region filter that was sent, in upper case; left out when
          none.
        example: BR
        type: string
      per_category_limit:
        description: Channels asked per category, after the default was applied.
        example: 10
        type: integer
      success:
        description: Always true in a 200 answer.
        example: true
        type: boolean
    type: object
  main.NewsletterDirectoryCategoryPreviewItem:
    properties:
      category:
        description: The category value WhatsApp sent, usually one of the request
          values.
        example: NEWS
        type: string
      newsletters:
        description: The first channels of the category, as WhatsApp sent them; they
          carry no subscribed field.
        items:
          $ref: '#/definitions/main.NewsletterDirectoryItem'
        type: array
      returned:
        description: How many channels are in newsletters, at most per_category_limit.
        example: 1
        type: integer
      title:
        description: The localized title WhatsApp sent for it; left out when none
          came back.
        example: News
        type: string
    type: object
  main.NewsletterDirectoryItem:
    properties:
      created_at:
        description: Creation time of the channel, Unix seconds; left out when not
          reported.
        example: 1700000000
        type: integer
      description:
        description: Channel description; left out unless WhatsApp sent both its text
          and its update time.
        example: Synthetic channel used in the documentation
        type: string
      handle:
        description: Channel handle as WhatsApp sent it; left out when none came back.
        example: syntheticchannel
        type: string
      invite_code:
        description: 'Invite code: the public link is https://whatsapp.com/channel/
          followed by this code; /newsletter/follow-invite accepts it.'
        example: 0029VaExampleInviteCode01
        type: string
      jid:
        description: Channel JID.
        example: 120363000000000022@newsletter
        type: string
      name:
        description: Channel name; always present, empty when WhatsApp sent none.
        example: Synthetic channel
        type: string
      picture:
        allOf:
        - $ref: '#/definitions/main.NewsletterDirectoryPictureItem'
        description: Preview picture; left out when WhatsApp sent no complete picture
          (ID, direct path and type).
      state:
        description: active, suspended or geosuspended.
        example: active
        type: string
      subscribed:
        description: |-
          Whether this session follows the channel. Left out when the followed channels could not
          be read (the response then says subscribed_marked false), and on
          /newsletter/directory/categories, which does not mark followed channels.
        example: false
        type: boolean
      subscriber_count:
        description: Followers as WhatsApp reports them; left out when not reported.
        example: 1200
        type: integer
      verification:
        description: verified or unverified.
        example: verified
        type: string
    type: object
  main.NewsletterDirectoryPageInfoItem:
    properties:
      end_cursor:
        description: Cursor of the last channel of this page, as WhatsApp sent it;
          next_cursor repeats it while has_next_page is true.
        example: AQHRexampleCursor02
        type: string
      has_next_page:
        description: Whether WhatsApp has another page after this one.
        example: true
        type: boolean
      has_previous_page:
        description: Whether WhatsApp has a page before this one.
        example: false
        type: boolean
      start_cursor:
        description: Cursor of the first channel of this page, as WhatsApp sent it.
        example: AQHRexampleCursor01
        type: string
    type: object
  main.NewsletterDirectoryPictureItem:
    properties:
      direct_path:
        description: Media direct path of the picture on the WhatsApp CDN.
        example: /v/t61.24694-24/000000000_000000000000000_0000000000000000000_n.jpg
        type: string
      id:
        description: Picture ID as WhatsApp sent it.
        example: "1700000000"
        type: string
      type:
        description: image or preview. The directory always asks for the preview,
          so this is a thumbnail.
        example: preview
        type: string
    type: object
  main.NewsletterDirectoryRequest:
    description: View, optional region and category filters, page size and cursor.
    properties:
      category:
        description: 'Optional category: BUSINESS, ENTERTAINMENT, LIFESTYLE, NEWS,
          ORGANIZATIONS, PEOPLE, SPORTS, SPECIAL_EVENTS or SPECIAL_EVENTS_2 to SPECIAL_EVENTS_5.
          Case-insensitive.'
        example: NEWS
        type: string
      country_code:
        description: Optional region, as a two-letter ISO 3166-1 alpha-2 code. Case-insensitive.
        example: BR
        type: string
      cursor:
        description: next_cursor of the previous page, sent back as is; leave it out
          for the first page.
        example: AQHRexampleCursor02
        type: string
      limit:
        description: Page size (1-50, default 50, the official page size).
        example: 50
        type: integer
      view:
        description: 'Which list to read: RECOMMENDED (default), NEW, POPULAR, FEATURED
          or TRENDING. Case-insensitive.'
        example: RECOMMENDED
        type: string
    type: object
  main.NewsletterDirectoryResponse:
    properties:
      category:
        description: The category filter that was sent, in upper case; left out when
          none.
        example: NEWS
        type: string
      country_code:
        description: The region filter that was sent, in upper case; left out when
          none.
        example: BR
        type: string
      limit:
        description: The page size asked of WhatsApp, after the default was applied.
        example: 50
        type: integer
      newsletters:
        description: The channels of this page, as WhatsApp sent them; followed and
          suspended channels are not hidden.
        items:
          $ref: '#/definitions/main.NewsletterDirectoryItem'
        type: array
      next_cursor:
        description: 'Set only while has_next_page is true: send it back as cursor
          for the next page.'
        example: AQHRexampleCursor02
        type: string
      page_info:
        allOf:
        - $ref: '#/definitions/main.NewsletterDirectoryPageInfoItem'
        description: WhatsApp's cursor block; left out when WhatsApp sent none.
      returned:
        description: How many channels are in newsletters.
        example: 1
        type: integer
      subscribed_marked:
        description: true when every channel carries subscribed; false when the followed
          channels could not be read.
        example: true
        type: boolean
      success:
        description: Always true in a 200 answer.
        example: true
        type: boolean
      view:
        description: The list that was read, in upper case.
        example: RECOMMENDED
        type: string
    type: object
  main.NewsletterDirectorySearchRequest:
    description: Search text, optional category filter, page size and cursor.
    properties:
      category:
        description: Optional category, with the same values as /newsletter/directory.
          Case-insensitive.
        example: NEWS
        type: string
      cursor:
        description: next_cursor of the previous page, sent back as is; leave it out
          for the first page.
        example: AQHRexampleCursor02
        type: string
      limit:
        description: Page size (1-50, default 50, the official page size).
        example: 50
        type: integer
      search_text:
        description: What to search for. Trimmed; must not be empty.
        example: news
        type: string
    required:
    - search_text
    type: object
  main.NewsletterDirectorySearchResponse:
    properties:
      category:
        description: The category filter that was sent, in upper case; left out when
          none.
        example: NEWS
        type: string
      limit:
        description: The page size asked of WhatsApp, after the default was applied.
        example: 50
        type: integer
      newsletters:
        description: The channels of this page, as WhatsApp sent them; followed and
          suspended channels are not hidden.
        items:
          $ref: '#/definitions/main.NewsletterDirectoryItem'
        type: array
      next_cursor:
        description: 'Set only while has_next_page is true: send it back as cursor
          for the next page.'
        example: AQHRexampleCursor02
        type: string
      page_info:
        allOf:
        - $ref: '#/definitions/main.NewsletterDirectoryPageInfoItem'
        description: WhatsApp's cursor block; left out when WhatsApp sent none.
      returned:
        description: How many channels are in newsletters.
        example: 1
        type: integer
      search_text:
        description: The search text that was sent, trimmed.
        example: news
        type: string
      subscribed_marked:
        description: true when every channel carries subscribed; false when the followed
          channels could not be read.
        example: true
        type: boolean
      success:
        description: Always true in a 200 answer.
        example: true
        type: boolean
    type: object
  main.NewsletterEnforcementsRequest:
    description: Contains the channel JID and the language of the explanatory texts.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      locale:
        description: Language of the explanatory texts, as a lowercase language code
          with an optional region, such as en, pt-BR or pt_BR (default en).
        example: pt-BR
        type: string
      newsletter_jid:
        description: The channel JID, `digits@newsletter` without device; alias jid.
          Required.
        example: 120363000000000022@newsletter
        type: string
    type: object
  main.NewsletterFollowerInviteRequest:
    description: Contains the recipient, the channel and the invite card's picture,
      caption and name.
    properties:
      caption:
        description: The message text shown with the card. Required.
        example: Follow Product Updates for release notes
        type: string
      image:
        description: |-
          The card's picture, as a base64 data URL or an HTTP(S) URL (JPEG, PNG, GIF or WebP).
          It travels as a JPEG thumbnail of at most 96x96. Required.
        example: https://example.com/images/channel-cover.png
        type: string
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      name:
        description: |-
          The channel name shown on the card, sent as given: the gateway does not read it from
          the channel. Required.
        example: Product Updates
        type: string
      newsletter_jid:
        description: 'Channel JID: digits followed by @newsletter, without device.
          Alias: jid.'
        example: 120363000000000022@newsletter
        type: string
      phone:
        description: |-
          Recipient of the invite: a phone number with country code (a leading + is accepted) or
          a JID. Required.
        example: "5511999999999"
        type: string
    type: object
  main.NewsletterFollowerItem:
    description: One follower of a channel. A follower the official apps would hide
      carries only role, followed_at, in_contacts and identity_shown.
    properties:
      admin_profile:
        allOf:
        - $ref: '#/definitions/main.NewsletterAdminProfileItem'
        description: |-
          The separate profile the admin published. Present only when identity_shown is true
          and WhatsApp sent one.
      display_name:
        description: |-
          The name WhatsApp sent for the follower, or else the name in this session's address
          book. Present only when identity_shown is true and a name is known.
        example: Jordan Lee
        type: string
      followed_at:
        description: |-
          When the follower started following, in Unix seconds. Omitted when WhatsApp did not
          report it.
        example: 1757901234
        type: integer
      identity_shown:
        description: |-
          True when the official apps would show this follower: the owner, an admin, or
          someone in this session's address book. When false, lid, display_name,
          phone_number, username and admin_profile are absent.
        example: true
        type: boolean
      in_contacts:
        description: |-
          True when this session has the follower in its address book: a saved first or full
          name, not just a push name.
        example: true
        type: boolean
      lid:
        description: The follower's LID. Present only when identity_shown is true.
        example: 100000000000002@lid
        type: string
      phone_number:
        description: |-
          The phone number JID WhatsApp sent for the follower. Present only when
          identity_shown is true and WhatsApp sent one.
        example: 5511999999999@s.whatsapp.net
        type: string
      role:
        description: |-
          Role on the channel as WhatsApp reports it: owner, admin, subscriber or guest.
          Omitted when WhatsApp sent none.
        example: admin
        type: string
      source:
        description: |-
          Where the row comes from when it is not WhatsApp's list: "session" for this session
          added as the owner, which WhatsApp never lists. Omitted on WhatsApp's own rows.
        example: session
        type: string
      username:
        description: |-
          The follower's WhatsApp username, sent only while usernames are enabled for this
          session. Present only when identity_shown is true.
        example: jordanlee
        type: string
    type: object
  main.NewsletterFollowersRequest:
    description: Contains the channel JID and how many followers to ask for.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      limit:
        description: |-
          How many followers to ask WhatsApp for, from 1 to 5000. Zero or absent asks for 100.
          There is no cursor: the answer holds the first followers WhatsApp returns.
        example: 100
        type: integer
      newsletter_jid:
        description: |-
          The channel JID: digits followed by @newsletter, without a device part. Required,
          here or in its alias jid.
        example: 120363000000000022@newsletter
        type: string
      summary_only:
        description: |-
          Return only the counts, without the followers array, so the answer carries no
          personal data at all.
        example: false
        type: boolean
    type: object
  main.NewsletterFollowersResponse:
    description: The followers of a channel, as POST /newsletter/followers returns
      them in data.
    properties:
      followers:
        description: |-
          The followers, in the order WhatsApp returned them, after the session owner row when
          session_owner_added is true. Omitted when summary_only is true or when the list is empty.
        items:
          $ref: '#/definitions/main.NewsletterFollowerItem'
        type: array
      jid:
        description: The channel the followers were read for.
        example: 120363000000000022@newsletter
        type: string
      limit:
        description: 'How many followers were asked for: the request limit, or 100
          when it was absent.'
        example: 100
        type: integer
      maybe_more:
        description: |-
          True when WhatsApp sent as many entries as the limit, unreadable ones the gateway drops
          included, so the channel may have more followers. It is not a cursor: nothing past the
          first 5000 followers can be read.
        example: false
        type: boolean
      returned:
        description: |-
          How many followers this answer lists: the entries WhatsApp returned minus the unreadable
          ones the gateway drops (no LID, or a LID that does not parse), plus the session owner row
          when session_owner_added is true. maybe_more counts the unreadable ones too.
        example: 4
        type: integer
      session_owner_added:
        description: |-
          True when this session owns the channel and was added first as the owner row (source
          "session"): WhatsApp never lists the owner. That row counts in returned, not in summary,
          which describes WhatsApp's answer only.
        example: true
        type: boolean
      success:
        description: Always true on success.
        example: true
        type: boolean
      summary:
        allOf:
        - $ref: '#/definitions/main.NewsletterFollowersSummary'
        description: Counts over every follower WhatsApp returned; the session owner
          row is not counted.
    type: object
  main.NewsletterFollowersSummary:
    description: Counts over every follower WhatsApp returned, whatever the identity
      rule hides.
    properties:
      by_role:
        additionalProperties:
          type: integer
        description: |-
          Followers per role, keyed by the role WhatsApp reported; a follower without a role
          counts as unknown.
        example:
          admin: 1
          owner: 1
          subscriber: 2
        type: object
      in_contacts:
        description: Followers in this session's address book.
        example: 2
        type: integer
      phone_returned:
        description: Followers whose phone number this answer does return.
        example: 2
        type: integer
      total:
        description: |-
          Number of followers counted here: the entries WhatsApp returned minus the unreadable ones
          the gateway drops.
        example: 4
        type: integer
      with_display_name:
        description: Followers WhatsApp sent a display name for, whether or not this
          answer returns it.
        example: 3
        type: integer
      with_server_phone:
        description: Followers WhatsApp sent a phone number for, whether or not this
          answer returns it.
        example: 3
        type: integer
    type: object
  main.NewsletterInsightMetricItem:
    properties:
      hidden_country_rows:
        description: Country rows left out because they had no country or a value
          under 10, as the app leaves them out.
        type: integer
      metric:
        example: FOLLOWERS_OVER_PERIOD
        type: string
      values:
        items:
          $ref: '#/definitions/main.NewsletterInsightValueItem'
        type: array
    type: object
  main.NewsletterInsightValueItem:
    properties:
      country:
        description: Upper-case country code, for the metrics grouped by country.
        example: BR
        type: string
      role:
        description: SUBSCRIBER or GUEST, for the metrics grouped by role.
        example: SUBSCRIBER
        type: string
      timestamp:
        description: Unix seconds of the day, for the per-day metrics.
        type: integer
      value:
        example: 1200
        type: number
    type: object
  main.NewsletterInsightsRequest:
    description: Contains the channel JID and, optionally, which metrics to read.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      metrics:
        description: Metrics to read, by name; leave it out for what the app's insights
          screen reads. Case-insensitive.
        example:
        - FOLLOWERS_OVER_PERIOD
        - NET_FOLLOWS_OVER_PERIOD
        items:
          type: string
        type: array
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
    type: object
  main.NewsletterInsightsResponse:
    properties:
      data_status:
        description: available when WhatsApp says the numbers are ready (OK), missing
          otherwise or when it did not say.
        example: available
        type: string
      last_update_time:
        description: Unix seconds; left out when WhatsApp did not say.
        type: integer
      metrics:
        items:
          $ref: '#/definitions/main.NewsletterInsightMetricItem'
        type: array
      newsletter_jid:
        type: string
      requested:
        items:
          type: string
        type: array
      success:
        type: boolean
    type: object
  main.NewsletterInviteInfo:
    properties:
      description:
        type: string
      invite_code:
        type: string
      jid:
        type: string
      name:
        type: string
      subscribers:
        type: integer
    type: object
  main.NewsletterLabelRequest:
    description: Contains the channel JID, the post's server ID and the kind of post.
    properties:
      content_type:
        description: MESSAGE for an ordinary post (the default), STATUS for a channel
          status post. Case-insensitive.
        example: MESSAGE
        type: string
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The channel JID, `digits@newsletter` without device; alias jid.
          Required.
        example: 120363000000000022@newsletter
        type: string
      server_id:
        description: 'The post''s server ID, as /newsletter/messages returns it in
          server_id. Required: a positive JSON integer.'
        example: 120
        type: integer
    type: object
  main.NewsletterMyQuestionResponseItem:
    properties:
      liked:
        description: An admin liked it.
        example: true
        type: boolean
      message_id:
        description: Stanza ID of your response.
        example: 3EB0C3D4E5F607182930
        type: string
      reaction_code:
        description: The reaction code on it, "like" when liked.
        example: like
        type: string
      response_server_id:
        description: WhatsApp's opaque ID of the response.
        example: "4581"
        type: string
      text:
        description: Your response text.
        example: More posts about the weekend schedule, please.
        type: string
      timestamp:
        description: When it was sent, Unix seconds.
        example: 1795300000
        type: integer
    type: object
  main.NewsletterMyReactionsRequest:
    description: Contains the channel JID, optional, and how many entries to ask for.
    properties:
      jid:
        description: Alias of newsletter_jid; when both are sent they must be identical.
        example: 120363000000000022@newsletter
        type: string
      limit:
        description: How many entries to ask WhatsApp for, from 1 to 5000. Zero or
          absent means 100.
        example: 100
        type: integer
      newsletter_jid:
        description: |-
          Channel JID: digits followed by @newsletter, with no device part. Optional: leave it
          and jid out to ask for every channel at once.
        example: 120363000000000022@newsletter
        type: string
    type: object
  main.NewsletterPendingInviteItem:
    description: One admin invite that was sent and not yet accepted.
    properties:
      display_name:
        description: |-
          The invitee's name in this session's address book. Present only when in_contacts is
          true.
        example: Sam Taylor
        type: string
      in_contacts:
        description: True when the invitee is in this session's address book.
        example: true
        type: boolean
      lid:
        description: The LID the invite was sent to.
        example: 100000000000003@lid
        type: string
      phone_number:
        description: |-
          The invitee's phone number JID, from this session's LID mapping. Present only when
          in_contacts is true and the mapping is known.
        example: 5511988888888@s.whatsapp.net
        type: string
    type: object
  main.NewsletterPinRequest:
    description: Contains the channel JID and the server IDs of the posts to pin or
      unpin.
    properties:
      jid:
        description: Alias of newsletter_jid; when both are sent they must be identical.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: |-
          Channel JID: digits followed by @newsletter, with no device part. Required, here or
          under its alias jid.
        example: 120363000000000022@newsletter
        type: string
      server_id:
        description: One more server ID, added to server_ids. Zero or absent means
          none.
        example: 122
        type: integer
      server_ids:
        description: |-
          Server IDs of the posts, as /newsletter/messages returns them in server_id. Each must
          be a positive integer; repeated IDs are sent once. At least one ID is required, here
          or in server_id.
        example:
        - 120
        - 121
        items:
          type: integer
        type: array
    type: object
  main.NewsletterPinResponse:
    description: The channel's whole pinned set as WhatsApp reports it.
    properties:
      jid:
        description: Channel JID the pinned set belongs to.
        example: 120363000000000022@newsletter
        type: string
      message:
        description: |-
          Fixed confirmation text of /newsletter/pin and /newsletter/unpin; absent from
          /newsletter/pinned.
        example: Newsletter pinned posts updated
        type: string
      pinned:
        description: |-
          Every post pinned on the channel, not only the ones named in the request; an empty
          array when nothing is pinned.
        items:
          $ref: '#/definitions/main.NewsletterPinnedMessageItem'
        type: array
      success:
        description: Always true in a 200 answer.
        example: true
        type: boolean
    type: object
  main.NewsletterPinnedMessageItem:
    description: One pinned post of the channel, as WhatsApp reports it.
    properties:
      active:
        description: |-
          True while expires_at is still in the future when the gateway answers; an expired pin
          can still be listed with false.
        example: true
        type: boolean
      expires_at:
        description: When the pin stops being shown, in Unix seconds. WhatsApp sets
          it; a pin is not permanent.
        example: 1795856400
        type: integer
      server_id:
        description: Server ID of the pinned post, the same number /newsletter/messages
          returns in server_id.
        example: 120
        type: integer
    type: object
  main.NewsletterPollVoteRequest:
    description: Contains the channel JID, the poll post's server ID and the chosen
      options by name; an empty options list removes the vote.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The channel JID, `digits@newsletter` without device; alias jid.
          Required.
        example: 120363000000000022@newsletter
        type: string
      options:
        description: |-
          The chosen options, each written exactly as the poll lists it (poll.options[].name in
          /newsletter/messages). Required: send [] to remove your vote. A single-choice poll
          takes one option; the new vote replaces any earlier one.
        example:
        - Primeira
        items:
          type: string
        type: array
      server_id:
        description: The poll post's server ID, as /newsletter/messages returns it
          in server_id. Required.
        example: 120
        type: integer
    type: object
  main.NewsletterPollVoteResponse:
    properties:
      message:
        description: '"Vote sent", or "Vote removed".'
        example: Vote sent
        type: string
      message_id:
        description: The stanza ID of this vote; every vote, change or removal gets
          a new one.
        example: 3EB0C2A1D4F5B6E7A8C9
        type: string
      newsletter_jid:
        example: 120363000000000022@newsletter
        type: string
      options:
        description: The options voted for, as sent; empty when the vote was removed.
        example:
        - Primeira
        items:
          type: string
        type: array
      removed:
        description: True when the request removed the vote.
        example: false
        type: boolean
      server_id:
        example: 120
        type: integer
      success:
        example: true
        type: boolean
      timestamp:
        description: When WhatsApp acknowledged the vote, in Unix seconds.
        example: 1763700000
        type: integer
      vote_hashes_hex:
        description: |-
          The hashes WhatsApp received for those options (SHA-256 of each name, in hex), the
          spelling /newsletter/my-reactions and /newsletter/poll-voters use.
        example:
        - bd45f36e742bb8a37da115d3dfa610b3bff2d39d2114ce3b197c12845fdc2297
        items:
          type: string
        type: array
    type: object
  main.NewsletterPostRequest:
    description: Contains the channel JID and the post's server ID; /newsletter/poll-voters
      also reads vote_hash_hex and limit.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      limit:
        description: |-
          For /newsletter/poll-voters only: how many voters to ask for in the whole answer
          (1-5000; 0 or absent means the default). Default: 5000 when vote_hash_hex names one
          option, as the official client asks; 100 when every option is asked for.
        example: 5000
        type: integer
      newsletter_jid:
        description: The channel JID, `digits@newsletter` without device; alias jid.
          Required.
        example: 120363000000000022@newsletter
        type: string
      server_id:
        description: 'The post''s server ID, as /newsletter/messages returns it in
          server_id. Required: a positive JSON integer.'
        example: 120
        type: integer
      vote_hash_hex:
        description: |-
          For /newsletter/poll-voters only: one option's hash in hex, as /newsletter/my-reactions
          returns it (32 bytes, so 64 hex digits). Leave it out to ask for every option.
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        type: string
    type: object
  main.NewsletterQuestionActionResponse:
    properties:
      blocked:
        description: 'On a block: always true.'
        example: true
        type: boolean
      deleted:
        description: 'On a deletion: always true.'
        example: true
        type: boolean
      hidden:
        description: |-
          On a block: true only when hiding the response afterwards was confirmed; false when
          that step failed or was sent and not confirmed (see warning).
        example: true
        type: boolean
      liked:
        description: 'On a like: the like now set.'
        example: true
        type: boolean
      message:
        description: Confirmation text.
        example: Responder blocked
        type: string
      message_id:
        description: 'On a deletion: the stanza ID of the deleted response.'
        example: 3EB0C3D4E5F607182930
        type: string
      newsletter_jid:
        description: The channel.
        example: 120363000000000022@newsletter
        type: string
      response_server_id:
        description: The response acted on.
        example: "4581"
        type: string
      server_id:
        description: The question post.
        example: 120
        type: integer
      state:
        description: 'On a state change: star, unstar, hide or unhide.'
        example: star
        type: string
      success:
        description: Always true on 200.
        example: true
        type: boolean
      warning:
        description: Set when a second step did not go through (the hide after a block).
        example: the responder was blocked, but hiding the response did not go through
        type: string
    type: object
  main.NewsletterQuestionBlockRequest:
    description: Contains the response and whether to also hide it, which the official
      apps do.
    properties:
      hide:
        default: true
        description: Also hide the response after the block, as the official apps
          do. Defaults to true.
        example: true
        type: boolean
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
      response_server_id:
        description: The response_server_id of the response, exactly as it was returned.
        example: "4581"
        type: string
      server_id:
        description: The server_id of the question post.
        example: 120
        type: integer
    required:
    - response_server_id
    - server_id
    type: object
  main.NewsletterQuestionLikeRequest:
    description: Contains the response and whether to like it.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      liked:
        description: true likes the response, false takes the like back. Required.
        example: true
        type: boolean
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
      response_server_id:
        description: The response_server_id of the response, exactly as it was returned.
        example: "4581"
        type: string
      server_id:
        description: The server_id of the question post.
        example: 120
        type: integer
    required:
    - liked
    - response_server_id
    - server_id
    type: object
  main.NewsletterQuestionMyResponsesRequest:
    description: Contains the channel and the question.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
      server_id:
        description: The server_id of the question post.
        example: 120
        type: integer
    required:
    - server_id
    type: object
  main.NewsletterQuestionMyResponsesResponse:
    properties:
      newsletter_jid:
        description: The channel.
        example: 120363000000000022@newsletter
        type: string
      responses:
        description: Your responses.
        items:
          $ref: '#/definitions/main.NewsletterMyQuestionResponseItem'
        type: array
      returned:
        description: How many of your responses came back (at most 100).
        example: 1
        type: integer
      server_id:
        description: The question post.
        example: 120
        type: integer
      success:
        description: Always true on 200.
        example: true
        type: boolean
    type: object
  main.NewsletterQuestionPostResponse:
    properties:
      lookup_reads:
        description: 'On a reply: how many response-list pages were read to find the
          quoted response (1 to 5).'
        example: 1
        type: integer
      message:
        description: Confirmation text.
        example: Reply posted
        type: string
      message_id:
        description: Stanza ID of the post.
        example: 3EB0B2C3D4E5F6071829
        type: string
      newsletter_jid:
        description: The channel.
        example: 120363000000000022@newsletter
        type: string
      question_server_id:
        description: 'On a reply: the question it quotes.'
        example: 120
        type: integer
      response_server_id:
        description: 'On a reply: the response it answers.'
        example: "4581"
        type: string
      server_id:
        description: The post's server ID; absent when WhatsApp's acknowledgement
          did not carry one.
        example: 121
        type: integer
      success:
        description: Always true on 200.
        example: true
        type: boolean
      timestamp:
        description: When WhatsApp acknowledged it, Unix seconds.
        example: 1795300100
        type: integer
    type: object
  main.NewsletterQuestionReplyRequest:
    description: 'Contains the channel, the question, the response to reply to and
      the reply: text, or an image or a video with an optional caption.'
    properties:
      caption:
        description: The caption of the image or the video; only with image or video.
        example: Which of these covers do you prefer?
        type: string
      image:
        description: An image, as a base64 data URL or an HTTP(S) URL.
        example: https://example.com/question-cover.jpg
        type: string
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
      response_server_id:
        description: The response_server_id of the response, exactly as /newsletter/question/responses
          returned it.
        example: "4581"
        type: string
      server_id:
        description: The server_id of the question post, as /newsletter/messages returns
          it.
        example: 120
        type: integer
      text:
        description: The reply text. Send exactly one of text, image or video.
        example: Great idea, the next post covers it.
        type: string
      video:
        description: A video, as a base64 data URL or an HTTP(S) URL.
        example: https://example.com/question-clip.mp4
        type: string
    required:
    - response_server_id
    - server_id
    type: object
  main.NewsletterQuestionRespondRequest:
    description: Contains the channel, the question and the response text.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
      server_id:
        description: The server_id of the question post.
        example: 120
        type: integer
      text:
        description: 'The response: trimmed, then 1 to 256 characters counted as the
          official field counts them.'
        example: More posts about the weekend schedule, please.
        type: string
    required:
    - server_id
    - text
    type: object
  main.NewsletterQuestionRespondResponse:
    properties:
      message:
        description: Confirmation text.
        example: Response sent
        type: string
      message_id:
        description: Stanza ID of your response.
        example: 3EB0C3D4E5F607182930
        type: string
      newsletter_jid:
        description: The channel.
        example: 120363000000000022@newsletter
        type: string
      response_server_id:
        description: WhatsApp's ID of the response; absent when its acknowledgement
          did not carry one (read /newsletter/question/my-responses).
        example: "4581"
        type: string
      server_id:
        description: The question post.
        example: 120
        type: integer
      success:
        description: Always true on 200.
        example: true
        type: boolean
      timestamp:
        description: When WhatsApp acknowledged it, Unix seconds.
        example: 1795300000
        type: integer
    type: object
  main.NewsletterQuestionResponseItem:
    properties:
      display_name:
        description: The address-book name of a contact, or the push name WhatsApp
          sent for anyone else.
        example: Ana
        type: string
      in_contacts:
        description: The sender is an address-book contact of this session.
        example: false
        type: boolean
      liked:
        description: An admin liked it.
        example: true
        type: boolean
      message_id:
        description: Stanza ID of the response message.
        example: 3EB0A1B2C3D4E5F60718
        type: string
      name_source:
        description: 'Where display_name came from: contact or push_name.'
        example: push_name
        type: string
      picture_direct_path:
        description: Direct path of the sender's picture, as WhatsApp sent it.
        example: /v/t61.24694-24/000000000_0000000000000000_0000000000000000000_n.jpg
        type: string
      reaction_code:
        description: The reaction code on it, "like" when liked.
        example: like
        type: string
      replied:
        description: An admin replied to it publicly.
        example: false
        type: boolean
      response_server_id:
        description: WhatsApp's opaque ID of the response; pass it back exactly as
          it is.
        example: "4581"
        type: string
      starred:
        description: An admin starred it.
        example: true
        type: boolean
      text:
        description: The response text.
        example: More posts about the weekend schedule, please.
        type: string
      timestamp:
        description: When the response was sent, Unix seconds.
        example: 1795300000
        type: integer
    type: object
  main.NewsletterQuestionResponseTargetRequest:
    description: Contains the channel, the question and the response.
    properties:
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
      response_server_id:
        description: The response_server_id of the response, exactly as it was returned.
        example: "4581"
        type: string
      server_id:
        description: The server_id of the question post.
        example: 120
        type: integer
    required:
    - response_server_id
    - server_id
    type: object
  main.NewsletterQuestionResponsesRequest:
    description: Contains the channel, the question, the page size, the cursor, a
      filter and a search.
    properties:
      count:
        default: 30
        description: Page size, 1-1000; 30 when left out, like the official client.
        example: 30
        type: integer
      cursor:
        description: The next_cursor of the previous page.
        example: "4579"
        type: string
      filter:
        description: all (default), contacts, replied or starred.
        example: all
        type: string
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      newsletter_jid:
        description: The JID of the newsletter; alias jid.
        example: 120363000000000022@newsletter
        type: string
      search:
        description: Text to search the responses for; at least 3 characters.
        example: weekend
        type: string
      server_id:
        description: The server_id of the question post.
        example: 120
        type: integer
    required:
    - server_id
    type: object
  main.NewsletterQuestionResponsesResponse:
    properties:
      count:
        description: The page size asked for.
        example: 30
        type: integer
      filter:
        description: 'The filter applied: all, contacts, replied or starred.'
        example: all
        type: string
      has_more:
        description: The page came full, so there may be more.
        example: false
        type: boolean
      newsletter_jid:
        description: The channel.
        example: 120363000000000022@newsletter
        type: string
      next_cursor:
        description: |-
          Send it back as cursor for the next page, only when has_more is true: it may also be
          present on the last page, where it is just the last response's ID.
        example: "4579"
        type: string
      responses:
        description: The responses, newest first.
        items:
          $ref: '#/definitions/main.NewsletterQuestionResponseItem'
        type: array
      returned:
        description: Responses in this page.
        example: 2
        type: integer
      server_id:
        description: The question post.
        example: 120
        type: integer
      success:
        description: Always true on 200.
        example: true
        type: boolean
      summary:
        allOf:
        - $ref: '#/definitions/main.NewsletterQuestionResponsesSummary'
        description: Counts of this page.
    type: object
  main.NewsletterQuestionResponsesSummary:
    properties:
      in_contacts:
        description: Responses whose sender is an address-book contact.
        example: 1
        type: integer
      liked:
        description: Responses an admin liked.
        example: 1
        type: integer
      named_by_contact:
        description: Responses named by the address-book name.
        example: 1
        type: integer
      named_by_push_name:
        description: Responses named by WhatsApp's push name.
        example: 1
        type: integer
      replied:
        description: Responses an admin replied to.
        example: 0
        type: integer
      returned:
        description: Responses in this page.
        example: 2
        type: integer
      starred:
        description: Responses an admin starred.
        example: 1
        type: integer
      unnamed:
        description: Responses without a name.
        example: 0
        type: integer
    type: object
  main.NewsletterQuestionSendRequest:
    description: 'Contains the channel and the question: text, or an image or a video
