    get:
      consumes:
      - application/json
      description: Retrieve a list of all ZuckZapGo users with their complete configuration
        including connection status, webhook settings, proxy configuration, S3 storage,
        RabbitMQ messaging, and event filtering preferences. If a user ID is provided
        in the URL path, returns only that specific user's information. Admin authentication
        required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: List all users or get specific user
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: When networkRoute is present, AddUser returns 2xx only with data.id,
        data.token and a ready data.network_route whose desired/applied versions match.
        If the user is persisted but route preparation fails, 503 returns data.userId
        without token so Chatwoot can DELETE /admin/users/{id}.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
