        type: array
      upcoming:
        items:
          $ref: '#/definitions/whatsmeow.SharableEvent'
        type: array
    type: object
  whatsmeow.SharableEventLocation:
    properties:
      address:
        description: Street address, when given.
        example: 100 Example Avenue
        type: string
      latitude:
        description: Latitude, when the place has coordinates.
        type: number
      longitude:
        description: Longitude, when the place has coordinates.
        type: number
      name:
        description: Name of the place.
        example: Main office
        type: string
    type: object
