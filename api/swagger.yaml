      description: 'The channels WhatsApp recommends to this account, the channel
        suggestions of the apps. country_code (ISO 3166-1 alpha-2) is optional: the
        apps send the account''s own country, this route does not guess it, so leave
        it out for no region or send it to match the app. limit is 1-20 and defaults
        to 20, what the official client asks for. The official query takes no cursor,
        so this is a single list without paging. Like the app, the route hides the
        channels this account already follows (read from the account''s followed channels)
        and the suspended or geosuspended ones, and says how many it hid in hidden_subscribed
        and hidden_inactive; returned counts what is left, so it can be smaller than
        limit. If the followed channels cannot be read, the route still answers 200,
        hides only the suspended ones and says subscribed_filter_applied false. include_subscribed
        true returns WhatsApp''s list as it came, with neither filter. Channels carry
        the same fields as /newsletter/directory, subscribed included, with the same
        subscribed_marked rule. Errors: 400 invalid input, 501 when the bundled library
        cannot read the recommendations, 502 when WhatsApp refuses. On a client platform
        that cannot send MEX requests the read answers 501 unsupported_client_platform
        with sent false; retrying will not help.'
