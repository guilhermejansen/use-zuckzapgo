  /newsletter/admin-profile/setting:
    post:
      consumes:
      - application/json
      description: 'Turn on or off whether the channel shows its admins'' profiles
        (the separate name and picture of /newsletter/admin-profile), as the official
        channel settings do. enabled is required. SHOWING ADMIN PROFILES IS A FEATURE
        WHATSAPP ENABLES PER ACCOUNT OR CHANNEL: the official settings offer it only
        behind channels_admin_profiles_settings_enabled, off by default. Where it
        is not enabled WhatsApp answers the official mutation with 400 (seen live),
        and this route answers 409 not_enabled_for_account with sent true: the change
        went out and was refused, so nothing changed; retrying will not help. The
        change is sent once and never resent: when the connection drops before WhatsApp
        answers, or the answer does not read, the route answers 504 because the change
        may already be applied. Errors: 400 invalid input, 404 when WhatsApp answers
        that the channel is deleted or does not exist, 409 not_enabled_for_account,
        423 when it answers that the channel is suspended, 501 when the bundled library
        cannot change it, 502 when WhatsApp refuses otherwise, 504 when the outcome
        is unknown. A change that never left the gateway answers 503 whatsapp_not_connected
        when the connection was lost before it left (a session already disconnected
        when the request arrives gets the usual 500 client not connected), 501 unsupported_client_platform
        or 500 not_sent, all with sent false: retrying is safe.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Channel and setting
        in: body
        name: request
        required: true
        schema:
