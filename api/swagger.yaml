basePath: /
definitions:
  main.AddUserNetworkRouteFailureResponse:
    properties:
      code:
        example: 503
        type: integer
      data:
        properties:
          network_route:
            $ref: '#/definitions/main.NetworkRouteView'
          userId:
            example: 5663e0c52063ec35d0ba45f7c2011c06
            type: string
        type: object
      details:
        example: user persisted in blocked state; submit a higher routeVersion with
          a new one-use auth key or delete this user
        type: string
      error:
        example: network_route_prepare_failed
        type: string
      success:
        example: false
        type: boolean
    type: object
  main.BusinessBillingSendRequest:
    properties:
      billing:
        $ref: '#/definitions/whatsmeow.BusinessBillingParams'
      billing_message_id:
        description: 'Status and payment only: ID of the own billing message to quote.'
        type: string
      body:
        description: Optional message text, at most 4096 bytes.
        type: string
      id:
        description: Optional custom WhatsApp message ID, at most 128 bytes.
        type: string
      image:
        description: 'Charge only: optional JPEG/PNG base64 or data URI turned into
          a JPEG header thumbnail; forbidden elsewhere.'
        type: string
      incoming_message_id:
        description: 'Accept only: ID of the received order message stored by this
          instance; forbidden in other modes.'
        type: string
      order_status:
        description: 'Payment mode only: optional order lifecycle status to declare
          with the payment.'
        type: string
      payment_method:
        description: 'Payment mode only: declared payment method, at most 64 bytes.'
        type: string
      payment_timestamp:
        description: 'Payment mode only: positive payment timestamp; payment_method
          or payment_timestamp is required.'
        type: integer
      reference_id:
        description: 'Status and payment only: reference_id of the quoted billing.'
        type: string
      status:
        description: Order status (status mode) or payment status pending|captured|failed
          (payment mode).
        type: string
      to:
        description: Required buyer JID, individual @s.whatsapp.net or @lid without
          device.
        type: string
    type: object
  main.BusinessManagementAppealRequest:
    properties:
      reason:
        description: Appeal reason, required, non-blank, at most 1024 bytes.
        type: string
    type: object
  main.BusinessManagementCollectionRequest:
    properties:
      name:
        description: Collection name, required, 1-256 bytes (trimmed).
        type: string
      product_ids:
        description: Own product IDs in the collection, 1-100 unique, each 1-256 bytes.
        items:
          type: string
        type: array
    type: object
  main.BusinessManagementCollectionsRequest:
    properties:
      collection_ids:
        description: Collection IDs to delete, 1-100 unique, each 1-256 bytes.
        items:
          type: string
        type: array
    type: object
  main.BusinessManagementEligibilityRequest:
    properties:
      features:
        description: Features to check, 1-6 unique values.
        items:
          $ref: '#/definitions/types.BusinessFeature'
        type: array
    type: object
  main.BusinessManagementEnabledRequest:
    properties:
      enabled:
        description: Required. true enables the shopping cart; false disables it.
        type: boolean
    type: object
  main.BusinessManagementHiddenRequest:
    properties:
      hidden:
        description: Required. true hides the product from public catalog reads; false
          shows it.
        type: boolean
    type: object
  main.BusinessManagementIDsRequest:
    properties:
      product_ids:
        description: Product IDs, 1-100 unique, each 1-256 bytes.
        items:
          type: string
        type: array
    type: object
  main.BusinessManagementImageRequest:
    properties:
      image:
        description: JPEG or PNG bytes as standard base64 without data URI prefix
          (1 byte to 16 MiB; cover photos up to 5 MiB).
        format: byte
        type: string
    type: object
  main.BusinessManagementMovesRequest:
    properties:
      moves:
        description: Collection moves, 1-100, unique collection_id, zero-based indices
          below 100.
        items:
          $ref: '#/definitions/types.BusinessCollectionMove'
        type: array
    type: object
  main.BusinessManagementProductRequest:
    properties:
      height:
        description: 'Height in pixels of product media returned in the response:
          0 (default 100) or 1-1024.'
        type: integer
      product:
        $ref: '#/definitions/types.BusinessProductInput'
      width:
        description: 'Width in pixels of product media returned in the response: 0
          (default 100) or 1-1024.'
        type: integer
    type: object
  main.BusinessOrderRecoveryResponse:
    properties:
      error:
        type: string
      message_delivery:
        enum:
        - unknown
        - not_attempted
        type: string
      message_sent:
        type: boolean
        x-nullable: true
      order_created:
        type: boolean
      order_exists:
        type: boolean
      order_reused:
        type: boolean
      registered_order:
        $ref: '#/definitions/whatsmeow.BusinessCreatedOrder'
      success:
        type: boolean
    type: object
  main.BusinessOrderRejectRequest:
    properties:
      body:
        description: Optional note appended after the refusal text, at most 4096 bytes.
        type: string
      id:
        description: Optional custom WhatsApp message ID, at most 128 bytes.
        type: string
      incoming_message_id:
        description: Required ID of the received order message stored by this instance
          (max 128 bytes).
        type: string
      to:
        description: Required buyer JID, individual @s.whatsapp.net or @lid without
          device.
        type: string
    type: object
  main.BusinessOrderSendItem:
    properties:
      currency:
        type: string
      name:
        type: string
      price:
        type: string
      price_amount1000:
        type: integer
      product_id:
        type: string
      quantity:
        type: integer
    type: object
  main.BusinessOrderSendRequest:
    properties:
      business_jid:
        description: Seller business JID (phone@s.whatsapp.net); the order message
          is sent to this chat.
        type: string
      create_order:
        description: Register a real catalog order before sending; a 502 with order_created=true
          must not be retried as a new order.
        type: boolean
      order_id:
        description: 'Order ID: free-form in legacy mode, must be empty with create_order,
          required with resend_registered_order.'
        type: string
      order_items:
        description: Order lines; required unless resend_registered_order. create_order
          needs 1-100 unique lines with price_amount1000 and one currency.
        items:
          $ref: '#/definitions/main.BusinessOrderSendItem'
        type: array
      order_message:
        description: Optional text shown in the order message.
        type: string
      order_token:
        description: OrderToken is an authenticated recovery secret, accepted in JSON
          only and never logged.
        type: string
      resend_registered_order:
        description: ResendRegisteredOrder queries an existing order and sends it
          once without creating another. Mutually exclusive with CreateOrder.
        type: boolean
    type: object
  main.BusinessOrderSendResponse:
    properties:
      business_jid:
        type: string
      message:
        type: string
      message_id:
        type: string
      order_created:
        type: boolean
      order_details:
        properties:
          item_count:
            type: integer
          order_id:
            type: string
        type: object
      order_kind:
        enum:
        - legacy_summary
        - registered_order
        type: string
      registered_order:
        $ref: '#/definitions/whatsmeow.BusinessCreatedOrder'
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  main.ChatReadStateRequest:
    properties:
      last_message_from_me:
        description: Whether the last message was sent by this account. Required with
          `last_message_id` and rejected without it.
        example: false
        type: boolean
      last_message_id:
        description: Optional ID of the chat's last message. Requires `last_message_timestamp`
          and `last_message_from_me`.
        example: 3EB0A1B2C3D4E5F6A7B8C9
        type: string
      last_message_sender_jid:
        description: 'Sender of the last message, only for a message received in a
          group (`last_message_from_me: false`): a phone JID or LID. Rejected in any
          other case.'
        example: 5511988888888@s.whatsapp.net
        type: string
      last_message_timestamp:
        description: Optional Unix seconds (1 to 253402300799) of the chat's last
          message. Omitted or null uses the current time, captured once.
        example: 1732161600
        maximum: 253402300799
        minimum: 1
        type: integer
      phone:
        description: 'Chat to change: digits with country code (optional `+`), a phone
          JID or LID with digits only, or a group JID (`@g.us`). Device and agent
          JIDs are rejected.'
        example: "5511999999999"
        type: string
      read:
        description: 'Required, including `false`: `true` marks the chat as read and
          `false` as unread. Message receipts are never sent, and `false` does not
          undo earlier ones.'
        example: false
        type: boolean
    required:
    - phone
    - read
    type: object
  main.ChatReadStateResponse:
    description: 'Result of `POST /chat/read`: the chat JID written to the app state
      and the state requested. Nothing is read back from WhatsApp.'
    properties:
      jid:
        description: 'Chat JID actually written to the app state: a phone number is
          replaced by its LID when one is known, otherwise it stays a phone JID; a
          LID or group JID is kept as sent.'
        example: 100000000000001@lid
        type: string
      read:
        description: 'The state requested: `true` read, `false` unread. Echoed from
          the request, not read back.'
        example: false
        type: boolean
    type: object
  main.CommunityAllSubGroupsRequest:
    properties:
      community:
        description: 'Community JID (@g.us, no device): the parent community.'
        example: 120363000000000011@g.us
        type: string
      sub_group_hint:
        description: |-
          Optional group of the community this session has joined, sent to WhatsApp as a hint.
          Unlike /community/group-suggestions, leaving it out sends no hint at all.
        example: 120363000000000012@g.us
        type: string
    required:
    - community
    type: object
  main.CommunityCreateGroupRequest:
    properties:
      community:
        description: Community JID (@g.us, no device) the new group is created in.
        example: 120363000000000011@g.us
        type: string
      name:
        description: Group name, up to 25 characters.
        example: Support
        type: string
      participants:
        description: Optional participants to add on creation. Your own number is
          added by WhatsApp.
        items:
          type: string
        type: array
    required:
    - community
    - name
    type: object
  main.CommunityDeactivateRequest:
    properties:
      community:
        description: 'Community JID (@g.us, no device): the parent community.'
        example: 120363000000000011@g.us
        type: string
      confirm:
        description: |-
          Must be true. Deactivating a community cannot be undone, so it is refused without an
          explicit confirmation.
        example: true
        type: boolean
    required:
    - community
    - confirm
    type: object
  main.CommunityGroupAddModeRequest:
    properties:
      community:
        description: 'Community JID (@g.us, no device): the parent community, not
          one of its groups.'
        example: 120363000000000011@g.us
        type: string
      confirm_approve_pending:
        description: |-
          Switching to all_members makes WhatsApp approve every pending group suggestion. When
          there are any, the switch is refused with 409 and their count unless this is true, the
          way the official app asks before switching. Ignored for admins.
        example: false
        type: boolean
      mode:
        description: |-
          Who may add groups: admins (only community admins) or all_members (everyone in the
          community). Members may always suggest groups for admin approval.
        enum:
        - admins
        - all_members
        example: admins
        type: string
    required:
    - community
    - mode
    type: object
  main.CommunityGroupSuggestionCreateRequest:
    properties:
      community:
        description: 'Community JID (@g.us, no device): the parent community.'
        example: 120363000000000011@g.us
        type: string
      groups:
        description: 1 to 1000 existing group JIDs to suggest.
        example:
        - 120363000000000012@g.us
        items:
          type: string
        type: array
    required:
    - community
    - groups
    type: object
  main.CommunityGroupSuggestionRef:
    properties:
      creator:
        description: |-
          JID of the member who suggested it, as GET /community/group-suggestions reports it.
          Required to approve or reject, and must be left out to cancel.
        example: 5511999999999@s.whatsapp.net
        type: string
      group:
        description: Group JID (@g.us, no device) of the suggested group.
        example: 120363000000000012@g.us
        type: string
    required:
    - group
    type: object
  main.CommunityGroupSuggestionsRequest:
    properties:
      community:
        description: 'Community JID (@g.us, no device): the parent community.'
        example: 120363000000000011@g.us
        type: string
      sub_group_hint:
        description: |-
          Optional group of the community this session has joined, which WhatsApp requires as a
          hint. Left out, the community's announcement group is used.
        example: 120363000000000012@g.us
        type: string
    required:
    - community
    type: object
  main.CommunityGroupSuggestionsUpdateRequest:
    properties:
      action:
        description: |-
          approve adds the suggested group to the community, reject drops the suggestion (both are
          admin actions and need creator), and cancel withdraws a suggestion this session made.
        enum:
        - approve
        - reject
        - cancel
        example: approve
        type: string
      community:
        description: 'Community JID (@g.us, no device): the parent community.'
        example: 120363000000000011@g.us
        type: string
      suggestions:
        description: 1 to 1000 suggestions to act on.
        items:
          $ref: '#/definitions/main.CommunityGroupSuggestionRef'
        type: array
    required:
    - action
    - community
    - suggestions
    type: object
  main.CommunityMemberAddModeRequest:
    properties:
      community:
        description: |-
          Community JID (@g.us, no device): the parent community. The setting is applied to the
          community's announcement group, which this route resolves.
        example: 120363000000000011@g.us
        type: string
      mode:
        description: |-
          Who may add members: admin_add (only group and community admins) or all_member_add
          (everyone in the community). Same values as /group/memberaddmode.
        enum:
        - admin_add
        - all_member_add
        example: admin_add
        type: string
    required:
    - community
    - mode
    type: object
  main.CommunityNewGroupSuggestionRequest:
    properties:
      admins_only_edit_info:
        description: Ask for a group where only admins may change the group info.
        example: true
        type: boolean
      admins_only_send:
        description: Ask for a group where only admins may send messages.
        example: false
        type: boolean
      community:
        description: 'Community JID (@g.us, no device): the parent community.'
        example: 120363000000000011@g.us
        type: string
      description:
        description: The suggested group's description.
        example: Installation questions
        type: string
      hidden:
        description: |-
          Ask for a group that members who have not joined it do not see. WhatsApp's schema accepts
          it; the official app never sends it.
        example: false
        type: boolean
      history_share_mode:
        description: |-
          Who may share recent history in the suggested group: admin_share or all_member_share.
          Left out, the value the app's form starts with is sent: all_member_share.
        enum:
        - admin_share
        - all_member_share
        example: all_member_share
        type: string
      join_approval:
        description: 'The group''s join approval. Left out, the value the app''s form
          starts with is sent: off.'
        example: false
        type: boolean
      member_add_mode:
        description: |-
          Who may add members to the suggested group: admin_add or all_member_add. Left out, the
          value the app's form starts with is sent: all_member_add.
        enum:
        - admin_add
        - all_member_add
        example: all_member_add
        type: string
      name:
        description: The suggested group's name.
        example: Support
        type: string
    required:
    - community
    - name
    type: object
  main.CommunityTransferOwnershipRequest:
    properties:
      community:
        description: 'Community JID (@g.us, no device): the parent community.'
        example: 120363000000000011@g.us
        type: string
      confirm:
        description: |-
          Must be true. The transfer cannot be undone from this side, so it is refused without
          an explicit confirmation.
        example: true
        type: boolean
      new_owner:
        description: |-
          The community admin who becomes the new owner, as a phone-number or LID JID. Must be a
          user JID, not a group, without a device suffix.
        example: 5511999999999@s.whatsapp.net
        type: string
    required:
    - community
    - confirm
    - new_owner
    type: object
  main.EditNewsletterRequest:
    description: 'Channel JID plus at least one of name, description, picture or reactions.
      Only the fields present in the body are changed: sending "description":"" or
      "picture":"" clears that field, while a field left out (or null) is left untouched.'
    properties:
      description:
        description: New description, sent exactly as given (not trimmed); the empty
          string clears it.
        example: Release notes and product news
        type: string
      jid:
        description: Alias of newsletter_jid; must be identical when both are sent.
        example: 120363000000000022@newsletter
        type: string
      name:
        description: |-
          New channel name, trimmed. It cannot be empty, because a channel name cannot be
          cleared. The gateway does not cap its length: WhatsApp enforces the maximum and
          refuses a name that is too long.
        example: Product Updates
        type: string
      newsletter_jid:
        description: 'Channel JID: digits followed by @newsletter, without device.
          Alias: jid.'
        example: 120363000000000022@newsletter
        type: string
      picture:
        description: |-
          New picture as a base64 data URL or an HTTP(S) URL (JPEG, PNG, GIF or WebP). It is
          re-encoded as a JPEG of at most 640x640 before it is sent; the empty string removes
          the current picture.
        example: https://example.com/images/channel-cover.png
        type: string
      reactions:
        description: 'Which reactions followers may send: all, basic, blocklist or
          none (case-insensitive).'
        example: basic
        type: string
    type: object
  main.EditNewsletterResponse:
    description: Channel metadata as WhatsApp answered the edit, plus the fields this
      request changed.
    properties:
      applied:
        description: Fields this request changed, always in the order name, description,
          picture, reactions.
        example:
        - name
        - description
        items:
          type: string
        type: array
      description:
        description: Channel description after the change. Omitted when empty, for
          example after clearing it.
        example: Release notes and product news
        type: string
      invite_code:
        description: Channel invite code. Omitted when WhatsApp returns none.
        example: 0029VaExampleInviteCode01
        type: string
      jid:
        description: JID of the edited channel, as WhatsApp returned it.
        example: 120363000000000022@newsletter
        type: string
      message:
        description: Fixed confirmation text.
        example: Newsletter updated successfully
        type: string
      name:
        description: Channel name after the change. Omitted when empty.
        example: Product Updates
        type: string
      reactions:
        description: |-
          Reaction setting after the change, lowercased: all, basic, blocklist or none. Omitted
          when WhatsApp returns none.
        example: basic
        type: string
      success:
        description: Always true on success.
        example: true
        type: boolean
    type: object
  main.EventInviteFields:
    properties:
      call_link:
        description: 'Optional WhatsApp call link of the event: a `https://call.whatsapp.com/`
          link of at most 256 bytes, without spaces.'
        example: https://call.whatsapp.com/video/AbCdEfGhIjKlMnOpQrStUv
        type: string
      caption:
        description: Optional text shown with the invitation, at most 1024 characters.
        example: Join us for the planning session.
        type: string
      cover_image_handle:
        description: Optional handle of the full cover on WhatsApp's servers (letters,
          digits and `_./-`, up to 256).
        example: wa_event_user_image/flat/0123456789abcdef0123456789abcdef
        type: string
      end_time:
        description: Optional end in Unix seconds, after `start_time`.
        example: 1805140800
        type: integer
      event_id:
        description: Numeric id of an existing event with link (1 to 32 digits). Required
          when sending.
        example: "1234567890123456"
        type: string
      is_canceled:
        description: Optional flag that the event was canceled.
        example: false
        type: boolean
      last_updated_ts_usec:
        description: Optional time of the event's last change, in Unix microseconds;
          must not be negative.
        example: 1732161600000000
        type: integer
      location_name:
        description: Optional place name, at most 256 characters.
        example: Main office
        type: string
      start_time:
        description: Start in Unix seconds, greater than 0. Required when sending.
        example: 1805133600
        type: integer
      status:
        description: 'Optional state the invitation is sent with, case-insensitive:
          ACTIVE (default), CANCELED, SUSPENDED or UNKNOWN. The webhook can also deliver
          DELETED, LEFT_EVENT or REMOVED_FROM_INVITE_LIST, which are refused when
          sending.'
        example: ACTIVE
        type: string
      thumbnail_b64:
        description: Optional JPEG preview of the cover carried by the invitation,
          in base64, at most 100 KB.
        example: 
        type: string
      title:
        description: Event name. Required when sending; 1 to 100 characters after
          trimming.
        example: Quarterly planning
        type: string
    required:
    - event_id
    - start_time
    - title
    type: object
  main.EventInviteSendRequest:
    properties:
      event_invite:
        allOf:
        - $ref: '#/definitions/main.EventInviteFields'
        description: The existing event being shared, with the field names of the
          webhook's `data.event_invite`. Alias `EventInvite`.
      id:
        description: Optional WhatsApp message ID; generated when omitted.
        example: 3EB0D1E2F3A4B5C6D7E8F9
        type: string
      phone:
        description: 'Recipient: phone number with country code, or a phone, LID or
          group JID.'
        example: "5511999999999"
        type: string
    required:
    - event_invite
    - phone
    type: object
  main.EventLinkCreateRequest:
    properties:
      allow_extra_guest:
        description: When true, each guest may bring one more person.
        example: false
        type: boolean
      call:
        description: 'Optional WhatsApp call link attached to the event: `video` or
          `voice` (`audio` is accepted as `voice`).'
        example: video
        type: string
      call_waiting_room:
        description: When true, people joining the call link wait to be admitted.
          Requires `call`.
        example: false
        type: boolean
      cover_image:
        description: 'Optional cover: a JPEG, PNG or WebP in base64 or a base64 data
          URL, up to 10 MB, at least 16 x 9 pixels and at most 40 megapixels. It is
          cropped to 16:9 and limited to 1600 pixels wide. Not together with `cover_preset_handle`.'
        example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAJAQMAAAAB5D5xAAAAA1BMVEUlY+vg9LpFAAAADElEQVR42mLADQADAAAbAAGSOm1HAAAAAElFTkSuQmCC
        type: string
      cover_preset_handle:
        description: 'Optional ready-made WhatsApp cover: the `cover_image_handle`
          of an event with `cover_is_preset: true` in `GET /event/list`. Not together
          with `cover_image`.'
        example: preset/1
        type: string
      description:
        description: Optional description, at most 1000 bytes after trimming.
        example: Review of goals and the plan for next quarter.
        type: string
      end_time:
        description: Optional end in Unix seconds, after `start_time`. Omitted or
          0 means no end time; a negative value is refused.
        example: 1805140800
        type: integer
      location:
        allOf:
        - $ref: '#/definitions/main.EventLinkLocation'
        description: Optional place of the event.
      name:
        description: Event name. Required; at most 100 characters after trimming.
        example: Quarterly planning
        type: string
      reminder_offset_sec:
        description: 'Optional reminder before the start, in seconds: 900, 1800, 3600
          or 86400 (15 minutes, 30 minutes, 1 hour or 1 day). Omitted or 0 means no
          reminder. A reminder that would fall before the current time is dropped.'
        example: 3600
        type: integer
      start_time:
        description: Start in Unix seconds. Required, and must be in the future.
        example: 1805133600
        type: integer
    required:
    - name
    - start_time
    type: object
  main.EventLinkLocation:
    properties:
      address:
        description: Optional street address shown under the place name.
        example: 100 Example Avenue
        type: string
      latitude:
        description: Optional latitude in decimal degrees. Send it together with `longitude`,
          or neither.
        example: -23.55
        type: number
      longitude:
        description: Optional longitude in decimal degrees. Send it together with
          `latitude`, or neither.
        example: -46.63
        type: number
      name:
        description: Place name shown on the event. Required when `location` is sent.
        example: Main office
        type: string
    type: object
  main.GroupAddSendHistoryOptions:
    properties:
      bundle_id:
        description: Unused message ID for the history bundle (max 128 chars, differs
          from notice_id).
        example: 3EB0C767D26A1D6B8AA0
        maxLength: 128
        type: string
      last_n:
        description: |-
          1-200 newest retained messages of the group. Currently pinned retained messages
          that fall outside those N and may travel out of window are added automatically.
        example: 200
        maximum: 200
        minimum: 1
        type: integer
