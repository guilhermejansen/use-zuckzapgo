      description: 'Per reaction code, the accounts WhatsApp reports as having reacted
        to the post, and how many it reported (returned). WhatsApp identifies them
        by LID only: there is no name and no phone number in its answer. A sender
        is NAMED here only when the official apps would name it, which is when this
        session has it in its address book; the apps say it in words, "You can only
        view individual reactions from contacts," and drop the rest from the screen.
        This route keeps a row for every sender WhatsApp reported, counted in returned
        and in_contacts, and gives lid, display_name, phone_number and the picture
        path only for the named ones; the rest are rows with in_contacts false and
        identity_shown false and nothing that identifies the person. returned is NOT
        the reaction count: the official query takes no limit and the server decides
        how many senders it lists, so the per-emoji count of /newsletter/message-updates
        may be higher. Errors: 400 invalid input, 501 when the bundled library cannot
        read it, 502 when WhatsApp refuses. On a client platform that cannot send
        MEX requests the read answers 501 unsupported_client_platform with sent false;
        retrying will not help.'
