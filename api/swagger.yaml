        picture, the verification and the state of each channel, so the other fields
        of /newsletter/directory are left out here. Each channel carries subscribed,
        with the same subscribed_marked rule as /newsletter/directory. SIMILAR CHANNELS
        ARE A FEATURE WHATSAPP ENABLES PER ACCOUNT OR CHANNEL: the official apps show
        the row only behind similar_channels_in_channel_details_enabled or similar_channels_in_thread_on_follow_enabled,
        both off by default. Where it is not enabled WhatsApp answers the official
        query with 400 (seen live, for a followed channel and with country_code BR
        too), and this route answers 409 not_enabled_for_account with sent true; retrying
        will not help. Errors: 400 invalid input, 409 not_enabled_for_account, 501
        when the bundled library cannot read similar channels, 502 when WhatsApp refuses
        otherwise. On a client platform that cannot send MEX requests the read answers
        501 unsupported_client_platform with sent false; retrying will not help.'
