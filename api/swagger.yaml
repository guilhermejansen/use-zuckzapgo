basePath: /
definitions:
  main.AddUserNetworkRouteFailureResponse:
    properties:
      code:
        example: 503
        type: integer
      data:
        properties:
          network_route:
            $ref: '#/definitions/main.NetworkRouteView'
          userId:
            example: 5663e0c52063ec35d0ba45f7c2011c06
            type: string
        type: object
      details:
        example: user persisted in blocked state; submit a higher routeVersion with
          a new one-use auth key or delete this user
        type: string
      error:
        example: network_route_prepare_failed
        type: string
      success:
        example: false
        type: boolean
    type: object
  main.BusinessBillingSendRequest:
    properties:
      billing:
        $ref: '#/definitions/whatsmeow.BusinessBillingParams'
      billing_message_id:
        description: 'Status and payment only: ID of the own billing message to quote.'
        type: string
      body:
        description: Optional message text, at most 4096 bytes.
        type: string
      id:
        description: Optional custom WhatsApp message ID, at most 128 bytes.
        type: string
      image:
        description: 'Charge only: optional JPEG/PNG base64 or data URI turned into
          a JPEG header thumbnail; forbidden elsewhere.'
        type: string
      incoming_message_id:
        description: 'Accept only: ID of the received order message stored by this
          instance; forbidden in other modes.'
        type: string
      order_status:
        description: 'Payment mode only: optional order lifecycle status to declare
          with the payment.'
        type: string
      payment_method:
        description: 'Payment mode only: declared payment method, at most 64 bytes.'
        type: string
      payment_timestamp:
        description: 'Payment mode only: positive payment timestamp; payment_method
          or payment_timestamp is required.'
        type: integer
      reference_id:
        description: 'Status and payment only: reference_id of the quoted billing.'
        type: string
      status:
        description: Order status (status mode) or payment status pending|captured|failed
          (payment mode).
        type: string
      to:
        description: Required buyer JID, individual @s.whatsapp.net or @lid without
          device.
        type: string
    type: object
  main.BusinessManagementAppealRequest:
    properties:
      reason:
        description: Appeal reason, required, non-blank, at most 1024 bytes.
        type: string
    type: object
  main.BusinessManagementCollectionRequest:
    properties:
      name:
        description: Collection name, required, 1-256 bytes (trimmed).
        type: string
      product_ids:
        description: Own product IDs in the collection, 1-100 unique, each 1-256 bytes.
        items:
          type: string
        type: array
    type: object
  main.BusinessManagementCollectionsRequest:
    properties:
      collection_ids:
        description: Collection IDs to delete, 1-100 unique, each 1-256 bytes.
        items:
          type: string
        type: array
    type: object
  main.BusinessManagementEligibilityRequest:
    properties:
      features:
        description: Features to check, 1-6 unique values.
        items:
          $ref: '#/definitions/types.BusinessFeature'
        type: array
    type: object
  main.BusinessManagementEnabledRequest:
    properties:
      enabled:
        description: Required. true enables the shopping cart; false disables it.
        type: boolean
    type: object
  main.BusinessManagementHiddenRequest:
    properties:
      hidden:
        description: Required. true hides the product from public catalog reads; false
          shows it.
        type: boolean
    type: object
  main.BusinessManagementIDsRequest:
    properties:
      product_ids:
        description: Product IDs, 1-100 unique, each 1-256 bytes.
        items:
          type: string
        type: array
    type: object
  main.BusinessManagementImageRequest:
    properties:
      image:
        description: JPEG or PNG bytes as standard base64 without data URI prefix
          (1 byte to 16 MiB; cover photos up to 5 MiB).
        format: byte
        type: string
    type: object
  main.BusinessManagementMovesRequest:
    properties:
      moves:
        description: Collection moves, 1-100, unique collection_id, zero-based indices
          below 100.
        items:
          $ref: '#/definitions/types.BusinessCollectionMove'
        type: array
    type: object
  main.BusinessManagementProductRequest:
    properties:
      height:
        description: 'Height in pixels of product media returned in the response:
          0 (default 100) or 1-1024.'
        type: integer
      product:
        $ref: '#/definitions/types.BusinessProductInput'
      width:
        description: 'Width in pixels of product media returned in the response: 0
          (default 100) or 1-1024.'
        type: integer
    type: object
  main.BusinessOrderRecoveryResponse:
    properties:
      error:
        type: string
      message_delivery:
        enum:
        - unknown
        - not_attempted
        type: string
      message_sent:
        type: boolean
        x-nullable: true
      order_created:
        type: boolean
      order_exists:
        type: boolean
      order_reused:
        type: boolean
      registered_order:
        $ref: '#/definitions/whatsmeow.BusinessCreatedOrder'
      success:
        type: boolean
    type: object
  main.BusinessOrderRejectRequest:
    properties:
      body:
        description: Optional note appended after the refusal text, at most 4096 bytes.
        type: string
      id:
        description: Optional custom WhatsApp message ID, at most 128 bytes.
        type: string
      incoming_message_id:
        description: Required ID of the received order message stored by this instance
          (max 128 bytes).
        type: string
      to:
        description: Required buyer JID, individual @s.whatsapp.net or @lid without
          device.
        type: string
    type: object
  main.BusinessOrderSendItem:
    properties:
      currency:
        type: string
      name:
        type: string
      price:
        type: string
      price_amount1000:
        type: integer
      product_id:
        type: string
      quantity:
        type: integer
    type: object
  main.BusinessOrderSendRequest:
    properties:
      business_jid:
        description: Seller business JID (phone@s.whatsapp.net); the order message
          is sent to this chat.
        type: string
      create_order:
        description: Register a real catalog order before sending; a 502 with order_created=true
          must not be retried as a new order.
        type: boolean
      order_id:
        description: 'Order ID: free-form in legacy mode, must be empty with create_order,
          required with resend_registered_order.'
        type: string
      order_items:
        description: Order lines; required unless resend_registered_order. create_order
          needs 1-100 unique lines with price_amount1000 and one currency.
        items:
          $ref: '#/definitions/main.BusinessOrderSendItem'
        type: array
      order_message:
        description: Optional text shown in the order message.
        type: string
      order_token:
        description: OrderToken is an authenticated recovery secret, accepted in JSON
          only and never logged.
        type: string
      resend_registered_order:
        description: ResendRegisteredOrder queries an existing order and sends it
          once without creating another. Mutually exclusive with CreateOrder.
        type: boolean
    type: object
  main.BusinessOrderSendResponse:
    properties:
      business_jid:
        type: string
      message:
        type: string
      message_id:
        type: string
      order_created:
        type: boolean
      order_details:
        properties:
          item_count:
            type: integer
          order_id:
            type: string
        type: object
      order_kind:
        enum:
        - legacy_summary
        - registered_order
        type: string
      registered_order:
        $ref: '#/definitions/whatsmeow.BusinessCreatedOrder'
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  main.GroupHistoryLocalResult:
    properties:
      bundle_acknowledged:
        type: boolean
      notice_acknowledged:
        type: boolean
      phase:
        type: string
    type: object
  main.GroupHistoryOriginalObservation:
    properties:
      availability:
        type: string
      from_me:
        type: boolean
      kind:
        type: string
      message_id:
        type: string
      message_timestamp:
        type: integer
      preview:
        $ref: '#/definitions/main.GroupHistoryOriginalPreview'
    type: object
  main.GroupHistoryOriginalPreview:
    properties:
      text:
        type: string
      truncated:
        type: boolean
    type: object
  main.GroupHistoryOriginalsCheckRequest:
    properties:
      group_jid:
        maxLength: 128
        type: string
      message_ids:
        items:
          type: string
        type: array
      preview:
        type: boolean
      view:
        enum:
        - provenance
        - capture
        type: string
    required:
    - group_jid
    - message_ids
    type: object
  main.GroupHistoryOriginalsCheckResponse:
    properties:
      contract_version:
        type: string
      group_jid:
        type: string
      items:
        items:
          $ref: '#/definitions/main.GroupHistoryOriginalObservation'
        type: array
      remote_retention_verified:
        type: boolean
    type: object
  main.GroupHistoryOriginalsPageResponse:
    properties:
      contract_version:
        type: string
      group_jid:
        type: string
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/main.GroupHistoryOriginalObservation'
        type: array
      next_cursor:
        type: string
      remote_retention_verified:
        type: boolean
      scanned_count:
        type: integer
    type: object
  main.GroupHistorySendRequest:
    properties:
      bundle_id:
        description: Unused message ID for the history bundle (max 128 chars, differs
          from notice_id, never reusable).
        example: 3EB0C767D26A1D6B8AA0
        maxLength: 128
        type: string
      group_jid:
        description: Group JID (@g.us, no device) whose retained messages are shared.
        example: 120363000000000011@g.us
        type: string
      identity_contract:
        description: Optional strict native continuity contract for automatic company
          batches.
        enum:
        - group-history-send-observed.v1
        type: string
      message_ids:
        description: 1-100 distinct IDs (max 128 chars) of original messages retained
          for this user and group.
        example:
        - 3EB0C767D26A1D6B8A9F
        - 3EB0C767D26A1D6B8A9E
        items:
          type: string
        type: array
      notice_id:
        description: Unused message ID for the history notice (max 128 chars, differs
          from bundle_id, never reusable).
        example: 3EB0C767D26A1D6B8AA1
        maxLength: 128
        type: string
      recipients:
        description: '1-100 distinct other current members: phone, @s.whatsapp.net
          or @lid JID without device.'
        example:
        - "5511999999999"
        - 123456789012345@lid
        items:
          type: string
        type: array
    required:
    - bundle_id
    - group_jid
    - message_ids
    - notice_id
    - recipients
    type: object
  main.GroupHistorySendStatusRequest:
    properties:
      bundle_id:
        maxLength: 128
        type: string
      group_jid:
        maxLength: 128
        type: string
      identity_contract:
        enum:
        - group-history-send-observed.v1
        type: string
      notice_id:
        maxLength: 128
        type: string
      request_digest:
        maxLength: 64
        minLength: 64
        type: string
    required:
    - bundle_id
    - group_jid
    - notice_id
    type: object
  main.GroupHistorySendStatusResponse:
    properties:
      bundle_id:
        type: string
      contract_version:
        type: string
      group_jid:
        type: string
      identity_contract:
        type: string
      local_result:
        $ref: '#/definitions/main.GroupHistoryLocalResult'
      notice_id:
        type: string
      recipient_delivery_verified:
        type: boolean
      request_digest:
        type: string
      retry_safe:
        type: boolean
      state:
        type: string
    type: object
  main.GroupHistoryShareModeRequest:
    properties:
      groupjid:
        description: Group JID (@g.us, no device) to configure.
        example: 120363000000000011@g.us
        type: string
      mode:
        description: 'Who may share recent history: admin_share (admins only) or all_member_share
          (all members).'
        enum:
        - admin_share
        - all_member_share
        example: admin_share
        type: string
    required:
    - groupjid
    - mode
    type: object
  main.GroupParticipantContactErasureAuthority:
    properties:
      authority_epoch:
        type: string
      grant_revision:
        type: integer
      proof_ref:
        type: string
    type: object
  main.GroupParticipantContactErasureRequest:
    properties:
      authority:
        $ref: '#/definitions/main.GroupParticipantContactErasureAuthority'
      dsr_ref:
        type: string
      locator:
        $ref: '#/definitions/main.GroupParticipantOriginalLocator'
      projection_version:
        type: string
    type: object
  main.GroupParticipantOriginalLocator:
    properties:
      authority_epoch:
        type: integer
      caller_key:
        type: string
      group_jid:
        type: string
      locator_version:
        type: string
      observed_revision:
        type: integer
      operation_id:
        type: string
      original_scope:
        $ref: '#/definitions/main.GroupParticipantOriginalLocatorScope'
      scope_ref:
        type: string
    type: object
  main.GroupParticipantOriginalLocatorQuery:
    properties:
      caller_key:
        type: string
      group_jid:
        type: string
      locator_version:
        type: string
      operation_id:
        type: string
      scope_ref:
        type: string
    type: object
  main.GroupParticipantOriginalLocatorScope:
    properties:
      account_ref:
        type: string
      principal_id:
        type: string
      source_binding:
        type: string
      source_epoch:
        type: integer
    type: object
  main.HealthBuildInfo:
    properties:
      commit:
        example: a1b2c3d4
        type: string
    type: object
  main.HealthCheckCapabilities:
    properties:
      webhook_fallback:
        example: 1
        type: integer
    type: object
  main.HealthCheckMetrics:
    properties:
      cpu_count:
        example: 8
        type: integer
      go_max_procs:
        example: 8
        type: integer
      go_version:
        example: go1.21.5
        type: string
      goroutines:
        example: 42
        type: integer
    type: object
  main.HealthCheckResponse:
    properties:
      build:
        $ref: '#/definitions/main.HealthBuildInfo'
      capabilities:
        $ref: '#/definitions/main.HealthCheckCapabilities'
      code:
        example: 200
        type: integer
      data:
        example: OK
        type: string
      environment:
        $ref: '#/definitions/main.HealthEnvironmentMetadata'
      metrics:
        $ref: '#/definitions/main.HealthCheckMetrics'
      public_url:
        type: string
      services:
        additionalProperties:
          $ref: '#/definitions/main.HealthServiceStatus'
        type: object
      status:
        example: healthy
        type: string
      success:
        example: true
        type: boolean
      timestamp:
        example: "2024-01-01T12:00:00Z"
        type: string
      uptime:
        example: 86400
        type: integer
      version:
        example: 3.0.0
        type: string
    type: object
  main.HealthEnvironmentMetadata:
    properties:
      app_env:
        example: production
        type: string
      app_region:
        example: us-east-1
        type: string
      containerized:
        example: false
        type: boolean
      hostname:
        example: zuckzapgo-01
        type: string
    type: object
  main.HealthServiceStatus:
    properties:
      driver:
        example: postgres
        type: string
      error:
        example: database not configured
        type: string
      idle:
        example: 8
        type: integer
      in_use:
        example: 2
        type: integer
      latency_ms:
        example: 12.5
        type: number
      open_connections:
        example: 10
        type: integer
      status:
        example: up
        type: string
    type: object
  main.NetworkRouteApplyResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/main.NetworkRouteView'
      details:
        example: network route ready
        type: string
      reconnectScheduled:
        example: false
        type: boolean
      success:
        example: true
        type: boolean
    type: object
  main.NetworkRouteErrorResponse:
    properties:
      code:
        example: 503
        type: integer
      data:
        $ref: '#/definitions/main.NetworkRouteView'
      details:
        type: string
      error:
        example: network_route_prepare_failed
        type: string
      success:
        example: false
        type: boolean
    type: object
  main.NetworkRouteGetResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/main.NetworkRouteView'
      success:
        example: true
        type: boolean
    type: object
  main.NetworkRouteRequest:
    properties:
      authKey:
        description: AuthKey is a JIT, single-use Tailscale auth key. It is write-only
          and is never persisted, returned, or logged.
        example: tskey-auth-REDACTED
        type: string
        x-writeonly: "true"
      exitNodeId:
        description: ExitNodeID is the stable Tailscale node ID, not a mutable hostname
          or IP.
        example: nExampleStableExitNode
        type: string
      failClosed:
        description: |-
          FailClosed decides what happens while the route is not ready: `true` holds the traffic;
          `false` (also the value when the field is omitted) lets the session leave through the default egress. Not holding traffic is an explicit operator
          choice with a cost (the peer sees the session coming from another IP), so it is never inferred.
        example: true
        type: boolean
      idempotencyKey:
        description: IdempotencyKey identifies exactly one desired version and must
          be reused only for an identical retry.
        example: route-2026-08-15-0001
        type: string
      mode:
        description: Mode only accepts "mobile". Direct egress is deliberately unsupported.
        enum:
        - mobile
        example: mobile
        type: string
      routeVersion:
        description: RouteVersion is a positive, monotonically increasing fencing
          token.
        example: 1
        minimum: 1
        type: integer
      tcpOnly:
        description: TCPOnly must be true. Native Calls/UDP is disabled while this
          route is desired.
        example: true
        type: boolean
    type: object
  main.NetworkRouteView:
    properties:
      appliedVersion:
        example: 1
        type: integer
      desiredVersion:
        example: 1
        type: integer
      errorCode:
        example: network_route_prepare_failed
        type: string
      exitNodeId:
        example: nExampleStableExitNode
        type: string
      failClosed:
        example: true
        type: boolean
      mode:
        enum:
        - mobile
        example: mobile
        type: string
      ready:
        example: true
        type: boolean
      status:
        enum:
        - preparing
        - ready
        - blocked
        example: ready
        type: string
      tcpOnly:
        example: true
        type: boolean
    type: object
  main.NewsletterTargetRequest:
    properties:
      Code:
        description: Channel invite code or `https://whatsapp.com/channel/<code>`
          link (max 2048 bytes) for follow-invite/unfollow-invite; aliases code, invite_code.
        example: 0029VaExampleInviteCode01
        type: string
      NewsletterJID:
        description: Newsletter JID (`<digits>@newsletter`) for follow, unfollow,
          info, messages; aliases newsletter_jid, jid, NewsletterID.
        example: 120363000000000022@newsletter
        type: string
      before_id:
        description: On /newsletter/messages, return posts older than this server
          message ID (string or integer); aliases before, Before.
        example: "120"
        type: string
      limit:
        description: Posts to return on /newsletter/messages (1-1000, default 25);
          aliases count, Count.
        example: 25
        type: integer
      newsletter_jid:
        description: Snake-case alias of NewsletterJID; must be identical when both
          are sent.
        example: 120363000000000022@newsletter
        type: string
    type: object
  main.PasskeyResponsePayload:
    properties:
      id:
        description: Credential ID from the WebAuthn assertion, sent as-is (required).
        example: Y3JlZGVudGlhbC1pZC0wMDAx
        type: string
      rawId:
        description: Raw credential ID, base64url without padding (required).
        example: Y3JlZGVudGlhbC1pZC0wMDAx
        type: string
      response:
        description: Authenticator assertion data; all values base64url without padding.
        properties:
          authenticatorData:
            description: Authenticator data bytes, base64url without padding (required).
            example: ZmljdGl0aW91cy1hdXRoZW50aWNhdG9yLWRhdGE
            type: string
          clientDataJSON:
            description: Client data JSON bytes, base64url without padding (required).
            example: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0Iiwib3JpZ2luIjoiaHR0cHM6Ly93ZWIud2hhdHNhcHAuY29tIn0
            type: string
          signature:
            description: Assertion signature bytes, base64url without padding (required).
            example: ZmljdGl0aW91cy1zaWduYXR1cmUtYnl0ZXM
            type: string
          userHandle:
            description: Optional user handle bytes, base64url without padding.
            example: dXNlci1oYW5kbGUtMDAwMQ
            type: string
        type: object
      type:
        description: Credential type, normally public-key (required).
        example: public-key
        type: string
    type: object
  main.UserContactLinkResolveRequest:
    properties:
      code:
        description: Contact QR code or https://wa.me/qr/ URL, 1-2048 bytes, no whitespace
          (required).
        example: https://wa.me/qr/ABCDEFGHIJKL12
        maxLength: 2048
        minLength: 1
        type: string
    type: object
  main.UserContactLinkResolveResponse:
    properties:
      data:
        $ref: '#/definitions/types.ContactQRLinkTarget'
      success:
        type: boolean
    type: object
  main.UserIdentityCodesResponse:
    properties:
      data:
        $ref: '#/definitions/whatsmeow.IdentityVerificationCodes'
      success:
        type: boolean
    type: object
  main.UserUsernameResolveRequest:
    properties:
      key:
        description: Optional four-digit key required by some usernames.
        example: "4821"
        maxLength: 4
        minLength: 4
        type: string
      username:
        description: WhatsApp username, 3-35 chars, optional leading @, no whitespace
          (required).
        example: examplestore
        type: string
    type: object
  main.UserUsernameResolveResponse:
    properties:
      data:
        $ref: '#/definitions/types.UsernameResolution'
      success:
        type: boolean
    type: object
  main.WebAccount:
    properties:
      accountSignature:
        description: Account signature issued at pairing, base64 (required).
        example: FRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0BBQkNERUZHSElKS0xNTk9QUVJTVA==
        type: string
      accountSignatureKey:
        description: Public key that produced the account signature, base64 (required).
        example: HyAhIiMkJSYnKCkqKywtLi8wMTIzNDU2Nzg5Ojs8PT4=
        type: string
      details:
        description: Serialized ADVDeviceIdentity details, base64 (required).
        example: CwwNDg8QERITFBUWFxgZGhscHR4fICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6
        type: string
      deviceSignature:
        description: Device signature, base64 (required).
        example: KSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj9AQUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVpbXF1eX2BhYmNkZWZnaA==
        type: string
    type: object
  main.WebDeviceSnapshot:
    properties:
      account:
        allOf:
        - $ref: '#/definitions/main.WebAccount'
        description: ADVSignedDeviceIdentity issued by WhatsApp at pairing (required).
      advSecretKey:
        description: Optional ADV secret key, base64; a fresh random key is kept when
          omitted.
        example: YOUR_ADV_SECRET_KEY_BASE64_32_BYTES
        type: string
      businessName:
        description: Optional business name stored on the device.
        example: Example Store
        type: string
      identityKey:
        allOf:
        - $ref: '#/definitions/main.WebKeyPair'
        description: Signal identity key pair of the device (required).
      lid:
        description: Optional device LID JID, e.g. 123456789012345:12@lid.
        example: 123456789012345:12@lid
        type: string
      meJid:
        description: Device JID of the imported session, e.g. 5511999999999:12@s.whatsapp.net
          (required).
        example: 5511999999999:12@s.whatsapp.net
        type: string
      noiseKey:
        allOf:
        - $ref: '#/definitions/main.WebKeyPair'
        description: Noise protocol key pair of the device (required).
      platform:
        description: Optional platform label stored on the device.
        example: chrome
        type: string
      pushName:
        description: Optional push name stored on the device.
        example: Support Line
        type: string
      registrationId:
        description: Signal registration ID of the device; must be non-zero (required).
        example: 12345
        type: integer
      signedPreKey:
        allOf:
        - $ref: '#/definitions/main.WebSignedPreKey'
        description: Signed pre-key with its identity-key signature (required).
    type: object
  main.WebKeyPair:
    properties:
      priv:
        description: Private key, 32 bytes, base64 (standard or URL alphabet, padded
          or not) (required).
        example: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
        type: string
      pub:
        description: Optional public key, base64; ignored because it is derived from
          priv.
        example: yVb3ZlK0exampleDerivedPublicKey0000000000=
        type: string
    type: object
  main.WebSignedPreKey:
    properties:
      keyId:
        description: Signed pre-key ID.
        example: 1
        type: integer
      priv:
        description: Private key, 32 bytes, base64 (required).
        example: QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVpbXF1eX2A=
        type: string
      pub:
        description: Optional public key, base64; ignored because it is derived from
          priv.
        example: Zm9vYmFyZXhhbXBsZURlcml2ZWRQdWJsaWNLZXkwMA==
        type: string
      signature:
        description: Signature of the public key by the identity key, 64 bytes, base64
          (required).
        example: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXp7fH1+f4CBgoOEhYaHiImKi4yNjo+QkZKTlJWWl5iZmpucnZ6foA==
        type: string
    type: object
  main.contactRequestInput:
    properties:
      body:
        description: Text shown above the "Share contact" button. Required; 1 to 1024
          characters after trimming; never truncated.
        example: Para continuarmos, compartilhe seu contato.
        type: string
      context_info:
        description: 'Optional quoted reply: StanzaID and Participant must be sent
          together.'
        type: object
      id:
        description: 'Optional WhatsApp message ID ([A-Za-z0-9], up to 128). Reuse
          the same id on every retry: it is the idempotency key.'
        example: 3EB0A1B2C3D4E5F6A7B8C9
        type: string
      number_check:
        description: 'Optional: verify the phone number is on WhatsApp before sending
          (phone-number recipients only).'
        type: boolean
      phone:
        description: 'One-to-one recipient: digits (optional +), <digits>@s.whatsapp.net
          or <digits>@lid. Groups, newsletters, broadcast and status are rejected.'
        example: "5511999999999"
        type: string
      presence:
        description: Optional typing indicator duration in milliseconds before sending.
        type: integer
    type: object
  main.groupParticipantHandleRequest:
