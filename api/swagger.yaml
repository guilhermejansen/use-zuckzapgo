        in: body
        name: request
        required: true
        schema:
          properties:
            active:
              type: boolean
            events:
              items:
                type: string
              type: array
            fallback_webhookurl:
              type: string
            webhookurl:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              active:
                type: boolean
              events:
                items:
                  type: string
                type: array
              fallback_webhook:
                type: string
              webhook:
                type: string
            type: object
      summary: Update webhook configuration
      tags:
      - Webhook
