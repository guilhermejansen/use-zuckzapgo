      - application/json
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send a shop deeplink
      tags:
      - Business
  /business/sticker-pack/{packId}:
    get:
      consumes:
      - application/json
      description: Fetch the full metadata for a public WhatsApp sticker pack by its
        pack ID. Returns the pack header (id/name/publisher/description/file-size/image-data-hash/tray
        image refs) plus the list of stickers (URL, direct-path, media key, file hashes,
        dimensions, MIME, emojis, accessibility label, handle). The response contains
        everything needed to download each sticker individually through /chat/downloadsticker
        — no extra round trips are required.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Sticker pack ID (32-char hex string published by WhatsApp)
        in: path
        name: packId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sticker pack metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid pack ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Sticker pack not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      summary: Fetch sticker pack metadata
      tags:
      - Business
  /call/{call_id}/events:
    get:
      description: 'Server-Sent Events for everything peers do during a call: reactions,
        hand raise, mute state, screen share, group roster changes, waiting-room requests
        and call phase. Reactions are transient and cannot be polled, which is why
        this is a stream. Auth via ?token={TOKEN}.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Live call ID
        in: path
        name: call_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses: {}
      summary: In-call event stream
      tags:
      - Call
  /call/{call_id}/group/state:
    get:
      description: Returns the authoritative participant roster for a live group call.
      parameters:
      - description: Call ID
        in: path
        name: call_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/voip.GroupCallInfo'
      summary: Group call roster
      tags:
      - Call
  /call/{call_id}/stream:
    get:
      description: Upgrade to a WebSocket bridging raw PCM. Server sends binary s16le
        16kHz mono frames (960 samples/1920 bytes per 60ms) of the peer audio; client
        sends s16le frames played to the peer. Mutually exclusive with recording per
        call.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Live call ID
        in: path
        name: call_id
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Bidirectional raw-PCM call media WebSocket
      tags:
      - Call
  /call/{call_id}/video/state:
    get:
      description: Server-Sent Events stream for peer video state changes. Events
        are JSON objects with active, upgrade, orientation and raw fields.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Live call ID
        in: path
        name: call_id
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Video state SSE
      tags:
      - Call
  /call/{call_id}/video/stats:
    get:
      description: 'Per-call video statistics while the call is running: participants
        sending video, frames received/delivered/shed, backlog bytes, and outbound
        frame counters. Use it to tell whether video lag is server-side backpressure
        or client-side decoding.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Live call ID
        in: path
        name: call_id
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Live video telemetry for a call
      tags:
      - Call
  /call/{call_id}/video/stream:
    get:
      description: Upgrade to a WebSocket bridging raw H.264 Annex-B access units.
        Server sends peer video as binary frames; client sends binary frames that
        are forwarded to the peer. Pass fmt=participant to receive per-participant
        framed frames plus JSON control events (required for group video). Auth via
        ?token={TOKEN}.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Live call ID
        in: path
        name: call_id
        required: true
        type: string
      - description: 'Inbound framing: ''participant'' for per-participant demux (group
          video). Default is bare access units.'
        in: query
        name: fmt
        type: string
      produces:
      - application/json
      responses: {}
      summary: Bidirectional H.264 video WebSocket
      tags:
      - Call
  /call/{call_id}/waiting-room:
    get:
      description: Returns the pending-approval roster for a call link.
      parameters:
      - description: Call ID
        in: path
        name: call_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/voip.WaitingRoomInfo'
      summary: Call waiting room
      tags:
      - Call
  /call/accept:
    post:
      consumes:
      - application/json
      description: 'Send an accept stanza for an inbound call. With the native calls
        engine on, a call the engine tracks is answered with POST /call/answer: this
        legacy accept does not connect the call (no media) and does not tell the engine.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Accept an incoming call
      tags:
      - Call
  /call/answer:
    post:
      consumes:
      - application/json
      description: Answer a ringing inbound call (manual mode). Returns 404 if the
        call is not found.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Answer a ringing inbound call
      tags:
      - Call
  /call/config:
    get:
      consumes:
      - application/json
      description: Return the per-instance native calls engine configuration. callProviderToken
        is never returned.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get the native calls engine configuration
      tags:
      - Call
    put:
      consumes:
      - application/json
      description: 'Persist the native calls engine configuration. callRecord applies
        to the live engine immediately (the next answered call records or not; a running
        recording is not cut); every other field applies on the next reconnect. Empty
        callInboundMode defaults to webhook; invalid mode returns 400. callProviderToken
        is write-only: when omitted or null the stored token is kept; send an empty
        string to clear it.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Update the native calls engine configuration
      tags:
      - Call
  /call/dial:
    post:
      consumes:
      - application/json
      description: Originate an outbound native call. phone accepts E.164 digits (no
        +), a phone JID, or a @lid — anything carrying an explicit @ is used as given.
        A plain number is resolved to the callee's LID first, which is what makes
        a Brazilian mobile typed WITH the ninth digit work even though WhatsApp stores
        many of them without it. Set video to place a video call (H.264). Returns
        502 if the peer is unreachable.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: 'phone (string: number, phone JID or @lid) and optional video
          (bool)'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Place an outbound call
      tags:
      - Call
  /call/group/dial:
    post:
      consumes:
      - application/json
      description: Places an outbound group call to two or more targets. Each target
        may be a phone number, a phone JID or a @lid. WhatsApp rejects a group call
        with fewer than two remote participants. Pass groupJid to keep the call BOUND
        to a WhatsApp group while calling only some of its members — the only way
        to call a group larger than WhatsApp's connected-limit (32 including you),
        since /call/group/dial-by-id refuses those outright.
      parameters:
      - description: targets (string array, min 2), optional video (bool), optional
          groupJid (string) to bind the call to a group
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Place a group call
      tags:
      - Call
  /call/group/dial-by-id:
    post:
      consumes:
      - application/json
      description: Resolves an existing WhatsApp group's roster and calls every remote
        member. The call stays bound to the group.
      parameters:
      - description: groupJid (string) and optional video (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Place a group call by group JID
      tags:
      - Call
  /call/hand:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and raised (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Raise or lower hand
      tags:
      - Call
  /call/hangup:
    post:
      consumes:
      - application/json
      description: End a live call and tear down its media session. Returns 404 if
        the call is not found.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Hang up a live call
      tags:
      - Call
  /call/initiate:
    post:
      consumes:
      - application/json
      description: Legacy route. Returns 501 make_call_not_implemented by default;
        place outbound calls with POST /call/dial. When the instance sets GLOBAL_CALL_INITIATE_DIAL_ALIAS=true
        this route becomes an alias of /call/dial (phone and optional video; returns
        callId; requires calls_enabled and a connected session).
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: 'Only used when GLOBAL_CALL_INITIATE_DIAL_ALIAS=true: phone (string:
          number, phone JID or @lid) and optional video (bool)'
        in: body
        name: data
        schema:
          type: object
      produces:
      - application/json
      responses: {}
      summary: Originate a new call
      tags:
      - Call
  /call/link/create:
    post:
      consumes:
      - application/json
      description: Creates a reusable public call link. Anyone with the token or URL
        can join, subject to the waiting room.
      parameters:
      - description: optional video (bool)
        in: body
        name: data
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/voip.CallLinkInfo'
      summary: Create a call link
      tags:
      - Call
  /call/link/join:
    post:
      consumes:
      - application/json
      description: Joins an active call-link session, or enters its waiting room when
        the link requires approval. The resulting call is tracked like any other.
      parameters:
      - description: token (string) and optional video (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Join a call link
      tags:
      - Call
  /call/link/preview:
    get:
      description: Reads call-link metadata without joining. Accepts the bare token
        or a full call.whatsapp.com URL.
      parameters:
      - description: Call link token or URL
        in: query
        name: token
        required: true
        type: string
      - description: Preview as a video link
        in: query
        name: video
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/voip.CallLinkPreviewInfo'
      summary: Preview a call link
      tags:
      - Call
  /call/participants/add:
    post:
      consumes:
      - application/json
      description: Invites one or more people to a live call. Returns the list of
        targets that failed, so a partial failure is visible instead of collapsing
        into one error.
      parameters:
      - description: callId (string) and targets (string array)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Add participants to a call
      tags:
      - Call
  /call/participants/ring:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and target
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Re-ring a participant
      tags:
      - Call
  /call/play:
    post:
      consumes:
      - application/json
      description: Play an audio source (audioUrl or audioBase64; WAV/MP3/Ogg-Opus)
        to the peer. Audio is auto-detected and resampled to 16kHz mono.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Play audio into a live call
      tags:
      - Call
  /call/preaccept:
    post:
      consumes:
      - application/json
      description: 'Send a preaccept stanza for an inbound call. With the native calls
        engine on, the engine already sent its own preaccept when the offer arrived,
        and a call it tracks is answered with POST /call/answer: this legacy preaccept
        does not tell the engine.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Pre-accept an incoming call
      tags:
      - Call
  /call/reaction:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and emoji
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Send an in-call reaction
      tags:
      - Call
  /call/record/start:
    post:
      consumes:
      - application/json
      description: 'Record the peer''s audio to a WAV file in the instance''s own
        S3 bucket. Mutually exclusive with the media stream per call. Requires callRecord
        enabled in PUT /call/config; otherwise returns 403 call_recording_disabled
        and nothing is recorded. Requires the instance''s own S3 (enabled, with a
        bucket): the global S3 is never a recording destination. Without it the route
        answers 400 "voip: recording requires object storage (S3) to be configured"
        before anything is opened.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "400":
          description: 'voip: recording requires object storage (S3) to be configured
            — the instance has no S3 of its own (the global S3 does not count)'
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'call_recording_disabled: callRecord is off for this instance'
          schema:
            additionalProperties: true
            type: object
      summary: Start recording a call
      tags:
      - Call
  /call/record/stop:
    post:
      consumes:
      - application/json
      description: Finalize the recording, store the WAV in the instance's S3 bucket,
        and return its object key (calls/{instance id}/{recording id}.wav, not a URL)
        as mediaKey (empty when no recording was active). On upload failure returns
        400; the recording stays pending and is completed in the background, announced
        by the CallRecordingReady webhook with the same key.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Stop recording a call
      tags:
      - Call
  /call/reject:
    post:
      consumes:
      - application/json
      description: 'Reject an incoming call. Optionally send a follow-up text message.
        With the native calls engine on and tracking call_id, the engine ends the
        call (reject while an inbound call is still ringing, hangup otherwise): the
        stanza goes to the exact device that called and the engine drops the call
        too. Without the engine, or for a call it does not track, the legacy reject
        stanza is sent unchanged, addressed to call_from (to its device when call_from
        carries one). The response body is the same on both paths.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Reject an incoming call
      tags:
      - Call
  /call/reject/send:
    post:
      consumes:
      - application/json
      description: 'Send a custom call rejection message to a WhatsApp user or group.
        This is NOT the same as /call/reject, which rejects the call itself — this
        one delivers a message alongside the rejection. With the native calls engine
        on and tracking call_id, the engine ends the call (reject while an inbound
        call is still ringing, hangup otherwise): the stanza goes to the exact device
        that called and the engine drops the call too. Without the engine, or for
        a call it does not track, the legacy reject stanza is sent unchanged, addressed
        to call_from (to its device when call_from carries one).'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send a custom call rejection message
      tags:
      - Call
  /call/screenshare:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and enabled (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Toggle screen share
      tags:
      - Call
  /call/status:
    get:
      consumes:
      - application/json
      description: List the native calls engine's currently tracked calls for the
        instance.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: List live calls
      tags:
      - Call
  /call/terminate:
    post:
      consumes:
      - application/json
      description: 'Send a terminate stanza. Default reason is "hangup". With the
        native calls engine on and tracking call_id, the engine hangs up instead:
        its terminate goes to the exact device of the peer and the engine drops the
        call too. An inbound call the engine still has ringing is rejected instead
        (a callee that has not answered can only decline; a reject carries no reason).
        A reason set in the request goes on the engine''s terminate as on the legacy
        stanza; without one the engine''s terminate carries no reason attribute. The
        response body is the same on every path (action terminated, reason echoed,
        "hangup" by default). Without the engine, or for a call it does not track,
        the legacy terminate stanza is sent unchanged, addressed to call_from (to
        its device when call_from carries one).'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Terminate an active call
      tags:
      - Call
  /call/video:
    post:
      consumes:
      - application/json
      description: Starts or stops sending local video on a live call. Frames are
        still pushed through the /call/{call_id}/video/stream websocket.
      parameters:
      - description: callId and enabled (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Toggle outbound video
      tags:
      - Call
  /call/waiting-room/admit:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and user
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Admit a waiting participant
      tags:
      - Call
  /call/waiting-room/approval:
    post:
      consumes:
      - application/json
      description: Turns the waiting room on or off for a call link. Admin only.
      parameters:
      - description: callId and enabled (bool)
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Toggle call-link approval
      tags:
      - Call
  /call/waiting-room/deny:
    post:
      consumes:
      - application/json
      parameters:
      - description: callId and user
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Deny a waiting participant
      tags:
      - Call
  /chat/archive:
    post:
      consumes:
      - application/json
      description: Archive or unarchive a chat to hide it from the main chat list.
        Archived chats are moved to the "Archived" folder and will reappear in the
        main list when a new message is received. You can optionally specify the last
        message information for proper synchronization. Set archive to true to archive
        or false to unarchive.
      produces:
      - application/json
      responses: {}
      summary: Archive or unarchive chat
      tags:
      - Chat
  /chat/delete:
    post:
      consumes:
      - application/json
      description: Delete a message from a chat (revoke — "This message was deleted"
        for every participant). Deletes your own messages in any chat. In GROUPS,
        a group admin can also delete OTHER participants' messages by passing the
        optional Sender field (the original author's JID, e.g. "5521999999999@s.whatsapp.net"
        or "123456@lid") — mirroring WhatsApp's admin delete-for-everyone. There may
        be a time limit for deletion depending on WhatsApp's policies.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Delete message
      tags:
      - Chat
  /chat/delete-chat:
    post:
      consumes:
      - application/json
      description: Delete a chat entirely from the chat list. This is different from
        clearing chat history - it removes the chat from your chat list completely.
        The chat will reappear if you receive a new message from this contact. Optionally
        provide the last message details for more precise deletion. The delete_media
        parameter controls whether associated media files are also deleted (defaults
        to true). People are addressed by LID when known (index and last message key),
        groups by their JID. last_system_message_timestamp (optional, Unix seconds)
        marks the last system notice to delete (for example disappearing-messages
        notices); it defaults to last_message_timestamp, or to now when neither is
        sent.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Delete chat request
        in: body
        name: request
        required: true
        schema:
          properties:
            delete_media:
              type: boolean
            last_message_from_me:
              type: boolean
            last_message_id:
              type: string
            last_message_sender_jid:
              type: string
            last_message_timestamp:
              type: integer
            last_system_message_timestamp:
              type: integer
            phone:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Chat deleted successfully
          schema:
            properties:
              delete_media:
                type: boolean
              jid:
                type: string
              message:
                type: string
              success:
                type: boolean
            type: object
        "400":
          description: Invalid request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal server error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Delete chat from chat list
      tags:
      - Chat
  /chat/downloadaudio:
    post:
      consumes:
      - application/json
      description: Download an audio file from a WhatsApp message and return it as
        base64 encoded data URL. You need to provide the media information from the
        received message including URL, media key, and file hashes. The audio is decrypted
        and returned as a data URL that can be directly used in HTML audio tags or
        saved to disk. Supports voice messages, audio files (MP3, M4A, OGG), and PTT
        (push-to-talk) messages.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Download audio from message
      tags:
      - Chat
  /chat/downloaddocument:
    post:
      consumes:
      - application/json
      description: Download a document from a WhatsApp message and return it as base64
        encoded data URL. You need to provide the media information from the received
        message including URL, media key, and file hashes. The document is decrypted
        and returned as a data URL that can be directly used or saved to disk. Supports
        all document types including PDF, DOC, XLS, PPT, ZIP, etc.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Download document from message
      tags:
      - Chat
  /chat/downloadimage:
    post:
      consumes:
      - application/json
      description: Download an image from a WhatsApp message and return it as base64
        encoded data URL. You need to provide the media information from the received
        message including URL, media key, and file hashes. The image is decrypted
        and returned as a data URL that can be directly used in HTML img tags or saved
        to disk.
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Download image from message
      tags:
      - Chat
  /chat/downloadsticker:
    post:
      consumes:
      - application/json
      description: Download a sticker from a WhatsApp message and return it as base64
        encoded data URL. You need to provide the media information from the received
        message including URL, media key, and file hashes. The sticker is decrypted
        and returned as a data URL (usually WebP format) that can be used directly
        or converted to other formats. Animated stickers are also supported.
