  /admin/global/config:
    get:
      consumes:
      - application/json
      description: Retrieve current global configuration settings from environment
        variables including webhook, RabbitMQ, S3, and skip configurations. Also returns
        documentation about all available environment variables. Admin authentication
        required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get global configuration
      tags:
      - Admin
  /admin/global/config/reload:
    post:
      consumes:
      - application/json
      description: Reload global system configuration from environment variables including
        webhook settings, RabbitMQ configuration, S3 storage settings, and event filtering
        preferences. This allows runtime configuration updates without restarting
        the service. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Reload global configuration
      tags:
      - Admin
  /admin/global/event/test:
    post:
      consumes:
      - application/json
      description: Send a test event through the global webhook and RabbitMQ systems
        to verify event delivery, test configurations, and validate system connectivity.
        The event will be processed by all configured global systems. Admin authentication
        required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send test event through global systems
      tags:
      - Admin
  /admin/global/s3-retention/stats:
    get:
      consumes:
      - application/json
      description: Retrieve statistics about the S3 retention system including objects
        deleted, bytes reclaimed, cycle count, and configuration. Admin authentication
        required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: S3 retention statistics
          schema:
            additionalProperties: true
            type: object
      summary: Get S3 retention statistics
      tags:
      - Admin
  /admin/global/s3-retention/trigger:
    post:
      consumes:
      - application/json
      description: Manually trigger an S3 retention cleanup cycle. This is useful
        for testing or forcing immediate cleanup. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cycle triggered
          schema:
            additionalProperties: true
            type: object
      summary: Trigger S3 retention cycle
      tags:
      - Admin
  /admin/global/stats:
    get:
      consumes:
      - application/json
      description: Retrieve comprehensive statistics about the global webhook and
        RabbitMQ systems including event counts, delivery success rates, response
        times, connection status, and queue information. This provides insights into
        system performance and health. Admin authentication required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get global system statistics
      tags:
      - Admin
  /admin/global/test:
    post:
      consumes:
      - application/json
      description: Test the connectivity and functionality of global webhook and RabbitMQ
        systems by sending test events and verifying delivery. This helps diagnose
        connection issues, configuration problems, and system health. Admin authentication
        required.
      parameters:
      - description: Admin authorization token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Test global systems connectivity
      tags:
