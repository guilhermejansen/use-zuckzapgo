securityDefinitions:
  AdminAuth:
    description: Admin authentication token. Must match ZUCKZAPGO_ADMIN_TOKEN environment
      variable.
    in: header
    name: Authorization
    type: apiKey
  UserAuth:
    description: User authentication token. Can also be passed as query parameter.
    in: header
    name: token
    type: apiKey
swagger: "2.0"
tags:
- description: Administrative functions for user management and global statistics
  name: Admin
- description: WhatsApp session management including connection, QR code, and status
  name: Session
- description: Fail-closed per-session mobile TCP egress through an isolated embedded
    Tailscale node. See /api/network-route-llm.txt.
  name: Session Network Route
- description: Chat operations including sending messages, media, and managing conversations
  name: Chat
- description: User profile management and contact operations
  name: User
- description: WhatsApp group management and operations
  name: Group
- description: WhatsApp community features and administration
  name: Community
- description: Newsletter and channel management features
  name: Newsletter
- description: Privacy settings and security controls
  name: Privacy
- description: Business account features and bot management
  name: Business
- description: Device information and management
  name: Device
- description: Webhook configuration and management
  name: Webhook
