      description: 'Per poll option, the accounts WhatsApp reports as having voted
        for it and when, and how many it reported (returned). Options are keyed by
        vote_hash_hex, the same hex spelling /newsletter/my-reactions returns, so
        the two answers compare directly; leave vote_hash_hex out to ask for every
        option. WhatsApp identifies voters by LID only, with no name and no phone
        number. A voter is NAMED here only when the official apps would name it, which
        is when this session has it in its address book: the apps keep every voter
        but name only contacts, leaving the others unnamed, and this route does the
        same — a row for everyone reported, with lid, display_name and phone_number
        only for the named ones, and voted_at for all of them. returned counts what
        came back within limit, not the poll''s votes, and maybe_more says the limit
        was filled. The default limit is 5000 with one option named and 100 otherwise;
        the official client asks five per option, which it can because it knows the
        poll''s options. vote_hash_hex must be a 32-byte hash in hex (400 otherwise).
        Errors: 400 invalid input, 501 when the bundled library cannot read it, 502
        when WhatsApp refuses. On a client platform that cannot send MEX requests
        the read answers 501 unsupported_client_platform with sent false; retrying
        will not help.'
