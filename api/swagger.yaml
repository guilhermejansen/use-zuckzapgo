        the spelling /newsletter/my-reactions and /newsletter/poll-voters use. A new
        vote replaces the earlier one, and options [] removes it, as the app allows.
        The votes per option in poll take a few minutes to reflect a vote or its removal,
        in the official apps too (seen live: 2 to 3 minutes); /newsletter/poll-voters
        updates first, so read it to confirm a vote right away. Before sending, the
        gateway reads the post and checks what the app checks: 404 post_not_found
        when the channel has no such post, 409 not_a_poll when the post is not a poll,
        409 option_not_in_poll for a name the poll does not list, 409 too_many_options
        for more than one option in a single-choice poll (selectable_options_count
        1), and 409 poll_ended once voting has closed; nothing is sent then. A poll
        that takes two or more options per vote is not limited here, as the app does
        not limit it: the vote goes out and WhatsApp decides. The vote is sent ONCE:
        an unknown outcome answers 504 vote_outcome_unknown with sent true and must
        NOT be retried blindly — read /newsletter/my-reactions first. WhatsApp''s
        refusal answers 502 whatsapp_refused with whatsapp_code. A session that is
        not connected, already when the request arrives or when the vote would go
        out, answers 503 whatsapp_not_connected with sent false: nothing was sent,
        so it can be repeated once the session reconnects. Errors: 400, 404, 409,
        502, 503, 504; every error carries reason and sent.'
