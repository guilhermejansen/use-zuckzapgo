  /newsletter/admin-invite:
    post:
      consumes:
      - application/json
      description: 'Invite a contact to become admin of a channel you own. Like the
        official client, the gateway first creates the invite on the server for the
        invitee''s LID (the server returns the expiration) and only then sends the
        invite message carrying that expiration; a message without the server-side
        invite is shown as "invite cancelled". The invitee must be resolvable to a
        LID (400 otherwise). Errors: 400 invalid input or unknown LID, 501 when the
        bundled library cannot create invites, 502 when WhatsApp refuses the invite
        (e.g. not an owner/admin of the channel). The response adds invitee_lid and
        invite_created; expires_at is the server expiration.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Send admin invite to newsletter
      tags:
      - Newsletter
  /newsletter/admin-invite/accept:
    post:
      consumes:
      - application/json
      description: 'Accept an admin invite this session received for a channel, becoming
        an admin of it. The invite must still exist on the server (the one /newsletter/admin-invite
        registers); WhatsApp refuses an invite that was never created, already used,
        revoked or expired. Errors: 400 invalid input, 501 when the bundled library
        cannot accept invites, 502 when WhatsApp refuses, 504 when the acceptance
        was sent once and not confirmed — do NOT retry; read your role first. A change
        that never left the gateway answers 503 whatsapp_not_connected when the connection
        was lost before it left (a session already disconnected when the request arrives
        gets the usual 500 client not connected), 501 unsupported_client_platform
        or 500 not_sent, all with sent false: retrying is safe.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Channel whose invite to accept
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.NewsletterAdminInviteAcceptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties: true
            type: object
      summary: Accept a channel admin invite
      tags:
      - Newsletter
  /newsletter/admin-invite/revoke:
    post:
      consumes:
      - application/json
      description: 'Cancel an admin invite sent with /newsletter/admin-invite, so
        the invitee can no longer use it to become an admin. The invitee is keyed
        by LID, like the invite creation, so the contact must be resolvable to a LID
        (400 otherwise). The official client offers this to the channel owner only;
        WhatsApp is what enforces it, so a session that is not the owner gets 502
        with the server''s refusal. Errors: 400 invalid input or unknown LID, 501
        when the bundled library cannot revoke invites, 502 when WhatsApp refuses,
        504 when the revocation was sent once and not confirmed — do NOT retry; read
        the pending invites with /newsletter/admins first. A change that never left
        the gateway answers 503 whatsapp_not_connected when the connection was lost
        before it left (a session already disconnected when the request arrives gets
        the usual 500 client not connected), 501 unsupported_client_platform or 500
        not_sent, all with sent false: retrying is safe.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Channel and invitee
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.NewsletterAdminInviteRevokeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties: true
            type: object
      summary: Revoke a channel admin invite you sent
      tags:
      - Newsletter
  /newsletter/admin-profile:
    post:
      consumes:
      - application/json
      description: 'The admin profile is a separate name and picture a channel admin
        may show instead of their personal profile. Send name (and optionally picture)
        to create or change it, or delete true to remove it. The name is checked as
        the official edit screen checks it, before anything is sent: trimmed, at least
        3 characters (counted as the app counts, in UTF-16 code units, so an emoji
        outside the basic plane counts 2), none of ✔ ✅ ☑ ✓, and not starting with
        @. At most 25 characters, counted as the app''s input counts them (WAStringz.length:
        a letter with its combining marks, an emoji with its modifiers, a flag or
        a joined sequence each count 1). picture accepts a base64 data URL or an HTTP(S)
        URL (JPEG, PNG, GIF or WebP) and is converted to a JPEG of at most 640x640,
        as /newsletter/edit does; "picture":"" removes the current picture and leaving
        it out keeps it. The change is sent once and never resent: when the connection
        drops before WhatsApp answers, or the answer does not read, the route answers
        504 because the change may already be applied. Whether the channel shows admin
        profiles at all is /newsletter/admin-profile/setting. Errors: 400 invalid
        input, 404 when WhatsApp answers that the channel is deleted or does not exist,
        423 when it answers that the channel is suspended, 501 when the bundled library
        cannot change it, 502 when WhatsApp refuses, 504 when the outcome is unknown.
        A change that never left the gateway answers 503 whatsapp_not_connected when
        the connection was lost before it left (a session already disconnected when
        the request arrives gets the usual 500 client not connected), 501 unsupported_client_platform
        or 500 not_sent, all with sent false: retrying is safe.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Channel and profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.NewsletterAdminProfileRequest'
      produces:
