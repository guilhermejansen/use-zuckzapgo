  /newsletter/info-invite:
    post:
      consumes:
      - application/json
      description: 'Consulta somente GetNewsletterInfoWithInvite com o contexto da
        requisição. Aceita uma chave ou link https://whatsapp.com/channel/<code> nos
        aliases Code, code, invite_code, NewsletterInviteCode e newsletterInviteCode
        do parser newsletter existente (body, query ou path legado). O convite deve
        ter até 2048 bytes; o body tem limite de 1 MiB. Aliases divergentes ou tipos
        inválidos retornam 400. Não busca ViewerMeta, foto extra nem inscrições: muted,
        role e estado de inscrição são desconhecidos e omitidos. Executa uma chamada
        à primitiva, sem retry adicional no gateway; a política de reconexão herdada
        do core pode reenviar o IQ e postergar a observação do cancelamento durante
        a espera por reconexão. Uma consulta bem-sucedida não indica que a conta segue
        o canal.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Convite pelos aliases existentes; body opcional quando informado
          na query
        in: body
        name: request
        schema:
          $ref: '#/definitions/main.NewsletterTargetRequest'
      - description: Chave ou link de convite (máximo 2048 bytes); também aceita Code
          e invite_code
        in: query
        name: code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/main.NewsletterInviteInfo'
              success:
                type: boolean
            type: object
        "400":
          description: Invalid newsletter invite input
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              success:
                type: boolean
            type: object
        "401":
          description: Missing authenticated user context
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              success:
                type: boolean
            type: object
        "404":
          description: Newsletter not found for invite
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              success:
                type: boolean
            type: object
        "500":
          description: No session or upstream lookup failure
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              success:
                type: boolean
            type: object
      summary: Consultar canal por convite sem seguir ou deixar de seguir
      tags:
      - Newsletter
  /newsletter/insights:
    post:
      consumes:
      - application/json
      description: 'The numbers the official insights screen shows to a channel''s
        owner and admins: accounts reached, followers, follows and unfollows, never
        who they are. Leave metrics out for what the screen reads: UNIQUE_VISITORS_OVER_PERIOD,
        NET_FOLLOWS_OVER_PERIOD, UNIQUE_VISITOR_OVER_PERIOD_BY_ROLE, UNIQUE_VISITOR_OVER_PERIOD_BY_COUNTRY,
        FOLLOWERS_OVER_PERIOD, FOLLOWERS_OVER_PERIOD_BY_COUNTRY, FOLLOWS_PER_DAY and
        UNFOLLOWS_PER_DAY. Every period covers 30 days; the per-day metrics give up
        to 30 days, one value per day with its timestamp. Also available by name:
        the NEW_UNIQUE_VISITORS ones (the app hides them by default), and the _ALL_
        and _CHANNEL_STATUS_ variants, which the app reads only for a channel with
        channel status insights. By role, the values are SUBSCRIBER (followers) and
        GUEST (non-followers). By country, a row with a value under 10, or with no
        country, is left out as the app leaves it out, and hidden_country_rows says
        how many; at most 10 countries are asked for. data_status is available when
        WhatsApp says the numbers are ready and missing otherwise; last_update_time
        is left out when WhatsApp does not say. INSIGHTS ARE A FEATURE WHATSAPP ENABLES
        PER ACCOUNT OR CHANNEL. Before asking, the route checks what the official
        app checks before it opens the insights panel: the session is the owner or
        an admin, and the channel has at least 100 followers, read from the channel
        metadata (also when the channel carries the INSIGHTS capability); when either
        fails it answers 409 insights_not_available with the specific reason and sent
        false: nothing was asked. When the channel cannot be read for that check,
        502 roles_unreadable with sent false; retry is safe. When WhatsApp then answers
        400, the feature is not enabled for this account or channel (the app needs
        channels_producer_insights_enabled or the channel''s INSIGHTS capability):
        409 not_enabled_for_account with sent true; retrying will not help. Repeated
        metrics are read once. Errors: 400 invalid input, 409 insights_not_available
        or not_enabled_for_account, 501 when the bundled library cannot read insights,
        502 when WhatsApp refuses or the channel could not be read for the check.
        On a client platform that cannot send MEX requests the read answers 501 unsupported_client_platform
        with sent false; retrying will not help.'
      parameters:
      - description: User authentication token
        in: header
        name: token
        required: true
        type: string
      - description: Channel and metrics
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.NewsletterInsightsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.NewsletterInsightsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      summary: Read a channel's insights (aggregates only)
      tags:
      - Newsletter
  /newsletter/label-ai-content:
    post:
      consumes:
      - application/json
      description: 'Mark a post, named by the server_id /newsletter/messages returns,
        as AI-generated content, which some regions require for content made or altered
        by AI. content_type is MESSAGE for an ordinary post (the default) and STATUS
        for a channel status post. THE LABEL CANNOT BE REMOVED afterwards: neither
        the official apps nor this API offer a way to take it off. The label is sent
        once and never resent after a dropped connection: when WhatsApp does not confirm
        it (the connection drops before the answer, or the answer does not read or
